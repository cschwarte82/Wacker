  },
  luReset(){S.lu.manual=null;S.luSel=null;saveLocal();render(true);},
  sessF(k){S.sessF=k;S.sessMax=40;render(true);},
  sessMore(){S.sessMax=(S.sessMax||40)+40;render(true);},
  bilAll(){S.bilAll=!S.bilAll;render(true);},
  st(f,v){S.st=S.st||{tab:'tore',per:false};S.st[f]=v;render(true);},
  rk(f,v){S.rk[f]=v;if(f==='cat')S.rk.sess=null;render(true);},
  go(v){S.view=v;render(true);scrollTo(0,0);},
  newSession(){const last=slist()[0];const d=new Date();sessionModal({id:null,date:today(),title:'Testtag '+MONTHS[d.getMonth()],tests:(last&&last.tests?last.tests.slice():DEFAULT_TESTS.slice())});},
  newEval(){const d=new Date();sessionModal({id:null,type:'eval',date:today(),title:'Trainereinschätzung '+MONTHS[d.getMonth()],tests:[]});},
  newGame(){sessionModal({id:null,type:'game',date:today(),title:'Spiel gegen ',result:'',tests:[]});},
  editSession(){const s=S.sessions[S.sessionId];if(!s)return;sessionModal({id:S.sessionId,type:s.type,result:s.result,date:s.date,title:s.title,tests:(s.tests||[]).slice()});},
  togDraft(k,el){const t=S.draft.tests;const i=t.indexOf(k);if(i>=0)t.splice(i,1);else t.push(k);el.classList.toggle('on');},
  saveSession(){
    const d=S.draft;const date=$('#m_date').value||today();let title=$('#m_title').value.trim()||'Testtag';if(/^Spiel gegen$/i.test(title))title='Spiel';
    const game=d.type==='game'||d.type==='eval';
    const tests=game?[]:TESTS.map(t=>t.k).filter(k=>d.tests.includes(k));
    if(!game&&!tests.length){toast('Bitte mindestens einen Test wählen.');return;}
    let id=d.id,doc;
    if(id)doc=clone(S.sessions[id]); else{id=uid('s');doc={results:{},ratings:{},mood:{},notes:{},created:Date.now()};}
    Object.assign(doc,{date,title,tests});
    if(d.type==='game'){doc.type='game';doc.result=($('#m_result').value||'').trim();}
    if(d.type==='eval')doc.type='eval';
    saveDoc('sessions',id,doc);closeModal();
    S.view='session';S.sessionId=id;if(!d.id){S.sessTab=game?'kids':'tests';S.curTest=tests[0];S.kidIdx=0;}
    render(true);
  },
  gameDupAsk(a,b){const A_=S.sessions[a],B_=S.sessions[b];if(!A_||!B_)return;const inf=(s,id)=>{const lv=s.live||{};const n=(lv.actions||[]).length;return `${esc(s.title||'Spiel')}${s.result?' '+esc(s.result):''} · ${n} Aktion${n===1?'':'en'}${s.by===META.dev?' · <b>deine Erfassung</b>':s.by?' · von einem anderen Handy':''}`;};
    showModal(`<h3>Spiel zusammenlegen</h3><div class="sub" style="margin-bottom:10px">Pro Kind zählen die Live-Aktionen aus der Erfassung, die bei diesem Kind mehr Aktionen hat – so zählt nichts doppelt. Wähle, wessen Spielverlauf (Minuten, Tore, Wechsel) bleibt. Fehlende Einschätzungen nach dem Spiel werden ergänzt.</div><button class="btn ${actN(A_)>=actN(B_)?'pri':''}" style="width:100%;margin-bottom:8px;text-align:left" onclick="A.gameDupKeep('${a}','${b}')">${inf(A_)}</button><button class="btn ${actN(B_)>actN(A_)?'pri':''}" style="width:100%;text-align:left" onclick="A.gameDupKeep('${b}','${a}')">${inf(B_)}</button><div class="row end gap" style="margin-top:12px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  async gameDupKeep(keep,drop){const d=S.sessions[drop];if(!d||!S.sessions[keep])return;snapUndo('Doppeltes Spiel zusammengelegt');const k=mergeGameRec(S.sessions[keep],{...d,id:drop}).n;saveDoc('sessions',keep,k);await removeDoc('sessions',drop);closeModal();render(true);toast('Spiel zusammengelegt');},
  undoAsk(){const u=undoInfo();if(!u)return;showModal(`<h3>Rückgängig machen?</h3><div class="sub" style="margin-bottom:12px">„${esc(u.label)}“ von ${new Date(u.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr wird zurückgenommen. Alles, was du seitdem eingegeben hast, geht dabei verloren.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.undoDo()">Rückgängig</button></div>`);},
  undoDo(){const u=undoInfo();if(!u)return;TEAMS=u.teams;CUR=TEAMS[u.cur]?u.cur:Object.keys(TEAMS)[0];loadTeam();try{localStorage.removeItem(UNDOKEY);}catch(e){}META.lastChange=Date.now();saveLocal();closeModal();S.luCache=null;render(true);toast('Zurückgenommen');},
  askDelSession(id){showModal(`<h3>Wirklich löschen?</h3><p>Alle Messwerte, Einschätzungen und Notizen dieses Eintrags gehen verloren.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.delSession('${id}')">Endgültig löschen</button></div>`);},
  async delSession(id){closeModal();S.view='sessions';await removeDoc('sessions',id);render(true);toast('Gelöscht');},
  openSession(id){S.view='session';S.sessionId=id;S.sessTab=['game','eval'].includes(S.sessions[id]?.type)?'kids':'tests';S.curTest=null;S.kidIdx=0;render(true);scrollTo(0,0);},
  sessTab(k){S.sessTab=k;render(true);},
  curTest(k){S.curTest=k;A.swReset();render(true);},
  setVal(pid,el){
    const t=TEST[S.curTest];const n=parseNum(el.value);
    const bad=Number.isNaN(n)||(n!==null&&(n<0||(t.max&&n>t.max)));
    el.classList.toggle('bad',bad);if(bad)return;
    const s=clone(S.sessions[S.sessionId]);s.results=s.results||{};const r=s.results[pid]=s.results[pid]||{};
    if(n===null)delete r[t.k];else r[t.k]=n;
    saveDoc('sessions',S.sessionId,s);const st=$('#stats');if(st)st.innerHTML=statsLine(s,t);
  },
  take(pid,btn){
    if(sw.running){toast('Erst die Stoppuhr anhalten.');return;}
    const v=Math.round(sw.elapsed/10)/100;if(!v){toast('Noch keine Zeit gestoppt.');return;}
    const t=TEST[S.curTest];const s=clone(S.sessions[S.sessionId]);s.results=s.results||{};const r=s.results[pid]=s.results[pid]||{};
    const old=r[t.k];const name=S.players[pid]?.name||'';
    if(isNum(old)&&old<=v){toast(`${fnum(v)} s – bester Wert ${fnum(old)} s bleibt`);}
    else{r[t.k]=v;saveDoc('sessions',S.sessionId,s);const inp=btn.parentElement.querySelector('input');if(inp){inp.value=fnum(v);inp.classList.remove('bad');}const st=$('#stats');if(st)st.innerHTML=statsLine(s,t);toast(`${fnum(v)} s für ${name}`);}
    A.swReset();
  },
  swToggle(){if(sw.running){sw.elapsed=performance.now()-sw.t0;sw.running=false;}else{sw.t0=performance.now();sw.elapsed=0;sw.running=true;requestAnimationFrame(swLoop);}swPaint();},
  swReset(){sw.running=false;sw.elapsed=0;swPaint();},
  kid(d){const n=plist().length;if(!n)return;S.kidIdx=(S.kidIdx+d+n)%n;render(true);},
  kidSel(v){S.kidIdx=+v;render(true);},
  rate(pid,k,n){const s=clone(S.sessions[S.sessionId]);s.ratings=s.ratings||{};const r=s.ratings[pid]=s.ratings[pid]||{};if(r[k]===n)delete r[k];else r[k]=n;saveDoc('sessions',S.sessionId,s);render(true);},
  mood(pid,n){const s=clone(S.sessions[S.sessionId]);s.mood=s.mood||{};if(s.mood[pid]===n)delete s.mood[pid];else s.mood[pid]=n;saveDoc('sessions',S.sessionId,s);render(true);},
  note(pid,el){const s=clone(S.sessions[S.sessionId]);s.notes=s.notes||{};const v=el.value;if(v.trim())s.notes[pid]=v;else delete s.notes[pid];saveDoc('sessions',S.sessionId,s);},
  async shareText(sel){const el=$(sel);if(!el)return;if(navigator.share){try{await navigator.share({text:el.value});}catch(e){}return;}A.copy(sel);},
  copy(sel){
    const el=$(sel);if(!el)return;const txt=el.value;
    const manual=()=>{el.focus();el.select();toast('Bitte markierten Text manuell kopieren.');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'),manual);else manual();}catch(e){manual();}
  },
  openPlayer(id){S.view='player';S.playerId=id;render(true);scrollTo(0,0);},
  playerModal(id){
    const p=id?S.players[id]:{name:'',foot:'rechts',active:true};S.draftP=id||null;
    showModal(`<h3>${id?'Spieler bearbeiten':'Neuer Spieler'}</h3><label>Vorname / Kürzel<input id="m_name" value="${esc(p.name)}" autocomplete="off" onkeydown="if(event.key==='Enter')A.savePlayer(${id?'false':'true'})"></label><label>Starker Fuß<select id="m_foot">${['rechts','links','beide'].map(f=>`<option ${p.foot===f?'selected':''}>${f}</option>`).join('')}</select></label><label>Spielweise<select id="m_stil"><option value="">– keine Angabe –</option>${['offensiv','ausgewogen','defensiv'].map(f=>`<option ${p.stil===f?'selected':''}>${f}</option>`).join('')}</select></label><label>Positionstreue<select id="m_treue"><option value="">– keine Angabe –</option>${[['hoch','hoch – hält seine Position'],['mittel','mittel'],['gering','gering – verlässt oft seine Position']].map(([v,n])=>`<option value="${v}" ${p.treue===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="sub" style="margin:-4px 0 10px">Fließt in den Aufstellungsvorschlag ein, z. B. Abzug für offensive Verteidiger.</div>${id?`<label>Nachricht für den Saison-Rückblick <small class="sub">(optional)</small><textarea id="m_msg" rows="3" placeholder="z. B. Liebe Mia, du hast nie aufgegeben …">${esc(p.msg||'')}</textarea></label><label class="chk"><input type="checkbox" id="m_act" ${p.active!==false?'checked':''}> aktiv im Kader</label><button class="btn" style="width:100%;margin:0 0 12px" onclick="A.mergePick('${id}')">🔗 Mit anderem Kind zusammenführen</button>`:''}<div class="row end gap">${id?`<button class="btn danger" onclick="A.askDelPlayer('${id}')">Löschen</button><span class="grow"></span>`:`<button class="btn" onclick="A.savePlayer(true)">+ Nächster</button>`}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.savePlayer(false)">Speichern</button></div>`);
    setTimeout(()=>{const n=$('#m_name');if(n&&!id)n.focus();},60);
  },
  savePlayer(next){
    const name=$('#m_name').value.trim();if(!name){toast('Bitte einen Namen eingeben.');return;}
    const id=S.draftP||uid('p');
    const p=Object.assign(clone(S.players[id]||{created:Date.now()}),{name,foot:$('#m_foot').value,stil:$('#m_stil').value||null,treue:$('#m_treue').value||null,...($('#m_msg')?{msg:$('#m_msg').value.trim()||null}:{}),active:$('#m_act')?$('#m_act').checked:true});
    saveDoc('players',id,p);closeModal();render(true);
    if(next){toast(name+' angelegt');A.playerModal();}
  },
  mergePick(id){const p=S.players[id];const others=plist(true).filter(q=>q.id!==id);const k=nameKey(p.name).split(' ')[0];others.sort((a,b)=>(nameKey(b.name).startsWith(k)?1:0)-(nameKey(a.name).startsWith(k)?1:0));
    showModal(`<h3>„${esc(p.name)}“ zusammenführen</h3><div class="sub" style="margin-bottom:10px">Mit welchem Kind ist ${esc(p.name)} dasselbe Kind? Alle Bewertungen, Testwerte, Spiele und Ziele landen danach bei einem Eintrag.</div><div class="chips">${others.map(q=>`<button class="chip" onclick="A.mergeAsk('${id}','${q.id}')">${esc(q.name)}</button>`).join('')}</div><div class="row end gap" style="margin-top:14px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  mergeAsk(a,b){const pa=S.players[a],pb=S.players[b];if(!pa||!pb)return;const n=id=>slist().filter(s=>hasData(s,id)).length;
    showModal(`<h3>Zusammenführen</h3><div class="sub" style="margin-bottom:10px">Welcher Name soll bleiben? Die Werte beider Einträge werden zusammengelegt, nichts geht verloren. Gibt es in derselben Bewertung Werte bei beiden, zählt der des bleibenden Eintrags.</div><button class="btn pri" style="width:100%;margin-bottom:8px" onclick="A.mergeDo('${b}','${a}')">„${esc(pa.name)}“ behalten <small>(${n(a)} + ${n(b)} Bewertungen)</small></button><button class="btn pri" style="width:100%" onclick="A.mergeDo('${a}','${b}')">„${esc(pb.name)}“ behalten <small>(${n(b)} + ${n(a)} Bewertungen)</small></button><div class="row end gap" style="margin-top:14px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  mergeDo(src,dst){const nm=S.players[dst]&&S.players[dst].name;snapUndo('Zusammenführen '+nm);mergePlayers(src,dst);closeModal();if(S.playerId===src)S.playerId=dst;S.luCache=null;render(true);toast(`Zusammengeführt: ${nm}`);},
  mergeAllAsk(){const n=dupPairs().length;showModal(`<h3>Alle ${n} zusammenführen?</h3><div class="sub" style="margin-bottom:12px">Pro Paar bleibt der Eintrag mit mehr Bewertungen (bei Gleichstand der ältere). Die Werte beider Einträge werden zusammengelegt. Tipp: vorher eine Sicherung speichern.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.mergeAll()">Zusammenführen</button></div>`);},
  mergeAll(){snapUndo('Alle zusammenführen');let k=0,guard=0;let dp;while((dp=dupPairs()).length&&guard++<200){const[a,b]=dp[0];const n=id=>slist().filter(s=>hasData(s,id)).length;const na=n(a.id),nb=n(b.id);const keepA=na>nb||(na===nb&&(a.created||0)<=(b.created||0));mergePlayers(keepA?b.id:a.id,keepA?a.id:b.id);k++;}closeModal();S.luCache=null;render(true);toast(`${k} Kinder zusammengeführt`);},
  teamMergePick(id){const ids=Object.keys(TEAMS).filter(x=>x!==id);showModal(`<h3>„${esc(TEAMS[id].name)}“ zusammenführen</h3><div class="sub" style="margin-bottom:10px">Alle Spieler, Testtage, Spiele und Archive von „${esc(TEAMS[id].name)}“ wandern in die gewählte Mannschaft. „${esc(TEAMS[id].name)}“ verschwindet danach. Doppelte Kinder führst du anschließend im Kader zusammen.</div>${ids.map(x=>`<button class="btn" style="width:100%;margin-bottom:6px" onclick="A.teamMergeDo('${id}','${x}')">in „${esc(TEAMS[x].name)}“</button>`).join('')}<div class="row end gap" style="margin-top:10px"><button class="btn" onclick="A.teamEdit('${id}')">Zurück</button></div>`);},
  teamMergeDo(src,dst){snapUndo('Mannschaften zusammenführen');const r=mergeTeams(src,dst);CUR=null;A.switchTeam(dst);S.view='players';render(true);toast(`${r.np} Spieler und ${r.ns} Bewertungen übernommen`);},
  askDelPlayer(id){showModal(`<h3>Spieler löschen?</h3><p>Tipp: Wenn ein Kind die Mannschaft verlässt, reicht „aktiv im Kader“ abwählen – dann bleibt der Verlauf erhalten.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.delPlayer('${id}')">Endgültig löschen</button></div>`);},
  async delPlayer(id){
    closeModal();S.view='players';
    for(const s of slist()){if(hasData(s,id)){const d=clone(S.sessions[s.id]);['results','ratings','mood','notes'].forEach(k=>{if(d[k])delete d[k][id];});saveDoc('sessions',s.id,d);}}
    await removeDoc('players',id);render(true);toast('Spieler gelöscht');
  }
};
window.A=A;

// ---------- Start ----------
(function init(){
  loadLocal();S.mode='local';S.ready=true;render(true);
  setTimeout(()=>{const has=Object.keys(S.players).length||Object.keys(S.sessions).length;if(!META.seenVersion&&!has){META.seenVersion=+APP_VERSION;saveLocal();}else if((META.seenVersion||0)<+APP_VERSION)whatsNew(false);},400);
  window.addEventListener('error',e=>{try{toast('⚠ Fehler: '+(e.message||'unbekannt')+' (V'+APP_VERSION+')',6000);}catch(_){}});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloaded)return;reloaded=true;saveLocal();location.reload();});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
  }
})();
</script>
</body>
</html>
