<style>
:root{--fc:'Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;--ft:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;--bg:#f2f4ef;--card:#fff;--ink:#16241b;--mut:#5f6f64;--g:#1d6b3a;--gd:#0f3d22;--lime:#d7f25a;--line:#e1e6dd;--bad:#b4442c;--good:#1d7a3e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font:15px/1.45 var(--ft);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}

nav{display:flex;gap:4px;margin:8px auto 0;max-width:640px}

nav button.on{color:#fff;border-color:var(--lime)}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
h2{font:700 26px var(--fc);margin:4px 0}
h3{font:700 22px var(--fc);margin:0 0 10px}
.row{display:flex;align-items:center}.between{justify-content:space-between;gap:10px}.end{justify-content:flex-end}.gap{gap:8px}.grow{flex:1}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font:inherit;color:inherit}
button.item{cursor:pointer}

.sub{color:var(--mut);font-size:13px}

.empty{text-align:center;color:var(--mut);padding:40px 10px}
.banner{background:#fff4d6;border:1px solid #f0d68a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}

.back{background:none;border:0;color:var(--g);font:600 15px var(--ft);padding:4px 0;cursor:pointer}
.seg{display:flex;background:#e4e9e0;border-radius:10px;padding:3px;margin:12px 0}

.prow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px;margin:6px 0}
.pn{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{width:86px;font:600 18px var(--ft);text-align:right;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}

.u{width:46px;color:var(--mut);font-size:12px}
.sw{text-align:center}

.scale{display:flex;gap:4px}

.mbg{position:fixed;inset:0;background:#0007;z-index:20}

.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mut);margin:4px 0 8px}

.legend i.lp{border-top:2px dashed #8a958d}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0f2ee}

.trow:first-of-type{border-top:0}
.val{font:700 20px var(--fc);min-width:62px;text-align:right}

.note:first-of-type{border-top:0}
.note small{display:block;color:var(--mut)}
details summary{font-weight:600;cursor:pointer}
details textarea{margin-top:8px}
.sel{width:100%;font:600 16px var(--ft);padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);margin:8px 0}
.rk{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #f0f2ee;padding:9px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rk:first-child{border-top:0}
.rn{width:28px;height:28px;border-radius:50%;background:#eef1ea;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.rn.top{background:var(--lime);color:var(--gd)}
.rkn{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column;gap:4px}
.rkn i{display:block;height:6px;border-radius:3px;background:var(--g);opacity:.75}
.rv{font:700 19px var(--fc);white-space:nowrap}
.rv small{font:500 11px var(--ft);color:var(--mut)}
.ov{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #f0f2ee;padding:9px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lbl+.ov{border-top:0}
.ovn{font-weight:600;flex:none;width:112px}
.ovp{font-size:14px;text-align:right}.ovp b{color:var(--g)}
.pitch{background:repeating-linear-gradient(180deg,#2b8a4b 0 44px,#277f45 44px 88px);border-radius:14px;padding:14px 8px;position:relative;margin:10px 0;border:3px solid #1d6b3a}
.pitch:before{content:'';position:absolute;left:8px;right:8px;top:50%;border-top:2px solid #ffffff55}
.pitch:after{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid #ffffff55;border-radius:50%}
.prowl{display:flex;justify-content:space-around;gap:6px;margin:12px 0;position:relative;z-index:1}
.slot{background:#fff;border-radius:10px;padding:6px 8px;min-width:0;flex:1;max-width:120px;text-align:center;box-shadow:0 2px 4px #0003}
.slot b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot small{display:block;font-size:11px;color:var(--mut)}
.slot .fit{font:700 15px var(--fc);color:var(--g)}
.slot.tw{background:var(--lime)}
.slot.est{outline:2px dashed #c2410c}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{background:#eef1ea;border-radius:8px;padding:6px 10px;font-size:13px}
.wt{font-size:13px;color:var(--mut);margin:4px 0}
.btn.sm2{padding:6px 12px;min-height:34px;font-size:13px;white-space:nowrap}
.banner.row{gap:10px}
.teamb{background:var(--lime);color:var(--gd);border:0;border-radius:6px;padding:2px 8px;font:700 15px var(--fc);cursor:pointer;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsel{flex:1;background:none;border:0;text-align:left;font:600 15px var(--ft);color:var(--ink);cursor:pointer;padding:8px 0;min-width:0}
.tsel small{font-weight:400;color:var(--mut)}
.lhead{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.lclock{flex:1;font:700 44px/1 var(--fc);background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--gd);font-variant-numeric:tabular-nums;cursor:pointer}
.lclock.run{color:#c2410c}
.lctl{display:flex;flex-direction:column;gap:6px}
.lctl .btn{min-height:38px;padding:6px 12px}
.btn:disabled{opacity:.4}
.pitch.live{padding:8px 4px}
.pitch.live .prowl{margin:10px 0;gap:3px}
.lslot{background:#fff;border-radius:10px;padding:4px 2px 3px;flex:1;max-width:124px;min-width:0;text-align:center;box-shadow:0 2px 4px #0003;cursor:pointer;border:3px solid transparent}
.lslot.empty{background:#ffffffaa;border:2px dashed #fff}
.lslot.sel,.lb.sel{border-color:var(--lime);box-shadow:0 0 0 3px #d7f25a99}
.lslot.tw{background:#f4fbd6;max-width:130px}
.lslot>b{display:block;font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lslot small{display:block;font-size:9.5px;line-height:1.2;color:var(--mut);white-space:nowrap;overflow:hidden}
.pm{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:3px}
.pm .cnt{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:14px;min-width:16px}
.pm button{flex:0 1 40px;min-width:30px;height:42px;border-radius:9px;border:0;font:700 28px/1 var(--ft);color:#fff;cursor:pointer;flex:none;padding:0}
.pm .lm{background:#b4442c}.pm .lp{background:#1d7a3e}
.pm button:active{transform:scale(.9)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.lbench{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.lb{flex:none;background:#fff;border:3px solid transparent;border-radius:10px;padding:6px 10px;box-shadow:0 1px 3px #0002;cursor:pointer;text-align:center;min-width:78px}
.lb b{display:block;font-size:14px}.lb small{font-size:11px;color:var(--mut)}
button{touch-action:manipulation}
.slot.tap{cursor:pointer;border:3px solid transparent}
.slot.empty{background:#ffffffaa;border:2px dashed #fff}
.slot.sel,.bench span.sel{border-color:var(--lime);box-shadow:0 0 0 3px #d7f25a99}
.bench span.tap{cursor:pointer;border:2px solid transparent}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 24px #0004;padding:12px 12px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .18s;max-width:640px;margin:0 auto}
#sheet.open{transform:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sgrid button{min-height:46px;border-radius:10px;border:0;font:600 13px/1.2 var(--ft);color:#fff;padding:6px;cursor:pointer}
.sgrid.p button{background:#1d7a3e}.sgrid.m button{background:#b4442c}
.sbarw{height:4px;background:#eef1ea;border-radius:2px;margin-top:10px;overflow:hidden}
.sbar{height:100%;width:100%;background:var(--lime)}
.chip.onp{background:#1d7a3e;border-color:#1d7a3e;color:#fff}.chip.onm{background:#b4442c;border-color:#b4442c;color:#fff}
.arow.open{border-color:#f0d68a;background:#fffbef}
.crow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid #f0f2ee}
.crow.big .cn{font-size:15px}.crow.flag{background:#fff7e6;border-radius:6px}
.cn{width:122px;font-size:13px;font-weight:600;flex:none}.cn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.cbars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.cb{height:7px;background:#eef1ea;border-radius:4px;overflow:hidden}.cb i{display:block;height:100%}
.cb i.t{background:var(--gd)}.cb i.a{background:#8fbf3a}
.cv{display:flex;flex-direction:column;font:700 15px/1.1 var(--fc);text-align:right;min-width:28px}.cv .a{color:#5f8a1f}
.legend i.lt{border-top:5px solid var(--gd)}.legend i.la{border-top:5px solid #8fbf3a}
.score{display:flex;align-items:center;gap:8px;margin:6px 0}
.score .sc{flex:1;text-align:center;font:700 34px/1 var(--fc);color:var(--gd)}
.score .btn{min-height:44px;flex:0 0 auto}
.goalb{background:var(--gd)!important;color:#fff!important;border-color:var(--gd)!important}
.concb{color:var(--bad)!important;border-color:#efc9bf!important}
.lmin.ok{color:var(--good);font-weight:700}.lmin.warn{color:#c2410c;font-weight:700}.lmin.low{color:#fff;background:var(--bad);border-radius:4px;padding:0 3px;font-weight:700}
.ampel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.ampel .chip{padding:5px 10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 6px;vertical-align:middle}.dot.ok{background:var(--good)}.dot.warn{background:#c2410c}.dot.low{background:var(--bad)}
.goal{padding:8px 0;border-top:1px solid #f0f2ee}.goal .gt{font-weight:600;font-size:14px}.goal.done .gt{color:var(--good)}
.gx{background:none;border:0;font-size:20px;color:var(--mut);cursor:pointer;padding:0 6px}
.gst{display:flex;gap:4px;margin-top:6px}.gst button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 2px;font:600 12px var(--ft);color:var(--mut);cursor:pointer}
.gst button.on.offen{background:#eef1ea;color:var(--ink);border-color:#cfd6ca}.gst button.on.besser{background:#fff1d6;color:#9a5b00;border-color:#f0d68a}.gst button.on.erreicht{background:#1d7a3e;color:#fff;border-color:#1d7a3e}
.focus{border-top:1px solid #f0f2ee;padding:10px 0}.ex{background:#f5f7f3;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.skarte{background:linear-gradient(160deg,#ffffff 0%,#f4fbd6 100%);border:3px solid var(--gd);border-radius:18px;padding:18px;margin-top:8px}
.skh{display:flex;align-items:center;gap:10px}.skh img{border-radius:10px}.skt{font:700 22px var(--fc);color:var(--gd)}.sks{font-size:12px;color:var(--mut)}
.skn{font:700 40px/1.1 var(--fc);color:var(--gd);margin:12px 0 6px}
.sksec{margin-top:14px}.skl{font-weight:700;color:var(--gd);margin-bottom:4px}.ski{background:#fff;border-radius:10px;padding:8px 10px;margin:5px 0;font-size:14.5px;box-shadow:0 1px 2px #0001}.ski b{display:block;color:var(--g)}

.newrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0 4px}.newrow .btn{padding:8px 4px;font-size:13px;line-height:1.2;hyphens:manual}

<script>
"use strict";
// ---------- Katalog ----------
const TESTS=[
 {k:'sprint10',n:'Sprint 10 m',u:'s',lower:true,area:'tempo',timer:true,hint:'Hochstart an der Linie, Zeit läuft ab der ersten Bewegung. 2 Versuche, der bessere zählt.'},
 {k:'sprint20',n:'Sprint 20 m',u:'s',lower:true,area:'tempo',timer:true,hint:'Wie 10 m, nur auf 20 m. 2 Versuche, der bessere zählt.'},
 {k:'slalom',n:'Slalom ohne Ball',u:'s',lower:true,area:'gewandt',timer:true,hint:'6 Hütchen in einer Linie, je 2 m Abstand. Durch den Slalom hin, gerade zurück. 2 Versuche.'},
 {k:'sprung',n:'Standweitsprung',u:'cm',lower:false,area:'kraft',hint:'Beidbeinig aus dem Stand, gemessen bis zur hinteren Ferse. 3 Versuche, der beste zählt.'},
 {k:'ausdauer',n:'Pendellauf 3 min',u:'Bahnen',lower:false,area:'ausdauer',hint:'Zwei Linien im Abstand von 20 m. 3 Minuten im eigenen Tempo pendeln, gezählt werden volle Bahnen.'},
 {k:'dribbel',n:'Dribbel-Slalom',u:'s',lower:true,area:'technik',timer:true,hint:'Gleicher Slalom wie ohne Ball, jetzt mit Ball. Ball verloren = Versuch wiederholen.'},
 {k:'pass_r',n:'Pass rechts',u:'/10',max:10,lower:false,area:'technik',hint:'10 Pässe mit rechts aus 8 m durch ein 1 m breites Hütchentor. Treffer zählen.'},
 {k:'pass_l',n:'Pass links',u:'/10',max:10,lower:false,area:'technik',hint:'10 Pässe mit links aus 8 m durch ein 1 m breites Hütchentor. Treffer zählen.'},
 {k:'annahme',n:'Ballannahme',u:'/10',max:10,lower:false,area:'technik',hint:'Du spielst 10 Bälle flach zu. Gezählt: Ball mit dem ersten Kontakt in einer 2×2-m-Zone kontrolliert.'},
 {k:'schuss',n:'Torschuss Ecken',u:'/10',max:10,lower:false,area:'technik',hint:'10 Schüsse aus 11 m aufs leere Tor, Ecken mit Hütchen markiert. Treffer in den Ecken zählen.'},
 {k:'jonglieren',n:'Jonglieren',u:'Kontakte',lower:false,area:'technik',hint:'Ball hochhalten, Hände nur zum Start. 3 Versuche, der beste zählt.'},
 {k:'tw_fangen',n:'TW: Fangen',u:'/10',max:10,lower:false,area:'torwart',hint:'10 Bälle aus 6 m geworfen oder geschossen – 4 flach, 3 in Brusthöhe, 3 hoch. Gezählt: sicher gefangen (nicht nur abgewehrt).'},
 {k:'tw_reaktion',n:'TW: Reaktion',u:'/10',max:10,lower:false,area:'torwart',hint:'10 Schüsse aus 5 m, Ecke erst im letzten Moment gewählt. Gezählt: gehalten oder abgewehrt.'},
 {k:'tw_abwurf',n:'TW: Abwurf/Abstoß',u:'/10',max:10,lower:false,area:'torwart',hint:'10 Versuche (5 Abwürfe, 5 Abstöße) in eine 5×5-m-Zielzone an der Mittellinie bzw. zum Mitspieler. Treffer zählen.'}
];
const TEST=Object.fromEntries(TESTS.map(t=>[t.k,t]));
const GK_RATINGS=[{k:'tw_reak',n:'Reaktion'},{k:'tw_fang',n:'Fangen / Ballsicherheit'},{k:'tw_stell',n:'Stellungsspiel'},{k:'tw_raus',n:'Herauslaufen / 1 gegen 1'},{k:'tw_eroeff',n:'Abwurf / Spieleröffnung'},{k:'tw_komm',n:'Kommandos / Mut'}];
const RATINGS=[{k:'spielv',n:'Spielverständnis'},{k:'frei',n:'Freilaufen / Anbieten'},{k:'zweik',n:'Zweikampfverhalten'},{k:'ueber',n:'Übersicht'},{k:'mut',n:'Mut / Durchsetzung'},{k:'komm',n:'Kommunikation'}];
const AREAS=[{k:'tempo',n:'Tempo'},{k:'gewandt',n:'Gewandtheit'},{k:'kraft',n:'Sprungkraft'},{k:'ausdauer',n:'Ausdauer'},{k:'technik',n:'Technik'},{k:'spiel',n:'Spielverhalten',s:'Spiel'}];
const TEST_GROUPS=[{k:'tempo',n:'Tempo'},{k:'gewandt',n:'Gewandtheit'},{k:'kraft',n:'Sprungkraft'},{k:'ausdauer',n:'Ausdauer'},{k:'technik',n:'Technik'},{k:'torwart',n:'Torwart'}];
const MOODS=['😟','🙁','😐','🙂','😄'];
const DEFAULT_TESTS=['sprint10','slalom','dribbel','pass_r','pass_l'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const LSKEY='u10-leistungsprofil-v1';
const APP_VERSION='12';

// ---------- Helfer ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum=v=>typeof v==='number'&&isFinite(v);
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=s=>{if(!s)return'';const[y,m,d]=s.split('-');return `${d}.${m}.${y}`};
const fnum=v=>isNum(v)?v.toLocaleString('de-DE',{maximumFractionDigits:2}):'';
const parseNum=s=>{s=String(s).trim().replace(',','.');if(s==='')return null;if(!/^-?\d*\.?\d+$/.test(s))return NaN;return parseFloat(s)};

// ---------- Zustand ----------
const S={players:{},sessions:{},view:'sessions',sessionId:null,sessTab:'tests',curTest:null,kidIdx:0,playerId:null,ready:false,mode:'db',loadNote:'',pending:false,rk:{cat:null,mode:'best',sess:null},lu:{n:6,form:'2-3-1',mode:'stark',keeper:null,absent:{}}};
let db=null;

const plist=all=>Object.entries(S.players).map(([id,p])=>({...p,id})).filter(p=>all||p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||'','de'));
const slist=()=>Object.entries(S.sessions).map(([id,s])=>({...s,id})).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
function hasData(s,pid){
  const r=s.results?.[pid]; if(r&&Object.values(r).some(isNum))return true;
  const q=s.ratings?.[pid]; if(q&&Object.values(q).some(isNum))return true;
  const lv=s.live;if(lv&&((lv.plus||{})[pid]||(lv.minus||{})[pid]||(lv.mins||{})[pid]))return true;
  return isNum(s.mood?.[pid])||!!s.notes?.[pid];
}

// ---------- Speichern (auf diesem Gerät) ----------
const METAKEY='u10-meta-v1',LSKEY2='u10-leistungsprofil-v2';
let META={lastBackup:0,lastChange:0};
let TEAMS={},CUR=null;
function setSaving(){}
function syncTeam(){if(CUR&&TEAMS[CUR]){TEAMS[CUR].players=S.players;TEAMS[CUR].sessions=S.sessions;TEAMS[CUR].live=S.live||null;TEAMS[CUR].lu=S.lu;TEAMS[CUR].cfg=S.cfg;}}
function saveLocal(){
  syncTeam();
  try{localStorage.setItem(LSKEY2,JSON.stringify({current:CUR,teams:TEAMS}));localStorage.setItem(METAKEY,JSON.stringify(META));}
  catch(e){toast('Speichern auf dem Gerät fehlgeschlagen – bitte Sicherung erstellen.');}
}
function saveDoc(col,id,data){S[col][id]=data;META.lastChange=Date.now();saveLocal();}
async function removeDoc(col,id){delete S[col][id];META.lastChange=Date.now();saveLocal();}
function loadTeam(){const t=TEAMS[CUR];t.players=t.players||{};t.sessions=t.sessions||{};S.players=t.players;S.sessions=t.sessions;S.live=t.live||null;S.liveSel=null;S.lu=t.lu||{n:6,form:'2-3-1',mode:'stark',keeper:null,absent:{},manual:null};S.lu.absent=S.lu.absent||{};S.luSel=null;S.luCache=null;S.cfg=t.cfg||{minShare:50};}
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem(LSKEY2)||'null');if(d&&d.teams){TEAMS=d.teams;CUR=d.current;}}catch(e){}
  if(!Object.keys(TEAMS).length){
    let old=null;try{old=JSON.parse(localStorage.getItem(LSKEY)||'null');}catch(e){}
    const id=uid('t');TEAMS[id]={name:'U10',players:(old&&old.players)||{},sessions:(old&&old.sessions)||{},created:Date.now()};CUR=id;
  }

// ---------- Auswertung ----------
function testScore(s,k,pid){
  const t=TEST[k]; const v=s.results?.[pid]?.[k]; if(!t||!isNum(v))return null;
  const vals=Object.values(s.results||{}).map(r=>r&&r[k]).filter(isNum);
  if(vals.length<3)return 3;
  const m=avg(vals); const sd=Math.sqrt(avg(vals.map(x=>(x-m)**2)));
  if(sd===0)return 3;
  let z=(v-m)/sd; if(t.lower)z=-z;
  return Math.max(1,Math.min(5,3+z));
}
function areaScore(s,pid,ak){
  if(ak==='spiel'){const r=s.ratings?.[pid]||{};const vs=RATINGS.map(x=>r[x.k]).filter(isNum);return vs.length?avg(vs):null;}
  const sc=(s.tests||[]).filter(k=>TEST[k]&&TEST[k].area===ak).map(k=>testScore(s,k,pid)).filter(x=>x!=null);
  if(ak==='torwart'){const r=s.ratings?.[pid]||{};GK_RATINGS.forEach(x=>{if(isNum(r[x.k]))sc.push(r[x.k]);});}
  return sc.length?avg(sc):null;
}
function statsLine(s,t){
  const ps=plist(); const vals=ps.map(p=>s.results?.[p.id]?.[t.k]).filter(isNum);
  if(!vals.length)return `0 von ${ps.length} erfasst`;
  const best=t.lower?Math.min(...vals):Math.max(...vals);
  return `${vals.length} von ${ps.length} erfasst · Schnitt ${fnum(Math.round(avg(vals)*100)/100)} ${esc(t.u)} · bester Wert ${fnum(best)}`;
}

// ---------- Grafiken ----------
function radar(cur,prev){
  const W=360,H=300,cx=180,cy=150,R=100,n=AREAS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;const r=R*(v||0)/5;return[+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)];};
  let g='';
  for(let l=1;l<=5;l++)g+=`<polygon points="${AREAS.map((_,i)=>pt(i,l).join(',')).join(' ')}" class="grid${l===3?' mid':''}"/>`;
  AREAS.forEach((a,i)=>{
    const[x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="grid"/>`;
    const[lx,ly]=pt(i,5.9);const anc=Math.abs(lx-cx)<5?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" dominant-baseline="middle" class="rl${cur[i]==null?' na':''}">${esc(a.s||a.n)}</text>`;
  });
  const poly=(vals,cls)=>`<polygon points="${vals.map((v,i)=>pt(i,v??0).join(',')).join(' ')}" class="${cls}"/>`;
  if(prev.some(x=>x!=null))g+=poly(prev,'pp');
  g+=poly(cur,'pc');
  cur.forEach((v,i)=>{if(v!=null){const[x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3.5" class="pd"/>`;}});
  return `<svg viewBox="0 0 ${W} ${H}" class="radar" role="img" aria-label="Stärkenprofil">${g}</svg>`;
}
function spark(vals,lower,min,max){
  const w=96,h=34,p=4;
  if(!vals.length)return'';
  let lo=min??Math.min(...vals),hi=max??Math.max(...vals); if(hi===lo){hi+=1;lo-=1;}
  const pts=vals.map((v,i)=>{const x=vals.length===1?w/2:p+i*(w-2*p)/(vals.length-1);let f=(v-lo)/(hi-lo);if(lower)f=1-f;return[x.toFixed(1),(h-p-f*(h-2*p)).toFixed(1)];});
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}">${pts.length>1?`<polyline points="${pts.map(q=>q.join(',')).join(' ')}"/>`:''}<circle cx="${last[0]}" cy="${last[1]}" r="3"/></svg>`;
}

  if(grows){const g=latestVal('a:torwart',pid,ss.slice().reverse());h+=`<div class="card"><div class="lbl">Torwart${isNum(g)?` <small>gesamt ${fnum(Math.round(g*10)/10)} / 5</small>`:''}</div>${grows}</div>`;}
  const ms=ss.filter(s=>isNum(s.mood?.[pid]));

  if(lg.length){const tot=lg.reduce((a,s)=>{const b=gameBal(s.live,pid);a.t+=b.tore;a.f+=b.gf;a.a+=b.ga;a.m+=(s.live.mins||{})[pid]||0;return a;},{t:0,f:0,a:0,m:0});
    h+=`<div class="card"><div class="lbl">Live-Bilanz <small>${lg.length} Spiel${lg.length===1?'':'e'} · ${tot.m} Min. · ⚽ ${tot.t} · Tore auf dem Feld ${tot.f}:${tot.a}</small></div>${lg.slice().reverse().map(s=>{const b=gameBal(s.live,pid);return `<div class="trow"><div><div class="t2">${esc(s.title)}${s.result?' · '+esc(s.result):''}</div><div class="sub">${fdate(s.date)} · ${(s.live.mins||{})[pid]||0} Min.${s.live.goals?` · ⚽ ${b.tore} · auf dem Feld ${b.gf}:${b.ga}`:''}</div></div><div class="val"><span class="pos">+${(s.live.plus||{})[pid]||0}</span> <span class="neg">−${(s.live.minus||{})[pid]||0}</span></div></div>`;}).join('')}</div>`;}
  const notes=ss.filter(s=>s.notes?.[pid]).map(s=>`<div class="note"><small>${fdate(s.date)}</small>${esc(s.notes[pid])}</div>`).join('');
  if(notes)h+=`<div class="card"><div class="lbl">Notizen</div>${notes}</div>`;

// ---------- Ranglisten ----------
const CATS=[{g:'Tests',items:TESTS.map(t=>({id:'t:'+t.k,n:t.n}))},{g:'Bereiche (Stärkenprofil)',items:AREAS.map(a=>({id:'a:'+a.k,n:a.n}))},{g:'Trainer-Einschätzung',items:RATINGS.map(r=>({id:'r:'+r.k,n:r.n}))},{g:'Spiele (Live)',items:[{id:'g:tore',n:'Tore'},{id:'g:bil',n:'Tor-Bilanz auf dem Feld'}]},{g:'Torwart',items:[{id:'a:torwart',n:'Torwart gesamt'},...GK_RATINGS.map(r=>({id:'r:'+r.k,n:'TW: '+r.n}))]}];
function catVal(s,cat,pid){const[t,k]=cat.split(':');if(t==='g'){const lv=s.live;if(!lv||!lv.goals)return null;const played=((lv.mins||{})[pid]||0)>0||lv.goals.some(g=>(g.on||[]).includes(pid));if(!played)return null;const b=gameBal(lv,pid);return k==='tore'?b.tore:b.gf-b.ga;}if(t==='t')return s.results?.[pid]?.[k];if(t==='a')return areaScore(s,pid,k);return s.ratings?.[pid]?.[k];}
function catMeta(cat){const[t,k]=cat.split(':');if(t==='g')return{u:k==='tore'?'Tore':'',lower:false};if(t==='t')return{u:TEST[k].u,lower:!!TEST[k].lower};if(t==='a')return{u:'',lower:false};return{u:'/5',lower:false};}
function sessionsWith(cat){const ps=plist(true);return slist().filter(s=>ps.some(p=>isNum(catVal(s,cat,p.id))));}
function latestVal(cat,pid,ss){const multi=cat.startsWith('r:')||cat==='a:spiel'||cat==='a:torwart';const vals=[];for(const s of ss){const v=catVal(s,cat,pid);if(isNum(v)){if(!multi)return v;vals.push(v);if(vals.length===3)break;}}return vals.length?avg(vals):null;}
function topOverview(){
  const ps=plist();
  const items=AREAS.map(a=>{const cat='a:'+a.k,ss=sessionsWith(cat);const rows=ps.map(p=>({p,v:latestVal(cat,p.id,ss)})).filter(r=>isNum(r.v)).sort((x,y)=>y.v-x.v).slice(0,3);return{a,cat,rows};}).filter(x=>x.rows.length);
  if(!items.length)return'';
  return `<div class="card"><div class="lbl">Aktuell vorne je Bereich <small>letzter Wert je Kind</small></div>${items.map(x=>`<button class="ov" onclick="A.rk('cat','${x.cat}')"><span class="ovn">${esc(x.a.n)}</span><span class="ovp">${x.rows.map((r,i)=>`<b>${i+1}.</b> ${esc(r.p.name)}`).join(' &nbsp;')}</span></button>`).join('')}</div>`;
}
function vRank(){
  const R=S.rk;
  if(!R.cat||!sessionsWith(R.cat).length){const f=CATS.flatMap(g=>g.items).find(i=>sessionsWith(i.id).length);R.cat=f?f.id:'t:'+TESTS[0].k;}
  const type=R.cat[0];if(type==='a'||type==='g')R.mode='best';const meta=catMeta(R.cat);
  let h=`<h2>Ranglisten</h2><div class="sub">Nur für dich als Trainer sichtbar. Tipp: Zum Zeigen eignet sich eher die Fortschritts-Rangliste.</div>`;
  h+=topOverview();
  h+=`<select class="sel" onchange="A.rk('cat',this.value)">${CATS.map(g=>`<optgroup label="${esc(g.g)}">${g.items.map(i=>`<option value="${i.id}" ${i.id===R.cat?'selected':''}>${esc(i.n)}</option>`).join('')}</optgroup>`).join('')}</select>`;
  if(type!=='a'&&type!=='g')h+=`<div class="seg">${[['best','Bestwerte'],['progress','Fortschritt']].map(([k,n])=>`<button class="${R.mode===k?'on':''}" onclick="A.rk('mode','${k}')">${n}</button>`).join('')}</div>`;
  const ps=plist(),ss=sessionsWith(R.cat);
  if(!ss.length)return h+`<div class="empty">Für diese Kategorie gibt es noch keine Werte.</div>`;
  let rows,note='',unit=meta.u;
  if(R.mode==='best'){
    const s=ss.find(x=>x.id===R.sess);
    h+=`<select class="sel" onchange="A.rk('sess',this.value)"><option value="cur" ${s?'':'selected'}>Aktuell</option>${ss.map(x=>`<option value="${x.id}" ${s&&x.id===s.id?'selected':''}>${fdate(x.date)} – ${x.type==='game'?'⚽ ':x.type==='eval'?'📝 ':''}${esc(x.title)}</option>`).join('')}</select>`;
    rows=ps.map(p=>({p,v:s?catVal(s,R.cat,p.id):(type==='g'?(()=>{let t=null;ss.forEach(x=>{const v=catVal(x,R.cat,p.id);if(isNum(v))t=(t||0)+v;});return t;})():latestVal(R.cat,p.id,ss))}));
    if(!s)note=type==='g'?(R.cat==='g:tore'?'Summe aller Spiele mit Live-Erfassung.':'Tore minus Gegentore, während das Kind auf dem Feld stand – Summe aller Live-Spiele.'):(type==='t'?'Pro Kind zählt die jeweils letzte Messung – so fehlt niemand, der beim letzten Testtag krank war.':'Einschätzungen: Schnitt der letzten 3 Bewertungen je Kind (Testtage, Spiele und Einschätzungen).');
    if(type==='a')note+=(note?' ':'')+'Wert 3 = Teamschnitt am jeweiligen Testtag.';
  }else{
    const asc=ss.slice().reverse();
    rows=ps.map(p=>{const vals=asc.map(s=>catVal(s,R.cat,p.id)).filter(isNum);if(vals.length<2)return{p,v:null};let d=vals[vals.length-1]-vals[0];if(meta.lower)d=-d;return{p,v:(Math.round(d*100)/100)||0};});
    if(type==='r')unit='Pkt.';
    note=(meta.lower?`Wie viel schneller (in ${unit}) zwischen erster und letzter Messung.`:'Verbesserung zwischen erster und letzter Messung.')+' Erscheint ab zwei Messungen.';
  }
  const lowerBetter=R.mode==='best'&&meta.lower;
  const have=rows.filter(r=>isNum(r.v)).sort((a,b)=>lowerBetter?a.v-b.v:b.v-a.v),miss=rows.filter(r=>!isNum(r.v));
  let rank=0;have.forEach((r,i)=>{if(i===0||r.v!==have[i-1].v)rank=i+1;r.rank=rank;});
  const vs=have.map(r=>r.v),mn=Math.min(...vs),mx=Math.max(...vs);
  const bar=v=>{if(mx===mn)return 100;let f=(v-mn)/(mx-mn);if(lowerBetter)f=1-f;return 12+88*f;};
  if(note)h+=`<div class="sub" style="margin:6px 0">${note}</div>`;
  if(have.length)h+=`<div class="card">${have.map(r=>`<button class="rk" onclick="A.openPlayer('${r.p.id}')"><span class="rn ${r.rank<=3?'top':''}">${r.rank}</span><span class="rkn">${esc(r.p.name)}<i style="width:${bar(r.v).toFixed(0)}%"></i></span><span class="rv">${(R.mode==='progress'||R.cat==='g:bil')&&r.v>0?'+':''}${fnum(type==='a'?Math.round(r.v*10)/10:r.v)}<small> ${esc(unit)}</small></span></button>`).join('')}</div>`;
  else h+=`<div class="empty">Noch niemand mit zwei Messungen.</div>`;
  if(miss.length)h+=`<div class="sub">Ohne Wert: ${miss.map(r=>esc(r.p.name)).join(', ')}</div>`;
  return h;
}

// ---------- Aufstellung ----------
const FORMS={4:{'2-2':['A-L','A-R','S-L','S-R'],'1-2-1':['A-Z','M-L','M-R','S-Z']},5:{'2-2-1':['A-L','A-R','M-L','M-R','S-Z'],'2-1-2':['A-L','A-R','M-Z','S-L','S-R'],'3-1-1':['A-L','A-Z','A-R','M-Z','S-Z']},6:{'2-3-1':['A-L','A-R','M-L','M-Z','M-R','S-Z'],'3-2-1':['A-L','A-Z','A-R','M-L','M-R','S-Z'],'2-2-2':['A-L','A-R','M-L','M-R','S-L','S-R'],'3-1-2':['A-L','A-Z','A-R','M-Z','S-L','S-R']}};
const POS={
  A:{n:'Abwehr',w:{'r:zweik':.3,'r:spielv':.2,'r:komm':.15,'a:tempo':.2,'a:kraft':.15}},
  M:{n:'Mittelfeld',w:{'a:ausdauer':.25,'a:technik':.25,'r:ueber':.2,'r:spielv':.15,'r:frei':.15}},
  S:{n:'Sturm',w:{'a:tempo':.25,'a:technik':.25,'a:gewandt':.1,'r:mut':.2,'r:frei':.2}}
};
const SIDE={L:'links',R:'rechts',Z:'zentral'};
const catName=c=>{const[t,k]=c.split(':');return t==='a'?AREAS.find(a=>a.k===k).n:[...RATINGS,...GK_RATINGS].find(r=>r.k===k).n;};
function profileOf(pid){const pr={};const keys=new Set();Object.values(POS).forEach(P=>Object.keys(P.w).forEach(c=>keys.add(c)));keys.forEach(c=>{pr[c]=latestVal(c,pid,sessionsWith(c));});return pr;}
function posFit(pr,pt){let s=0,w=0;for(const[c,wt]of Object.entries(POS[pt].w)){if(isNum(pr[c])){s+=pr[c]*wt;w+=wt;}}return{v:w?s/w:3,cov:w};}
function slotFit(p,pr,slot){const[pt,sd]=slot.split('-');const f=posFit(pr,pt);let b=0;if(sd==='L'&&p.foot==='links')b=.15;if(sd==='R'&&p.foot==='rechts')b=.1;if(sd!=='Z'&&p.foot==='beide')b=.1;return{v:f.v+b,cov:f.cov};}
function bestLineup(slots,players,mode){
  const n=players.length,k=slots.length;if(n<k)return null;
  const F=players.map(p=>slots.map(s=>slotFit(p,p._pr,s).v));
  const maxRest=[];for(let i=k;i>=0;i--)maxRest[i]=i===k?0:maxRest[i+1]+Math.max(...F.map(r=>r[i]));
  let best=null,bS=-Infinity,bMin=-Infinity;const used=new Array(n).fill(false),cur=[];
  (function rec(i,sum,min){
    if(i===k){const ok=mode==='stark'?sum>bS:(min>bMin+1e-9||(Math.abs(min-bMin)<1e-9&&sum>bS));if(ok){bS=sum;bMin=min;best=cur.slice();}return;}
    if(mode==='stark'&&sum+maxRest[i]<=bS)return;
    if(mode!=='stark'&&min<bMin-1e-9)return;
    for(let j=0;j<n;j++){if(used[j])continue;used[j]=true;cur.push(j);rec(i+1,sum+F[j][i],Math.min(min,F[j][i]));cur.pop();used[j]=false;}
  })(0,0,Infinity);
  return best.map((j,i)=>({p:players[j],slot:slots[i],f:F[j][i]}));
}
function vLineup(){
  const L=S.lu;const all=plist();
  if(!FORMS[L.n][L.form])L.form=Object.keys(FORMS[L.n])[0];
  let h=`<h2>Aufstellung</h2><div class="sub">Vorschlag auf Basis der letzten Werte je Kind. Die Entscheidung bleibt deine.</div>`;
  h+=`<div class="seg">${[4,5,6].map(n=>`<button class="${L.n===n?'on':''}" onclick="A.lu('n',${n})">${n} + 1</button>`).join('')}</div>`;
  h+=`<div class="chips">${Object.keys(FORMS[L.n]).map(f=>`<button class="chip ${L.form===f?'on':''}" onclick="A.lu('form','${f}')">${f}</button>`).join('')}</div>`;
  h+=`<div class="seg">${[['stark','Stärkste'],['ausgewogen','Ausgewogen']].map(([k,n])=>`<button class="${L.mode===k?'on':''}" onclick="A.lu('mode','${k}')">${n}</button>`).join('')}</div>`;
  h+=`<div class="sub">${L.mode==='stark'?'Höchste Gesamtstärke – kann eine schwächere Position in Kauf nehmen.':'Keine Schwachstelle – die schwächste Position wird so stark wie möglich besetzt.'}</div>`;
  h+=`<div class="lbl2">Wer ist heute dabei?</div><div class="chips">${all.map(p=>`<button class="chip ${L.absent[p.id]?'':'on'}" onclick="A.luAbs('${p.id}')">${esc(p.name)}</button>`).join('')}</div>`;
  const here=all.filter(p=>!L.absent[p.id]);
  if(L.keeper&&L.keeper!=='auto'&&!here.some(p=>p.id===L.keeper))L.keeper=null;
  const gkS=pid=>latestVal('a:torwart',pid,sessionsWith('a:torwart'));
  const gkList=here.map(p=>({p,v:gkS(p.id)})).filter(x=>isNum(x.v)).sort((a,b)=>b.v-a.v);
  const kid=L.keeper==='auto'?(gkList[0]?gkList[0].p.id:null):L.keeper;
  h+=`<div class="lbl2">Torwart</div><select class="sel" onchange="A.lu('keeper',this.value||null)"><option value="">– kein fester Torwart –</option><option value="auto" ${L.keeper==='auto'?'selected':''}>Automatisch: bester Torwart${gkList[0]?' ('+esc(short(gkList[0].p.id))+')':' (noch keine Daten)'}</option>${here.map(p=>{const v=gkS(p.id);return `<option value="${p.id}" ${L.keeper===p.id?'selected':''}>${esc(p.name)}${isNum(v)?' · TW '+fnum(Math.round(v*10)/10):''}</option>`;}).join('')}</select>`;
  const slots=FORMS[L.n][L.form];
  const field=here.filter(p=>p.id!==kid).map(p=>({...p,_pr:profileOf(p.id)}));
  if(field.length<slots.length)return h+`<div class="empty">Für ${L.n} Feldspieler sind nur ${field.length} Kinder ausgewählt.</div>`;
  if(field.length>16)return h+`<div class="empty">Bitte höchstens 16 Feldspieler auswählen.</div>`;
  const key=JSON.stringify([slots,field.map(p=>p.id),L.mode,META.lastChange]);
  if(!S.luCache||S.luCache.key!==key)S.luCache={key,res:bestLineup(slots,field,L.mode)};
  const res=S.luCache.res;
  const M=L.manual&&L.manual.n===L.n&&L.manual.form===L.form?L.manual:null;
  const hereIds=new Set(here.map(p=>p.id));
  if(M){Object.keys(M.pos).forEach(k=>{if(M.pos[k]&&!hereIds.has(M.pos[k]))M.pos[k]=null;});slots.forEach(k=>{if(!(k in M.pos))M.pos[k]=null;});}
  const prof={};field.forEach(p=>prof[p.id]=p._pr);
  const cur=M?M.pos:(()=>{const o={};slots.forEach(k=>o[k]=null);res.forEach(r=>o[r.slot]=r.p.id);o.TW=kid||null;return o;})();
  const getPr=pid=>prof[pid]||(prof[pid]=profileOf(pid));
  const fitOf=(pid,slot)=>slotFit({...S.players[pid],id:pid},getPr(pid),slot);
  const sel=S.luSel,isSel=(k,key)=>sel&&sel.kind===k&&sel.key===key;
  const card=k=>{
    const pid=cur[k];
    if(k==='TW')return `<div class="slot tw tap ${isSel('slot','TW')?'sel':''}" onclick="A.luTap('slot','TW')"><b>${pid?esc(S.players[pid].name):'–'}</b><small>Torwart</small></div>`;
    const[pt,sd]=k.split('-');
    if(!pid)return `<div class="slot tap empty ${isSel('slot',k)?'sel':''}" onclick="A.luTap('slot','${k}')"><b>frei</b><small>${POS[pt].n} ${SIDE[sd]}</small></div>`;
    const f=fitOf(pid,k);return `<div class="slot tap ${f.cov<.5?'est':''} ${isSel('slot',k)?'sel':''}" onclick="A.luTap('slot','${k}')"><b>${esc(S.players[pid].name)}</b><small>${POS[pt].n} ${SIDE[sd]}</small><span class="fit">${fnum(Math.round(f.v*10)/10)}</span></div>`;
  };
  const order=['L','Z','R'];const line=pt=>slots.filter(k=>k[0]===pt).sort((a,b)=>order.indexOf(a[2])-order.indexOf(b[2]));
  h+=M?`<div class="row between" style="margin-top:12px"><b>✎ Eigene Aufstellung</b><button class="btn sm2" onclick="A.luReset()">Vorschlag wiederherstellen</button></div>`:`<div class="sub" style="margin-top:12px">Tipp: Spieler antippen, dann Ziel antippen – so passt du den Vorschlag selbst an.</div>`;
  if(sel)h+=`<div class="sub"><b>Jetzt Ziel antippen:</b> Feldspieler = Positionen tauschen, Wechselspieler = einsetzen. Nochmal antippen = abbrechen.</div>`;
  h+=`<div class="pitch">${['S','M','A'].map(pt=>{const l=line(pt);return l.length?`<div class="prowl">${l.map(card).join('')}</div>`:'';}).join('')}<div class="prowl">${card('TW')}</div></div>`;
  const filled=slots.filter(k=>cur[k]);const vals=filled.map(k=>fitOf(cur[k],k).v);
  if(vals.length)h+=`<div class="sub">Durchschnitt ${fnum(Math.round(avg(vals)*10)/10)} · schwächste Position ${fnum(Math.round(Math.min(...vals)*10)/10)} (Skala 1–5, 3 ≈ Teamschnitt)${filled.length<slots.length?` · ${slots.length-filled.length} Position(en) frei`:''}</div>`;
  const used=new Set(Object.values(cur).filter(Boolean));const bench=here.filter(p=>!used.has(p.id));
  S.luRes={res:filled.map(k=>({p:{id:cur[k]},slot:k})),keeper:cur.TW||null,bench:bench.map(p=>p.id),n:L.n,form:L.form};
  h+=`<button class="btn pri" style="width:100%;margin:10px 0 0" onclick="A.liveFromLineup()">▶ Live mit dieser Aufstellung</button>`;
  if(bench.length)h+=`<div class="card"><div class="lbl">Wechselspieler <small>beste Position · antippen zum Einsetzen</small></div><div class="bench">${bench.map(p=>{const b=['A','M','S'].map(pt=>({pt,v:posFit(getPr(p.id),pt).v})).sort((x,y)=>y.v-x.v)[0];return `<span class="tap ${isSel('bench',p.id)?'sel':''}" onclick="A.luTap('bench','${p.id}')"><b>${esc(p.name)}</b> · ${POS[b.pt].n} ${fnum(Math.round(b.v*10)/10)}</span>`;}).join('')}</div></div>`;
  const est=filled.filter(k=>fitOf(cur[k],k).cov<.5).map(k=>esc(S.players[cur[k]].name));
  if(est.length)h+=`<div class="banner">Gestrichelt = wenig Daten, Wert teilweise geschätzt: ${est.join(', ')}. Fehlende Bereiche zählen als Teamschnitt (3).</div>`;
  h+=`<details class="card"><summary>So rechnet die App</summary>${Object.values(POS).map(P=>`<div class="wt"><b>${P.n}:</b> ${Object.entries(P.w).map(([c,w])=>`${catName(c)} ${Math.round(w*100)} %`).join(', ')}</div>`).join('')}<div class="wt">Bonus: starker Fuß passend zur Seite (+0,1 bis +0,15). Messwerte zählen relativ zum Team (3 = Schnitt), deine Einschätzung direkt (1–5). Je Bereich gilt der letzte Messwert des Kindes, bei deiner Einschätzung der Schnitt der letzten 3 Bewertungen (Testtage, Spiele und Einschätzungen).</div></details>`;
  return h;
}

// ---------- Aktions-Kategorien & App-Werte ----------
const ACT_F=[{k:'pass',p:'Toller Pass',m:'Fehlpass'},{k:'dribb',p:'Super Dribbling',m:'Ballverlust im Dribbling'},{k:'schuss',p:'Guter Abschluss',m:'Chance vergeben'},{k:'lauf',p:'Guter Laufweg',m:'Falsch gelaufen / versteckt'},{k:'zweik',p:'Zweikampf gewonnen',m:'Zweikampf verloren'},{k:'entsch',p:'Kluge Entscheidung',m:'Falsche Entscheidung'}];
const ACT_G=[{k:'parade',p:'Starke Parade',m:'Haltbarer Gegentreffer'},{k:'fang',p:'Sicher gefangen',m:'Abprallen lassen'},{k:'raus',p:'Gut herausgelaufen',m:'Falsch herausgelaufen'},{k:'stell',p:'Gut positioniert',m:'Falsch positioniert'},{k:'eroeff',p:'Abwurf/Abstoß angekommen',m:'Abwurf/Abstoß zum Gegner'}];
const ACT_MAP={pass:{ueber:1,technik:1},dribb:{mut:1,technik:1},schuss:{technik:1},lauf:{frei:1},zweik:{zweik:1},entsch:{spielv:1,ueber:.5},parade:{tw_reak:1},fang:{tw_fang:1},raus:{tw_raus:1},stell:{tw_stell:1},eroeff:{tw_eroeff:1}};
const GK_TEST_MAP={tw_fangen:'tw_fang',tw_reaktion:'tw_reak',tw_abwurf:'tw_eroeff'};
const r1=x=>Math.round(x*10)/10;
function appVals(pid){
  const games=slist().filter(s=>s.live&&Array.isArray(s.live.actions)).slice(0,8);
  const agg={};
  games.forEach(s=>s.live.actions.forEach(a=>{if(a.p!==pid||!a.c)return;const m=ACT_MAP[a.c];if(!m)return;for(const[k,w]of Object.entries(m)){const g=agg[k]||(agg[k]={p:0,m:0,n:0});if(a.t==='+')g.p+=w;else g.m+=w;g.n++;}}));
  const out={};
  for(const[k,g]of Object.entries(agg))out[k]={v:3+2*(g.p-g.m)/(g.p+g.m+4),n:g.n,src:'Spiele'};
  const tests=s=>s.type!=='game';
  ['tempo','gewandt','kraft','ausdauer','technik'].forEach(ak=>{
    const t=latestVal('a:'+ak,pid,sessionsWith('a:'+ak).filter(tests));if(!isNum(t))return;
    if(out[ak]){out[ak]={v:(out[ak].v+t)/2,n:out[ak].n,src:'Spiele + Tests'};}else out[ak]={v:t,n:null,src:'Tests'};
  });
  for(const[tk,rk]of Object.entries(GK_TEST_MAP)){
    const raw=latestVal('t:'+tk,pid,sessionsWith('t:'+tk));if(!isNum(raw))continue;const t=1+Math.min(10,raw)/10*4;
    if(out[rk])out[rk]={v:(out[rk].v+t)/2,n:out[rk].n,src:'Spiele + Tests'};else out[rk]={v:t,n:null,src:'Tests'};
  }
  const fk=['spielv','frei','zweik','ueber','mut','technik','tempo','gewandt','kraft','ausdauer'].filter(k=>out[k]);
  out._gesamt=fk.length?{v:avg(fk.map(k=>out[k].v)),n:fk.length}:null;
  const gk=GK_RATINGS.map(r=>r.k).filter(k=>out[k]);
  out._tw=gk.length?{v:avg(gk.map(k=>out[k].v)),n:gk.length}:null;
  return out;
}
function cmpCard(pid){

    const flag=isNum(t)&&isNum(a)&&Math.abs(t-a)>=1&&(!meta||meta.n==null||meta.n>=5);
    if(meta&&meta.n===0)meta=null;

    return `<div class="crow ${flag?'flag':''} ${bold?'big':''}"><div class="cn">${name}${flag?' ⚠':''}<small>${info}${meta&&meta.n!=null&&meta.n<5?' · wenig Daten':''}</small></div><div class="cbars">${bar(t,'t')}${bar(a,'a')}</div><div class="cv"><span class="t">${isNum(t)?fnum(r1(t)):'–'}</span><span class="a">${isNum(a)?fnum(r1(a)):'–'}</span></div></div>`;
  };

  h+=RATINGS.map(r=>row(r.n,T(r.k),AV[r.k]?.v,AV[r.k]||{n:0,src:''})).join('');
  const only=[['technik','Technik'],['tempo','Tempo'],['gewandt','Gewandtheit'],['kraft','Sprungkraft'],['ausdauer','Ausdauer']].filter(([k])=>AV[k]);

  if(gkT.some(isNum)||AV._tw){const gt=gkT.filter(isNum);h+=`<div class="lbl2">Torwart</div>`+row('Torwart gesamt',gt.length?avg(gt):null,AV._tw?AV._tw.v:null,null,true)+GK_RATINGS.map((r,i)=>row(r.n,gkT[i],AV[r.k]?.v,AV[r.k]||{n:0,src:''})).join('');}
  h+=`<details style="margin-top:8px"><summary class="sub">So rechnet die App</summary><div class="wt">Jede kategorisierte Plus-/Minus-Aktion der letzten 8 Live-Spiele zählt für die passenden Bereiche (z. B. Toller Pass → Übersicht und Technik). Wert = 3 + 2 × (Plus − Minus) / (Plus + Minus + 4): Mit wenigen Aktionen bleibt er nahe 3, erst mit mehr Aktionen bewegt er sich Richtung 1 oder 5. Tempo, Gewandtheit, Sprungkraft, Ausdauer und Technik kommen zusätzlich aus den Testtagen (3 = Teamschnitt). ⚠ = Trainer und App liegen mindestens 1 Punkt auseinander (ab 5 Aktionen). „Gesamt“ der App enthält auch die Athletik, deins nur deine Einschätzung.</div></details></div>`;
  return h;
}

const ACT2FOCUS={pass:'pass',dribb:'dribb',schuss:'schuss',lauf:'lauf',zweik:'zweik',entsch:'entsch',parade:'tw',fang:'tw',raus:'tw',stell:'tw',eroeff:'tw'};
function trainingFocus(){
  const ps=plist();const games=slist().filter(s=>s.live&&Array.isArray(s.live.actions)).slice(0,4);
  const act={};games.forEach(s=>s.live.actions.forEach(a=>{const f=ACT2FOCUS[a.c];if(!f)return;const g=act[f]||(act[f]={p:0,m:0});if(a.t==='+')g.p++;else g.m++;}));
  const out=[];
  for(const[k,F]of Object.entries(FOCUS)){
    const parts=[],basis=[];
    const g=act[k];if(g&&g.p+g.m>=4){parts.push(3+2*(g.p-g.m)/(g.p+g.m+4));basis.push(`Aktionen: ${g.p} + / ${g.m} −`);}
    const rv=[];ps.forEach(p=>F.r.forEach(rk=>{const v=latestVal('r:'+rk,p.id,sessionsWith('r:'+rk));if(isNum(v))rv.push(v);}));
    if(rv.length>=3){const m=avg(rv);parts.push(m);basis.push(`Trainer-Schnitt ${fnum(r1(m))}`);}
    if(!parts.length)continue;
    const kids=ps.map(p=>{const vs=F.r.map(rk=>latestVal('r:'+rk,p.id,sessionsWith('r:'+rk))).filter(isNum);return{p,v:vs.length?avg(vs):null};}).filter(x=>isNum(x.v)).sort((a,b)=>a.v-b.v).slice(0,3).filter(x=>x.v<3.5);
    out.push({k,F,v:avg(parts),basis,kids});
  }
  return out.sort((a,b)=>a.v-b.v);
}

function vStrength(){
  const pid=S.playerId,p=S.players[pid];if(!p)return `<div class="empty">Spieler nicht gefunden.</div>`;
  const AV=appVals(pid);const T=k=>latestVal('r:'+k,pid,sessionsWith('r:'+k));

  ['technik','tempo','gewandt','kraft','ausdauer'].forEach(k=>{if(AV[k])cand.push({k,v:AV[k].v});});
  {const gt=GK_RATINGS.map(r=>T(r.k)).filter(isNum);const vs=[gt.length?avg(gt):null,AV._tw?.v].filter(isNum);if(vs.length)cand.push({k:'torwart',v:avg(vs)});}
  const top=cand.sort((a,b)=>b.v-a.v).slice(0,3);
  const ss=slist().reverse();const prog=[];
  TESTS.forEach(t=>{const pts=ss.map(s=>s.results?.[pid]?.[t.k]).filter(isNum);if(pts.length<2)return;const d=pts[pts.length-1]-pts[0];const better=t.lower?d<0:d>0;if(!better)return;const rel=Math.abs(d)/Math.max(.01,Math.abs(pts[0]));prog.push({t,d:Math.abs(Math.round(d*100)/100),rel});});

  const best={};slist().forEach(s=>((s.live&&s.live.actions)||[]).forEach(a=>{if(a.p===pid&&a.t==='+'&&a.c)best[a.c]=(best[a.c]||0)+1;}));
  const bestTop=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c,n])=>{const cat=[...ACT_F,...ACT_G].find(x=>x.k===c);return `${cat.p} (${n}×)`;});

  if(prog.length)h+=`<div class="sksec"><div class="skl">📈 Hier bist du besser geworden</div>${prog.slice(0,2).map(x=>`<div class="ski">${esc(x.t.n.replace('TW: ','Torwart – '))}: ${x.t.lower?fnum(x.d)+' '+x.t.u+' schneller':'+'+fnum(x.d)+' '+x.t.u}</div>`).join('')}</div>`;

  if(!top.length&&!prog.length&&!done.length&&!act.length&&!bestTop.length)h+=`<div class="ski">Noch zu wenige Daten – nach dem nächsten Testtag oder Spiel füllt sich die Karte.</div>`;

function short(pid){const p=S.players[pid];if(!p)return'?';const parts=(p.name||'').trim().split(/\s+/);const first=parts[0]||'?';const dup=Object.entries(S.players).some(([id,q])=>id!==pid&&q.active!==false&&(q.name||'').trim().split(/\s+/)[0]===first);return dup&&parts[1]?first+' '+parts[1][0]+'.':first;}
function liveField(L){return Object.values(L.pos).filter(Boolean);}
function accrue(L){if(!L.clock.running)return;const now=Date.now();const d=Math.max(0,(now-L.clock.lastTick)/1000);L.clock.elapsed+=d;liveField(L).forEach(p=>{L.mins[p]=(L.mins[p]||0)+d;});L.clock.lastTick=now;}
function liveSecs(L,pid){let v=pid?(L.mins[pid]||0):L.clock.elapsed;if(L.clock.running&&(!pid||liveField(L).includes(pid)))v+=Math.max(0,(Date.now()-L.clock.lastTick)/1000);return v;}
const fclock=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function liveSave(){META.lastChange=Date.now();saveLocal();}
function newLive(n,form,pos,bench){return{n,form,pos,bench,plus:{},minus:{},mins:{},log:[],clock:{running:false,elapsed:0,lastTick:0},started:Date.now()};}
function slotLabel(k){if(k==='TW')return'Torwart';const[pt,sd]=k.split('-');return(pt==='M'?'Mitte':POS[pt].n)+(sd==='Z'?'':' '+sd);}
function remapPos(M,n,form){const old=M.pos,slots=FORMS[n][form],np={};slots.forEach(k=>np[k]=old[k]||null);const used=new Set(Object.values(np).filter(Boolean));const rest=Object.entries(old).filter(([k,v])=>k!=='TW'&&v&&!used.has(v)).map(([k,v])=>v);slots.forEach(k=>{if(!np[k]&&rest.length)np[k]=rest.shift();});np.TW=old.TW||null;M.pos=np;M.n=n;M.form=form;}
function syncLu(n,form){const U=S.lu;if(U.manual)remapPos(U.manual,n,form);U.n=n;U.form=form;}
function remap(L,n,form){
  const old=L.pos,slots=FORMS[n][form],np={};
  slots.forEach(k=>np[k]=old[k]||null);
  const used=new Set(Object.values(np).filter(Boolean));
  const rest=Object.entries(old).filter(([k,v])=>k!=='TW'&&v&&!used.has(v)).map(([k,v])=>v);
  slots.forEach(k=>{if(!np[k]&&rest.length)np[k]=rest.shift();});
  np.TW=old.TW||null;L.bench.push(...rest);L.pos=np;L.n=n;L.form=form;
}
function ampel(L,pid){const el=liveSecs(L);if(el<180)return'';const t=((S.cfg&&S.cfg.minShare)||50)/100;const sh=liveSecs(L,pid)/el;return sh>=t?'ok':sh>=t*.6?'warn':'low';}
function gameBal(lv,pid){const g=(lv&&lv.goals)||[];let tore=0,gf=0,ga=0;g.forEach(e=>{const on=(e.on||[]).includes(pid);if(e.t==='goal'){if(e.p===pid)tore++;if(on)gf++;}else if(e.t==='conc'&&on)ga++;});return{tore,gf,ga};}
function score(L){const g=L.goals||[];return{gf:g.filter(e=>e.t==='goal').length,ga:g.filter(e=>e.t==='conc').length};}
function vLive(){
  const L=S.live;
  if(!L)return `<h2>Live</h2><div class="card hint">Stelle unter <b>Aufstellung</b> die Startformation zusammen und tippe dort auf „▶ Live mit dieser Aufstellung“.</div><div class="row gap"><button class="btn pri grow" onclick="A.go('lineup')">Zur Aufstellung</button><button class="btn grow" onclick="A.liveEmpty()">Leer starten</button></div><div class="sub" style="margin-top:8px">„Leer starten“ setzt alle Spieler auf die Bank – du stellst dann per Antippen auf.</div>`;
  L.goals=L.goals||[];
  const sel=S.liveSel,isSel=(k,key)=>sel&&sel.kind===k&&sel.key===key;
  const pm=pid=>`<div class="pm"><button class="lm" onclick="event.stopPropagation();A.liveAct('${pid}',-1)" aria-label="Minus">−</button><span class="cnt"><b class="pos">${L.plus[pid]||0}</b><b class="neg">${L.minus[pid]||0}</b></span><button class="lp" onclick="event.stopPropagation();A.liveAct('${pid}',1)" aria-label="Plus">+</button></div>`;
  const card=k=>{const pid=L.pos[k];return `<div class="lslot ${isSel('slot',k)?'sel':''} ${k==='TW'?'tw':''} ${pid?'':'empty'}" onclick="A.liveTap('slot','${k}')"><b>${pid?esc(short(pid)):'frei'}</b><small>${slotLabel(k)}${pid?` · <span class="lmin ${ampel(L,pid)}" data-p="${pid}">${Math.floor(liveSecs(L,pid)/60)}'</span>`:''}</small>${pid?pm(pid):''}</div>`;};
  const order=['L','Z','R'];const line=pt=>FORMS[L.n][L.form].filter(k=>k[0]===pt).sort((a,b)=>order.indexOf(a[2])-order.indexOf(b[2]));
  const tp=Object.values(L.plus).reduce((a,b)=>a+b,0),tm=Object.values(L.minus).reduce((a,b)=>a+b,0);
  let h=`<div class="lhead"><button id="lclock" class="lclock ${L.clock.running?'run':''}" onclick="A.liveClock()">${fclock(liveSecs(L))}</button><div class="lctl"><button class="btn ${L.clock.running?'':'pri'}" onclick="A.liveClock()">${L.clock.running?'Pause':(L.clock.elapsed?'Weiter':'Anpfiff')}</button><button class="btn" onclick="A.liveUndo()" ${L.log.length?'':'disabled'}>↶ Zurück</button></div></div>`;
  {const sc=score(L);h+=`<div class="score"><button class="btn goalb" onclick="A.goalAsk()">⚽ Tor</button><div class="sc">${sc.gf} : ${sc.ga}</div><button class="btn concb" onclick="A.concede()">Gegentor</button></div>`;}
  h+=`<div class="row between"><div class="chips scroll" style="margin:4px 0">${[4,5,6].map(n=>`<button class="chip ${L.n===n?'on':''}" onclick="A.liveN(${n})">${n}+1</button>`).join('')}${Object.keys(FORMS[L.n]).map(f=>`<button class="chip ${L.form===f?'on':''}" onclick="A.liveForm('${f}')">${f}</button>`).join('')}</div><div class="pill">Team <b class="pos">+${tp}</b> <b class="neg">−${tm}</b></div></div>`;
  h+=`<div class="sub">${sel?'Jetzt Ziel antippen: Feldspieler = Positionen tauschen, Bankspieler = Wechsel. Nochmal antippen = abbrechen.':'Spieler antippen, um Positionen zu tauschen oder auszuwechseln.'}</div>`;
  h+=`<div class="pitch live">${['S','M','A'].map(pt=>{const l=line(pt);return l.length?`<div class="prowl">${l.map(card).join('')}</div>`:'';}).join('')}<div class="prowl">${card('TW')}</div></div>`;
  h+=`<div class="lbl2">Bank</div>`;
  const bsort=L.bench.slice().sort((a,b)=>liveSecs(L,a)-liveSecs(L,b));
  h+=L.bench.length?`<div class="lbench">${bsort.map(pid=>`<div class="lb ${isSel('bench',pid)?'sel':''}" onclick="A.liveTap('bench','${pid}')"><b>${esc(short(pid))}</b><small><span class="lmin ${ampel(L,pid)}" data-p="${pid}">${Math.floor(liveSecs(L,pid)/60)}'</span> · <span class="neg">−${L.minus[pid]||0}</span> <span class="pos">+${L.plus[pid]||0}</span></small></div>`).join('')}</div>`:`<div class="sub">Niemand auf der Bank.</div>`;
  h+=`<div class="ampel"><span>Spielzeit-Ziel je Kind:</span>${[33,50,66].map(n=>`<button class="chip ${((S.cfg&&S.cfg.minShare)||50)===n?'on':''}" onclick="A.cfgSet('minShare',${n})">${n} %</button>`).join('')}</div><div class="sub"><span class="dot ok"></span>im Ziel <span class="dot warn"></span>knapp <span class="dot low"></span>zu wenig (ab Minute 3). Die Bank ist nach Spielzeit sortiert, wer am wenigsten gespielt hat, steht vorn.</div>`;
  const inGame=new Set([...liveField(L),...L.bench]);const others=plist().filter(p=>!inGame.has(p.id));
  if(others.length)h+=`<details class="card"><summary>Weitere Spieler zur Bank (${others.length})</summary><div class="chips">${others.map(p=>`<button class="chip" onclick="A.liveAddBench('${p.id}')">+ ${esc(short(p.id))}</button>`).join('')}</div></details>`;
  h+=`<div class="row gap" style="margin-top:14px"><button class="btn pri grow" onclick="A.liveEndModal()">Spiel beenden &amp; speichern</button><button class="btn danger" onclick="A.liveAskDiscard()">Verwerfen</button></div><div class="sub" style="margin-top:6px">Die Uhr läuft auch weiter, wenn du die App kurz schließt. Spielminuten zählen nur, solange die Uhr läuft.</div>`;
  return h;
}
setInterval(()=>{const L=S.live;if(S.view!=='live'||!L||!L.clock.running)return;const c=$('#lclock');if(c)c.textContent=fclock(liveSecs(L));document.querySelectorAll('.lmin').forEach(e=>{e.textContent=Math.floor(liveSecs(L,e.dataset.p)/60)+"'";e.className='lmin '+ampel(L,e.dataset.p);});},1000);

// ---------- Stoppuhr ----------
const sw={running:false,t0:0,elapsed:0};
const fms=ms=>(ms/1000).toFixed(2).replace('.',',');
function swPaint(){
  const d=$('#swd'),b=$('#swb'); if(!d)return;
  d.textContent=fms(sw.running?performance.now()-sw.t0:sw.elapsed);
  d.classList.toggle('run',sw.running); if(b)b.textContent=sw.running?'Stopp':'Start';
}
function swLoop(){if(!sw.running)return;swPaint();requestAnimationFrame(swLoop);}

// ---------- Modal & Toast ----------
function showModal(html){const m=$('#modal');m.innerHTML=`<div class="mbg" onclick="A.closeModal()"></div><div class="mbox" role="dialog">${html}</div>`;m.classList.add('open');}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML='';}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400);}
function sessionModal(s){
  S.draft=s;
  if(s.type==='eval')return showModal(`<h3>${s.id?'Einschätzung bearbeiten':'Neue Trainereinschätzung'}</h3><label>Datum<input type="date" id="m_date" value="${esc(s.date)}"></label><label>Titel<input id="m_title" value="${esc(s.title)}" autocomplete="off"></label><div class="sub" style="margin:0 0 14px">Für deine Einschätzung zwischendurch, z. B. nach einem Training. Sie fließt wie die Bewertungen nach Spielen in Profil, Ranglisten und Aufstellung ein.</div><div class="row end gap">${s.id?`<button class="btn danger" onclick="A.askDelSession('${s.id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.saveSession()">Speichern</button></div>`);
  if(s.type==='game')return showModal(`<h3>${s.id?'Spiel bearbeiten':'Neues Spiel'}</h3><label>Datum<input type="date" id="m_date" value="${esc(s.date)}"></label><label>Gegner / Titel<input id="m_title" value="${esc(s.title)}" autocomplete="off"></label><label>Ergebnis (optional)<input id="m_result" value="${esc(s.result||'')}" placeholder="z. B. 3:2" autocomplete="off"></label><div class="sub" style="margin:0 0 14px">Danach bewertest du jedes Kind, das gespielt hat, in den 6 Bereichen. Das fließt in Profil, Ranglisten und Aufstellung ein.</div><div class="row end gap">${s.id?`<button class="btn danger" onclick="A.askDelSession('${s.id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.saveSession()">Speichern</button></div>`);
  showModal(`<h3>${s.id?'Testtag bearbeiten':'Neuer Testtag'}</h3><label>Datum<input type="date" id="m_date" value="${esc(s.date)}"></label><label>Titel<input id="m_title" value="${esc(s.title)}" autocomplete="off"></label><div class="lbl">Tests auswählen</div>${TEST_GROUPS.map(a=>`<div class="sub">${a.n}</div><div class="chips">${TESTS.filter(t=>t.area===a.k).map(t=>`<button class="chip ${s.tests.includes(t.k)?'on':''}" onclick="A.togDraft('${t.k}',this)">${esc(t.n)}</button>`).join('')}</div>`).join('')}<div class="sub" style="margin:10px 0 14px">Trainer-Einschätzung und Spaß-Abfrage sind immer dabei (Reiter „Pro Kind“).</div><div class="row end gap">${s.id?`<button class="btn danger" onclick="A.askDelSession('${s.id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.saveSession()">Speichern</button></div>`);
}

// ---------- Aktionen ----------
const A={
  closeModal,
  liveFromLineup(force){
    const R=S.luRes;if(!R){toast('Keine Aufstellung berechnet.');return;}
    if(S.live&&!force){showModal(`<h3>Laufendes Live-Spiel ersetzen?</h3><p>Plus/Minus und Spielzeiten des aktuellen Live-Spiels gehen verloren, wenn du es nicht vorher beendest.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.liveFromLineup(true)">Ersetzen</button></div>`);return;}
    closeModal();const pos={};FORMS[R.n][R.form].forEach(k=>pos[k]=null);R.res.forEach(r=>pos[r.slot]=r.p.id);pos.TW=R.keeper||null;
    S.live=newLive(R.n,R.form,pos,R.bench.slice());S.liveSel=null;liveSave();A.go('live');
  },
  liveEmpty(){const n=S.lu.n,form=FORMS[n][S.lu.form]?S.lu.form:Object.keys(FORMS[n])[0];const pos={};FORMS[n][form].forEach(k=>pos[k]=null);pos.TW=null;S.live=newLive(n,form,pos,plist().map(p=>p.id));S.liveSel=null;liveSave();render(true);},
  liveTap(kind,key){
    const L=S.live,sel=S.liveSel;if(!L)return;
    if(!sel){S.liveSel={kind,key};render(true);return;}
    if(sel.kind===kind&&sel.key===key){S.liveSel=null;render(true);return;}
    if(sel.kind==='bench'&&kind==='bench'){S.liveSel={kind,key};render(true);return;}
    accrue(L);
    if(sel.kind==='slot'&&kind==='slot'){const a=L.pos[sel.key];L.pos[sel.key]=L.pos[key];L.pos[key]=a;L.log.push({t:'swap',a:sel.key,b:key});}
    else{const slot=sel.kind==='slot'?sel.key:key,bp=sel.kind==='bench'?sel.key:key,out=L.pos[slot];L.pos[slot]=bp;L.bench=L.bench.filter(x=>x!==bp);if(out)L.bench.push(out);L.log.push({t:'sub',slot,inP:bp,outP:out||null});toast(`${short(bp)} rein${out?' für '+short(out):''}`);}
    S.liveSel=null;liveSave();render(true);
  },
  liveAct(pid,d){const L=S.live;if(!L)return;const o=d>0?L.plus:L.minus;o[pid]=(o[pid]||0)+1;const e={t:d>0?'+':'-',p:pid,id:uid('a'),c:null,at:Math.floor(liveSecs(L)/60),gk:L.pos.TW===pid};L.log.push(e);try{navigator.vibrate&&navigator.vibrate(15);}catch(x){}liveSave();render(true);showSheet(e);},
  sheetPick(id,c){const L=S.live;if(L){const e=L.log.find(x=>x.id===id);if(e){e.c=c;liveSave();const cats=e.gk?ACT_G:ACT_F;const cc=cats.find(x=>x.k===c);toast((e.t==='+'?cc.p:cc.m)+' · '+short(e.p));}}A.sheetHide();},
  sheetHide(){clearTimeout(sheetT);const el=$('#sheet');if(el)el.classList.remove('open');},
  actCat(i,c){const s=clone(S.sessions[S.sessionId]);const a=s.live&&s.live.actions&&s.live.actions[i];if(!a)return;a.c=a.c===c?null:c;saveDoc('sessions',S.sessionId,s);render(true);},
  goalAdd(pid){S.goalPid=pid;showModal(`<h3>Neues Entwicklungsziel</h3><label>Ziel<input id="m_goal" placeholder="z. B. linken Fuß einsetzen" autocomplete="off"></label><div class="sub">Vorschläge:</div><div class="chips">${GOAL_SUG.map(g=>`<button class="chip" onclick="document.getElementById('m_goal').value=this.textContent">${g}</button>`).join('')}</div><div class="sub" style="margin:4px 0 12px">Konkret und beobachtbar formulieren – dann kannst du am Platz gut abhaken.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.goalSave()">Speichern</button></div>`);},
  goalSave(){const t=$('#m_goal').value.trim();if(!t){toast('Bitte ein Ziel eingeben.');return;}const pid=S.goalPid;const p=clone(S.players[pid]);p.goals=p.goals||[];p.goals.push({id:uid('z'),text:t,status:'offen',created:Date.now(),upd:Date.now()});saveDoc('players',pid,p);closeModal();render(true);},
  goalSt(pid,gid,st){const p=clone(S.players[pid]);const g=(p.goals||[]).find(x=>x.id===gid);if(!g)return;g.status=st;g.upd=Date.now();saveDoc('players',pid,p);render(true);if(st==='erreicht')toast('🎉 Ziel erreicht!');},
  goalDelAsk(pid,gid){showModal(`<h3>Ziel löschen?</h3><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.goalDel('${pid}','${gid}')">Löschen</button></div>`);},
  goalDel(pid,gid){const p=clone(S.players[pid]);p.goals=(p.goals||[]).filter(x=>x.id!==gid);saveDoc('players',pid,p);closeModal();render(true);},
  printCard(){try{window.print();}catch(e){toast('Drucken geht hier nicht – bitte Screenshot machen.');}},
  cfgSet(k,v){S.cfg=S.cfg||{};S.cfg[k]=v;saveLocal();render(true);},
  goalAsk(){
    const L=S.live;if(!L)return;const ps=Object.entries(L.pos).filter(([k,v])=>v).map(([k,v])=>v);
    clearTimeout(sheetT);const el=$('#sheet');
    el.innerHTML=`<div class="row between" style="margin-bottom:8px"><b>⚽ Tor! Wer hat getroffen?</b><button class="btn sm2" onclick="A.sheetHide()">Abbrechen</button></div><div class="sgrid p">${ps.map(pid=>`<button onclick="A.goalPick('${pid}')">${esc(short(pid))}</button>`).join('')}<button onclick="A.goalPick('')" style="background:#5f6f64">Weiß nicht / Eigentor</button></div>`;
    el.classList.add('open');
  },
  goalPick(pid){const L=S.live;if(!L)return;accrue(L);L.goals=L.goals||[];const e={t:'goal',p:pid||null,at:Math.floor(liveSecs(L)/60),on:liveField(L),id:uid('g')};L.goals.push(e);L.log.push({t:'goal',id:e.id});A.sheetHide();liveSave();render(true);const sc=score(L);toast(`⚽ ${pid?short(pid):'Tor'} · ${sc.gf}:${sc.ga}`);},
  concede(){const L=S.live;if(!L)return;accrue(L);L.goals=L.goals||[];const e={t:'conc',at:Math.floor(liveSecs(L)/60),on:liveField(L),id:uid('g')};L.goals.push(e);L.log.push({t:'conc',id:e.id});liveSave();render(true);const sc=score(L);toast(`Gegentor · ${sc.gf}:${sc.ga}`);},
  liveUndo(){
    const L=S.live;if(!L)return;const e=L.log.pop();if(!e)return;
    A.sheetHide();
    if(e.t==='+'||e.t==='-'){const o=e.t==='+'?L.plus:L.minus;o[e.p]=Math.max(0,(o[e.p]||0)-1);toast(`${e.t==='+'?'Plus':'Minus'} für ${short(e.p)} zurückgenommen`);}
    else if(e.t==='goal'||e.t==='conc'){L.goals=(L.goals||[]).filter(g=>g.id!==e.id);toast(e.t==='goal'?'Tor zurückgenommen':'Gegentor zurückgenommen');}
    else if(e.t==='swap'){accrue(L);const a=L.pos[e.a];L.pos[e.a]=L.pos[e.b];L.pos[e.b]=a;toast('Tausch zurückgenommen');}
    else if(e.t==='sub'){accrue(L);L.pos[e.slot]=e.outP;L.bench=L.bench.filter(x=>x!==e.outP);L.bench.push(e.inP);toast('Wechsel zurückgenommen');}
    liveSave();render(true);
  },
  liveClock(){const L=S.live;if(!L)return;if(L.clock.running){accrue(L);L.clock.running=false;}else{L.clock.running=true;L.clock.lastTick=Date.now();}liveSave();render(true);},
  liveForm(f){const L=S.live;accrue(L);remap(L,L.n,f);syncLu(L.n,L.form);S.liveSel=null;liveSave();render(true);},
  liveN(n){const L=S.live;if(L.n===n)return;accrue(L);remap(L,n,Object.keys(FORMS[n])[0]);syncLu(L.n,L.form);S.liveSel=null;liveSave();render(true);},
  liveAddBench(pid){const L=S.live;if(!L.bench.includes(pid))L.bench.push(pid);liveSave();render(true);},
  liveEndModal(){showModal(`<h3>Spiel beenden</h3><label>Gegner / Titel<input id="m_title" value="Spiel gegen " autocomplete="off"></label><label>Ergebnis (optional)<input id="m_result" placeholder="z. B. 3:2" value="${(S.live&&S.live.goals&&S.live.goals.length)?score(S.live).gf+':'+score(S.live).ga:''}" autocomplete="off"></label><div class="sub" style="margin:0 0 14px">Plus/Minus und Spielminuten werden als Spiel unter „Bewertung“ gespeichert. Danach kannst du die Kinder direkt bewerten.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.liveEnd()">Speichern</button></div>`);},
  liveEnd(){
    const L=S.live;if(!L)return;accrue(L);L.clock.running=false;
    const mins={};Object.entries(L.mins).forEach(([p,s])=>{if(s>=1)mins[p]=Math.round(s/60);});
    const id=uid('s');const title=($('#m_title').value||'').trim()||'Spiel';
    const doc={type:'game',date:today(),title,result:($('#m_result').value||'').trim(),tests:[],results:{},ratings:{},mood:{},notes:{},created:Date.now(),live:{plus:L.plus,minus:L.minus,mins,n:L.n,form:L.form,duration:Math.round(L.clock.elapsed/60),goals:(L.goals||[]).map(g=>({t:g.t,p:g.p||null,at:g.at,on:g.on||[]})),actions:L.log.filter(e=>e.t==='+'||e.t==='-').map(e=>({t:e.t,p:e.p,c:e.c||null,at:isNum(e.at)?e.at:null,gk:!!e.gk}))}};
    A.sheetHide();
    S.live=null;S.liveSel=null;saveDoc('sessions',id,doc);closeModal();A.openSession(id);toast('Spiel gespeichert – jetzt kurz bewerten');
  },
  liveAskDiscard(){showModal(`<h3>Live-Spiel verwerfen?</h3><p>Plus/Minus und Spielminuten dieses Spiels werden nicht gespeichert.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.liveDiscard()">Verwerfen</button></div>`);},
  liveDiscard(){S.live=null;S.liveSel=null;liveSave();closeModal();render(true);},
  teamModal(){
    syncTeam();const ids=Object.keys(TEAMS).sort((a,b)=>(TEAMS[a].name||'').localeCompare(TEAMS[b].name||'','de',{numeric:true}));
    showModal(`<h3>Mannschaften</h3>${ids.map(id=>{const t=TEAMS[id];const np=Object.values(t.players||{}).filter(p=>p.active!==false).length;return `<div class="prow"><button class="tsel" onclick="A.switchTeam('${id}')">${id===CUR?'✓ ':''}${esc(t.name)} <small>· ${np} Spieler</small></button><button class="btn sm2" onclick="A.teamEdit('${id}')">Bearbeiten</button></div>`;}).join('')}<div class="lbl2" style="margin:16px 0 8px">Neue Mannschaft</div><label>Name<input id="m_tname" placeholder="z. B. U11 Saison 2027/28" autocomplete="off"></label><label>Kader übernehmen von<select id="m_tcopy"><option value="">– leer starten –</option>${ids.map(id=>`<option value="${id}">${esc(TEAMS[id].name)}</option>`).join('')}</select></label><div class="sub" style="margin:-4px 0 12px">Übernommen werden nur die aktiven Spieler, keine Bewertungen. So startet die neue Saison mit eigenem Verlauf.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Schließen</button><button class="btn pri" onclick="A.teamAdd()">Anlegen</button></div>`);
  },
  switchTeam(id){if(!TEAMS[id])return;saveLocal();CUR=id;loadTeam();S.view='sessions';S.sessionId=null;S.playerId=null;S.kidIdx=0;S.rk={cat:null,mode:'best',sess:null};saveLocal();closeModal();render(true);scrollTo(0,0);},
  teamAdd(){
    const name=$('#m_tname').value.trim();if(!name){toast('Bitte einen Namen eingeben.');return;}
    const src=$('#m_tcopy').value;const players={};
    if(src&&TEAMS[src])for(const[pid,p]of Object.entries(TEAMS[src].players||{}))if(p.active!==false)players[pid]=clone(p);
    const id=uid('t');TEAMS[id]={name,players,sessions:{},created:Date.now()};META.lastChange=Date.now();
    A.switchTeam(id);toast(name+' angelegt');
  },
  teamEdit(id){const t=TEAMS[id];if(!t)return;showModal(`<h3>Mannschaft bearbeiten</h3><label>Name<input id="m_tn" value="${esc(t.name)}" autocomplete="off"></label><div class="row end gap">${Object.keys(TEAMS).length>1?`<button class="btn danger" onclick="A.teamAskDel('${id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.teamModal()">Zurück</button><button class="btn pri" onclick="A.teamRename('${id}')">Speichern</button></div>`);},
  teamRename(id){const n=$('#m_tn').value.trim();if(!n){toast('Bitte einen Namen eingeben.');return;}TEAMS[id].name=n;META.lastChange=Date.now();saveLocal();render(true);A.teamModal();},
  teamAskDel(id){showModal(`<h3>„${esc(TEAMS[id].name)}“ löschen?</h3><p>Alle Spieler, Testtage und Spiele dieser Mannschaft gehen verloren. Mach vorher eine Sicherung.</p><div class="row end gap"><button class="btn" onclick="A.teamEdit('${id}')">Abbrechen</button><button class="btn danger" onclick="A.teamDel('${id}')">Endgültig löschen</button></div>`);},
  teamDel(id){syncTeam();delete TEAMS[id];META.lastChange=Date.now();if(id===CUR){CUR=null;A.switchTeam(Object.keys(TEAMS)[0]);}else{saveLocal();A.teamModal();}toast('Mannschaft gelöscht');},
  async backup(){
    const name='Leistungsprofil-Sicherung-'+today()+'.json';const blob=new Blob([backupJSON()],{type:'application/json'});
    const mark=()=>{META.lastBackup=Date.now();saveLocal();render(true);toast('Sicherung erstellt');};
    try{const file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer: coarse)').matches){await navigator.share({files:[file],title:'U10-Sicherung'});mark();return;}
    }catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);mark();
  },
  restoreFile(){const i=$('#restoreInput');i.value='';i.click();},
  async restorePicked(inp){const f=inp.files&&inp.files[0];if(!f)return;try{importData(await f.text());}catch(e){toast('Datei konnte nicht gelesen werden.');}},
  pasteModal(){showModal(`<h3>Daten einfügen</h3><div class="sub" style="margin-bottom:8px">In der alten Version unter Kader → Datensicherung auf „Kopieren“ tippen und den Text hier einfügen.</div><textarea id="m_paste" rows="6" placeholder="{&quot;players&quot;: …}"></textarea><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.pasteDo()">Übernehmen</button></div>`);},
  pasteDo(){if(importData($('#m_paste').value))closeModal();},
  lu(f,v){const L=S.lu;
    if((f==='n'||f==='form')&&L.manual){const n=f==='n'?v:L.n;remapPos(L.manual,n,f==='n'?Object.keys(FORMS[v])[0]:v);}
    if(f==='mode'||f==='keeper')L.manual=null;
    L[f]=v;if(f==='n')L.form=Object.keys(FORMS[v])[0];S.luSel=null;saveLocal();render(true);},
  luAbs(id){S.lu.absent[id]=!S.lu.absent[id];S.luSel=null;saveLocal();render(true);},
  luTap(kind,key){
    const L=S.lu;
    if(!L.manual||L.manual.n!==L.n||L.manual.form!==L.form){const R=S.luRes;if(!R)return;const pos={};FORMS[L.n][L.form].forEach(k=>pos[k]=null);R.res.forEach(r=>pos[r.slot]=r.p.id);pos.TW=R.keeper||null;L.manual={n:L.n,form:L.form,pos};}
    const M=L.manual,sel=S.luSel;
    if(!sel){S.luSel={kind,key};render(true);return;}
    if(sel.kind===kind&&sel.key===key){S.luSel=null;render(true);return;}
    if(sel.kind==='bench'&&kind==='bench'){S.luSel={kind,key};render(true);return;}
    if(sel.kind==='slot'&&kind==='slot'){const a=M.pos[sel.key];M.pos[sel.key]=M.pos[key];M.pos[key]=a;}
    else{const slot=sel.kind==='slot'?sel.key:key,bp=sel.kind==='bench'?sel.key:key;M.pos[slot]=bp;}
    S.luSel=null;saveLocal();render(true);
  },
  luReset(){S.lu.manual=null;S.luSel=null;saveLocal();render(true);},
  rk(f,v){S.rk[f]=v;if(f==='cat')S.rk.sess=null;render(true);},
  go(v){S.view=v;render(true);scrollTo(0,0);},
  newSession(){const last=slist()[0];const d=new Date();sessionModal({id:null,date:today(),title:'Testtag '+MONTHS[d.getMonth()],tests:(last&&last.tests?last.tests.slice():DEFAULT_TESTS.slice())});},
  newEval(){const d=new Date();sessionModal({id:null,type:'eval',date:today(),title:'Trainereinschätzung '+MONTHS[d.getMonth()],tests:[]});},
  newGame(){sessionModal({id:null,type:'game',date:today(),title:'Spiel gegen ',result:'',tests:[]});},
  editSession(){const s=S.sessions[S.sessionId];if(!s)return;sessionModal({id:S.sessionId,type:s.type,result:s.result,date:s.date,title:s.title,tests:(s.tests||[]).slice()});},
  togDraft(k,el){const t=S.draft.tests;const i=t.indexOf(k);if(i>=0)t.splice(i,1);else t.push(k);el.classList.toggle('on');},
  saveSession(){
    const d=S.draft;const date=$('#m_date').value||today();const title=$('#m_title').value.trim()||'Testtag';
    const game=d.type==='game'||d.type==='eval';
    const tests=game?[]:TESTS.map(t=>t.k).filter(k=>d.tests.includes(k));
    if(!game&&!tests.length){toast('Bitte mindestens einen Test wählen.');return;}
    let id=d.id,doc;
    if(id)doc=clone(S.sessions[id]); else{id=uid('s');doc={results:{},ratings:{},mood:{},notes:{},created:Date.now()};}
    Object.assign(doc,{date,title,tests});
    if(d.type==='game'){doc.type='game';doc.result=($('#m_result').value||'').trim();}
    if(d.type==='eval')doc.type='eval';
    saveDoc('sessions',id,doc);closeModal();
    S.view='session';S.sessionId=id;if(!d.id){S.sessTab=game?'kids':'tests';S.curTest=tests[0];S.kidIdx=0;}
    render(true);
  },
  askDelSession(id){showModal(`<h3>Wirklich löschen?</h3><p>Alle Messwerte, Einschätzungen und Notizen dieses Eintrags gehen verloren.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.delSession('${id}')">Endgültig löschen</button></div>`);},
  async delSession(id){closeModal();S.view='sessions';await removeDoc('sessions',id);render(true);toast('Gelöscht');},
  openSession(id){S.view='session';S.sessionId=id;S.sessTab=['game','eval'].includes(S.sessions[id]?.type)?'kids':'tests';S.curTest=null;S.kidIdx=0;render(true);scrollTo(0,0);},
  sessTab(k){S.sessTab=k;render(true);},
  curTest(k){S.curTest=k;A.swReset();render(true);},
  setVal(pid,el){
    const t=TEST[S.curTest];const n=parseNum(el.value);
    const bad=Number.isNaN(n)||(n!==null&&(n<0||(t.max&&n>t.max)));
    el.classList.toggle('bad',bad);if(bad)return;
    const s=clone(S.sessions[S.sessionId]);s.results=s.results||{};const r=s.results[pid]=s.results[pid]||{};
    if(n===null)delete r[t.k];else r[t.k]=n;
    saveDoc('sessions',S.sessionId,s);const st=$('#stats');if(st)st.innerHTML=statsLine(s,t);
  },
  take(pid,btn){
    if(sw.running){toast('Erst die Stoppuhr anhalten.');return;}
    const v=Math.round(sw.elapsed/10)/100;if(!v){toast('Noch keine Zeit gestoppt.');return;}
    const t=TEST[S.curTest];const s=clone(S.sessions[S.sessionId]);s.results=s.results||{};const r=s.results[pid]=s.results[pid]||{};
    const old=r[t.k];const name=S.players[pid]?.name||'';
    if(isNum(old)&&old<=v){toast(`${fnum(v)} s – bester Wert ${fnum(old)} s bleibt`);}
    else{r[t.k]=v;saveDoc('sessions',S.sessionId,s);const inp=btn.parentElement.querySelector('input');if(inp){inp.value=fnum(v);inp.classList.remove('bad');}const st=$('#stats');if(st)st.innerHTML=statsLine(s,t);toast(`${fnum(v)} s für ${name}`);}
    A.swReset();
  },
  swToggle(){if(sw.running){sw.elapsed=performance.now()-sw.t0;sw.running=false;}else{sw.t0=performance.now();sw.elapsed=0;sw.running=true;requestAnimationFrame(swLoop);}swPaint();},
  swReset(){sw.running=false;sw.elapsed=0;swPaint();},
  kid(d){const n=plist().length;if(!n)return;S.kidIdx=(S.kidIdx+d+n)%n;render(true);},
  kidSel(v){S.kidIdx=+v;render(true);},
  rate(pid,k,n){const s=clone(S.sessions[S.sessionId]);s.ratings=s.ratings||{};const r=s.ratings[pid]=s.ratings[pid]||{};if(r[k]===n)delete r[k];else r[k]=n;saveDoc('sessions',S.sessionId,s);render(true);},
  mood(pid,n){const s=clone(S.sessions[S.sessionId]);s.mood=s.mood||{};if(s.mood[pid]===n)delete s.mood[pid];else s.mood[pid]=n;saveDoc('sessions',S.sessionId,s);render(true);},
  note(pid,el){const s=clone(S.sessions[S.sessionId]);s.notes=s.notes||{};const v=el.value;if(v.trim())s.notes[pid]=v;else delete s.notes[pid];saveDoc('sessions',S.sessionId,s);},
  copy(sel){
    const el=$(sel);if(!el)return;const txt=el.value;
    const manual=()=>{el.focus();el.select();toast('Bitte markierten Text manuell kopieren.');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'),manual);else manual();}catch(e){manual();}
  },
  openPlayer(id){S.view='player';S.playerId=id;render(true);scrollTo(0,0);},
  playerModal(id){
    const p=id?S.players[id]:{name:'',foot:'rechts',active:true};S.draftP=id||null;
    showModal(`<h3>${id?'Spieler bearbeiten':'Neuer Spieler'}</h3><label>Vorname / Kürzel<input id="m_name" value="${esc(p.name)}" autocomplete="off" onkeydown="if(event.key==='Enter')A.savePlayer(${id?'false':'true'})"></label><label>Starker Fuß<select id="m_foot">${['rechts','links','beide'].map(f=>`<option ${p.foot===f?'selected':''}>${f}</option>`).join('')}</select></label>${id?`<label class="chk"><input type="checkbox" id="m_act" ${p.active!==false?'checked':''}> aktiv im Kader</label>`:''}<div class="row end gap">${id?`<button class="btn danger" onclick="A.askDelPlayer('${id}')">Löschen</button><span class="grow"></span>`:`<button class="btn" onclick="A.savePlayer(true)">+ Nächster</button>`}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.savePlayer(false)">Speichern</button></div>`);
    setTimeout(()=>{const n=$('#m_name');if(n&&!id)n.focus();},60);
  },
  savePlayer(next){
    const name=$('#m_name').value.trim();if(!name){toast('Bitte einen Namen eingeben.');return;}
    const id=S.draftP||uid('p');
    const p=Object.assign(clone(S.players[id]||{created:Date.now()}),{name,foot:$('#m_foot').value,active:$('#m_act')?$('#m_act').checked:true});
    saveDoc('players',id,p);closeModal();render(true);
    if(next){toast(name+' angelegt');A.playerModal();}
  },
  askDelPlayer(id){showModal(`<h3>Spieler löschen?</h3><p>Tipp: Wenn ein Kind die Mannschaft verlässt, reicht „aktiv im Kader“ abwählen – dann bleibt der Verlauf erhalten.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.delPlayer('${id}')">Endgültig löschen</button></div>`);},
  async delPlayer(id){
    closeModal();S.view='players';
    for(const s of slist()){if(hasData(s,id)){const d=clone(S.sessions[s.id]);['results','ratings','mood','notes'].forEach(k=>{if(d[k])delete d[k][id];});saveDoc('sessions',s.id,d);}}
    await removeDoc('players',id);render(true);toast('Spieler gelöscht');
  }
};
window.A=A;

// ---------- Start ----------
(function init(){
  loadLocal();S.mode='local';S.ready=true;render(true);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloaded)return;reloaded=true;saveLocal();location.reload();});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
  }
})();
</script>
</body>
</html>
