<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrainerRadar</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-title" content="TrainerRadar">
<meta name="theme-color" content="#0f3d22">
<meta name="color-scheme" content="light dark">
<style>
:root{--fc:'Avenir Next Condensed','Arial Narrow',system-ui,sans-serif;--ft:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;--bg:#f2f4ef;--card:#fff;--ink:#16241b;--mut:#5f6f64;--g:#1d6b3a;--gd:#0f3d22;--lime:#d7f25a;--line:#e1e6dd;--bad:#b4442c;--good:#1d7a3e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font:15px/1.45 var(--ft);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--gd);color:#fff;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
.brand{display:flex;align-items:center;gap:8px;font:700 22px var(--fc);letter-spacing:.3px;max-width:640px;margin:0 auto}
.brand small{background:var(--lime);color:var(--gd);border-radius:4px;padding:0 6px;font-size:14px}
#save{font:500 12px var(--ft);opacity:.8}
nav{display:flex;justify-content:space-between;gap:0;margin:8px auto 0;max-width:640px}
nav button{flex:0 0 auto;background:none;border:0;color:#cfe3d4;font:600 13px var(--ft);padding:10px 2px 12px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:var(--lime)}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
h2{font:700 26px var(--fc);margin:4px 0}
h3{font:700 22px var(--fc);margin:0 0 10px}
.row{display:flex;align-items:center}.between{justify-content:space-between;gap:10px}.end{justify-content:flex-end}.gap{gap:8px}.grow{flex:1}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;font:inherit;color:inherit}
button.item{cursor:pointer}
.item.off{opacity:.55}
.t{font-weight:600;font-size:16px}.t2{font-weight:600;font-size:14px}
.sub{color:var(--mut);font-size:13px}
.lbl{font-weight:600;margin-bottom:8px}.lbl small{font-weight:400;color:var(--mut)}
.hint{background:#eef6e2;border-color:#d6e8c0;color:#2e4a33;font-size:14px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.banner{background:#fff4d6;border:1px solid #f0d68a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.btn{font:600 14px var(--ft);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc9bf}
.btn.sm{padding:6px 10px;min-height:40px;font-size:18px}
.pill{background:#eef1ea;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips.scroll{min-width:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font:500 13px var(--ft);white-space:nowrap;color:var(--ink);cursor:pointer}
.chips.sm .chip{padding:2px 8px;font-size:12px;cursor:default}
.chip.on{background:var(--gd);border-color:var(--gd);color:#fff}
.back{background:none;border:0;color:var(--g);font:600 15px var(--ft);padding:4px 0;cursor:pointer}
.slot small.alt{display:block;font-size:11px;opacity:.8;margin-top:1px}
.slot.gslot{opacity:.85;outline:2px dashed #9aa79e;outline-offset:-4px}.slot.gslot .fit{font-size:13px;color:var(--mut)}
.gchip{display:inline-flex;align-items:center}.chip.guest{border-style:dashed}.chip.guest small{opacity:.75;font-weight:400}.gx{border:0;background:none;color:var(--mut);font-size:14px;padding:4px 6px;cursor:pointer}
.whyr{padding:6px 0;border-top:1px solid var(--line)}.whyr:first-of-type{border-top:0}.whyc summary small{font-weight:400}
.archrow{border-top:1px solid #e4e9e0;padding:10px 0 4px;margin-top:10px}.archrow small{display:block;color:var(--mut);margin:2px 0 6px}.banner.arch{background:#e8eefc;border-color:#b9c8ee}
.seg{display:flex;background:#e4e9e0;border-radius:10px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:600 14px var(--ft);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px #0002}
.prow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px;margin:6px 0}
.pn{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{background:var(--card);width:86px;font:600 18px var(--ft);text-align:right;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.num.bad{border-color:var(--bad);background:#fff3f0}
.u{width:46px;color:var(--mut);font-size:12px}
.sw{text-align:center}
.swd{display:block;width:100%;font:700 60px/1.1 var(--fc);background:none;border:0;color:var(--gd);padding:4px 0 8px;font-variant-numeric:tabular-nums;cursor:pointer}
.swd.run{color:#c2410c}
.sw .sub{margin-top:8px}
.kidnav{display:flex;gap:8px;align-items:center}
.kidnav select{flex:1;min-width:0;font:600 16px var(--ft);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #f0f2ee}
.rrow:first-of-type{border-top:0}
.rrow span{font-size:14px;flex:1;min-width:0;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:anywhere}
.scale{display:flex;gap:4px;flex:none}
.scale button{width:36px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:600 15px var(--ft);color:var(--ink);cursor:pointer}
.scale button.on{background:var(--g);border-color:var(--g);color:#fff}
.moods{display:flex;justify-content:space-between}
.moods button{font-size:30px;width:54px;height:54px;border-radius:12px;border:2px solid transparent;background:#f5f7f3;cursor:pointer}
.moods button.on{border-color:var(--g);background:#e6f2e2}
textarea,.mbox input,.mbox select{width:100%;font:16px var(--ft);padding:10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--card)}
textarea{resize:vertical;margin-bottom:8px}
.mbox label{display:block;font-weight:600;font-size:14px;margin:0 0 12px}
.mbox label input,.mbox label select{margin-top:4px}
.mbox label.chk{display:flex;align-items:center;gap:8px}
.mbox label.chk input{width:auto;margin:0}
#modal{display:none}
#modal.open{display:block}
.mbg{position:fixed;inset:0;background:#0007;z-index:20}
.mbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:14px;padding:18px;z-index:21}
.mbox .sub{margin:4px 0}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--gd);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.radar{width:100%;max-width:380px;display:block;margin:0 auto}
.radar .grid{fill:none;stroke:#e3e8df;stroke-width:1}
.radar .grid.mid{stroke:#b9c7b4;stroke-dasharray:3 3}
.radar .pc{fill:rgba(29,107,58,.22);stroke:var(--g);stroke-width:2}
.radar .pp{fill:none;stroke:#8a958d;stroke-width:1.5;stroke-dasharray:4 3}
.radar .pd{fill:var(--g)}
.radar .rl{font:600 12px var(--ft);fill:var(--ink)}
.radar .rl.na{fill:#aab3ac}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mut);margin:4px 0 8px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--g);vertical-align:middle;margin-right:5px}
.legend i.lp{border-top:2px dashed #8a958d}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0f2ee}
.trow>div:first-child{flex:1;min-width:0}
.trow:first-of-type{border-top:0}
.val{font:700 20px var(--fc);min-width:62px;text-align:right}
.val small{font:500 11px var(--ft);color:var(--mut)}
.good{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}
.spark{width:96px;height:34px;flex:none}
.spark polyline{fill:none;stroke:var(--g);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--g)}
.moodhist{display:flex;flex-wrap:wrap;gap:10px}
.moodhist span{display:flex;flex-direction:column;align-items:center;font-size:26px}
.moodhist small{font-size:11px;color:var(--mut)}
.note{padding:6px 0;border-top:1px solid #f0f2ee;font-size:14px}
.note:first-of-type{border-top:0}
.note small{display:block;color:var(--mut)}
details summary{font-weight:600;cursor:pointer}
details textarea{margin-top:8px}
.sel{width:100%;font:600 16px var(--ft);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:8px 0}
.rk{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #f0f2ee;padding:9px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.rk:first-child{border-top:0}
.rn{width:28px;height:28px;border-radius:50%;background:#eef1ea;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.rn.top{background:var(--lime);color:var(--gd)}
.rkn{flex:1;min-width:0;font-weight:600;display:flex;flex-direction:column;gap:4px}
.rkn i{display:block;height:6px;border-radius:3px;background:var(--g);opacity:.75}
.rv{font:700 19px var(--fc);white-space:nowrap}
.rv small{font:500 11px var(--ft);color:var(--mut)}
.ov{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #f0f2ee;padding:9px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lbl+.ov{border-top:0}
.ovn{font-weight:600;flex:none;width:112px}
.ovp{font-size:14px;text-align:right}.ovp b{color:var(--g)}
.pitch{background:repeating-linear-gradient(180deg,#2b8a4b 0 44px,#277f45 44px 88px);border-radius:14px;padding:14px 8px;position:relative;margin:10px 0;border:3px solid #1d6b3a}
.pitch:before{content:'';position:absolute;left:8px;right:8px;top:50%;border-top:2px solid #ffffff55}
.pitch:after{content:'';position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid #ffffff55;border-radius:50%}
.prowl{display:flex;justify-content:space-around;gap:6px;margin:12px 0;position:relative;z-index:1}
.slot{background:var(--card);border-radius:10px;padding:6px 8px;min-width:0;flex:1;max-width:120px;text-align:center;box-shadow:0 2px 4px #0003}
.slot b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot small{display:block;font-size:11px;color:var(--mut)}
.slot .fit{font:700 15px var(--fc);color:var(--g)}
.slot.tw{background:var(--lime)}
.slot.est{outline:2px dashed #c2410c}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.bench span{background:#eef1ea;border-radius:8px;padding:6px 10px;font-size:13px}
.wt{font-size:13px;color:var(--mut);margin:4px 0}
.btn.sm2{padding:6px 12px;min-height:34px;font-size:13px;white-space:nowrap}
.banner.row{gap:10px}
.teamb{background:var(--lime);color:var(--gd);border:0;border-radius:6px;padding:2px 8px;font:700 15px var(--fc);cursor:pointer;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsel{flex:1;background:none;border:0;text-align:left;font:600 15px var(--ft);color:var(--ink);cursor:pointer;padding:8px 0;min-width:0}
.tsel small{font-weight:400;color:var(--mut)}
.lhead{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.lclock{flex:1;font:700 36px/1 var(--fc);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--gd);font-variant-numeric:tabular-nums;cursor:pointer}
.lclock.run{color:#c2410c}
.lctl{display:flex;flex-direction:column;gap:6px}
.lsc{flex:none;align-self:center;font:700 34px/1 var(--fc);color:var(--gd);padding:0 4px;font-variant-numeric:tabular-nums}
.lstart{flex:none;min-width:84px}
.cardb{flex:0 0 auto!important;display:flex;align-items:center;gap:6px}
.gkinfo a{color:var(--gd);font-weight:600}
.pfrow{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;padding:5px 0;border-top:1px solid #eef1ea;font-size:14px;align-items:center}.pfrow b{text-align:right}.pfrow b.good{color:var(--good)}.pfrow b.bad{color:var(--bad)}.pfh{border-top:0;font-size:12px;color:var(--mut)}.pfh b{font-weight:600}
.subsug{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0 2px}.subsug button{display:block;width:100%;text-align:left;background:#f4fbd6;border:1px solid #d7f25a;border-radius:9px;padding:8px 10px;margin-top:5px;font:600 14px var(--ft);color:var(--ink);cursor:pointer}.subsug small{color:var(--mut);font-weight:500}
.selhint{background:#f4fbd6;border:1px solid #d7f25a;border-radius:10px;padding:6px 10px;font-size:13px;margin:4px 0}
.lslot>b .lmin{font-weight:600;font-size:10.5px}
.lctl .btn{min-height:38px;padding:6px 12px}
.btn:disabled{opacity:.4}
.pitch.live{padding:8px 4px}
.pitch.live .prowl{margin:10px 0;gap:3px}
.lslot{background:var(--card);border-radius:10px;padding:4px 2px 3px;flex:1;max-width:124px;min-width:0;text-align:center;box-shadow:0 2px 4px #0003;cursor:pointer;border:3px solid transparent}
.lslot.empty{background:#ffffffaa;border:2px dashed #fff}
.lslot.sel,.lb.sel{border-color:var(--lime);box-shadow:0 0 0 3px #d7f25a99}
.lslot.tw{background:#f4fbd6;max-width:130px}
.lslot>b{display:block;font-size:12px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lslot small{display:block;font-size:9.5px;line-height:1.2;color:var(--mut);white-space:nowrap;overflow:hidden}
.pm{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:3px}
.pm .cnt{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:12px;min-width:14px;opacity:.85}
.pm button{flex:0 1 40px;min-width:30px;height:42px;border-radius:9px;border:0;font:700 28px/1 var(--ft);color:#fff;cursor:pointer;flex:none;padding:0}
.pm .lm{background:#b4442c}.pm .lp{background:#1d7a3e}
.pm button:active{transform:scale(.9)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.lbench{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.lb{flex:none;background:var(--card);border:3px solid transparent;border-radius:10px;padding:6px 10px;box-shadow:0 1px 3px #0002;cursor:pointer;text-align:center;min-width:78px}
.lb b{display:block;font-size:14px}.lb small{font-size:11px;color:var(--mut)}
button{touch-action:manipulation}
.slot.tap{cursor:pointer;border:3px solid transparent}
.slot.empty{background:#ffffffaa;border:2px dashed #fff}
.slot.sel,.bench span.sel{border-color:var(--lime);box-shadow:0 0 0 3px #d7f25a99}
.bench span.tap{cursor:pointer;border:2px solid transparent}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px #0004;padding:12px 12px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .18s;max-width:640px;margin:0 auto}
#sheet.open{transform:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sgrid button{min-height:46px;border-radius:10px;border:0;font:600 13px/1.2 var(--ft);color:#fff;padding:6px;cursor:pointer}
.sgrid.p button{background:#1d7a3e}.sgrid.m button{background:#b4442c}
.sbarw{height:4px;background:#eef1ea;border-radius:2px;margin-top:10px;overflow:hidden}
.sbar{height:100%;width:100%;background:var(--lime)}
.chip.onp{background:#1d7a3e;border-color:#1d7a3e;color:#fff}.chip.onm{background:#b4442c;border-color:#b4442c;color:#fff}
.arow.open{border-color:#f0d68a;background:#fffbef}
.crow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid #f0f2ee}
.crow.big .cn{font-size:15px}.crow.flag{background:#fff7e6;border-radius:6px}
.cn{width:122px;font-size:13px;font-weight:600;flex:none}.cn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.cbars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.cb{height:7px;background:#eef1ea;border-radius:4px;overflow:hidden}.cb i{display:block;height:100%}
.cb i.t{background:var(--gd)}.cb i.a{background:#8fbf3a}
.cv{display:flex;flex-direction:column;font:700 15px/1.1 var(--fc);text-align:right;min-width:28px}.cv .a{color:#5f8a1f}
.legend i.lt{border-top:5px solid var(--gd)}.legend i.la{border-top:5px solid #8fbf3a}
.score{display:flex;align-items:center;gap:8px;margin:6px 0}
.score .sc{flex:1;text-align:center;font:700 34px/1 var(--fc);color:var(--gd)}
.score .btn{min-height:44px;flex:1}
.goalb{background:var(--gd)!important;color:#fff!important;border-color:var(--gd)!important}
.concb{color:var(--bad)!important;border-color:#efc9bf!important}
.lmin.ok{color:var(--good);font-weight:700}.lmin.warn{color:#c2410c;font-weight:700}.lmin.low{color:#fff;background:var(--bad);border-radius:4px;padding:0 3px;font-weight:700}
.ampel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}
.ampel .chip{padding:5px 10px}
.adot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 6px;vertical-align:middle}.adot.ok{background:var(--good)}.adot.warn{background:#c2410c}.adot.low{background:var(--bad)}
.goal{padding:8px 0;border-top:1px solid #f0f2ee}.goal .gt{font-weight:600;font-size:14px}.goal.done .gt{color:var(--good)}
.gx{background:none;border:0;font-size:20px;color:var(--mut);cursor:pointer;padding:0 6px}
.gst{display:flex;gap:4px;margin-top:6px}.gst button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 2px;font:600 12px var(--ft);color:var(--mut);cursor:pointer}
.gst button.on.offen{background:#eef1ea;color:var(--ink);border-color:#cfd6ca}.gst button.on.besser{background:#fff1d6;color:#9a5b00;border-color:#f0d68a}.gst button.on.erreicht{background:#1d7a3e;color:#fff;border-color:#1d7a3e}
.focus{border-top:1px solid #f0f2ee;padding:10px 0}.ex{background:#f5f7f3;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.skarte{background:linear-gradient(160deg,#ffffff 0%,#f4fbd6 100%);border:3px solid var(--gd);border-radius:18px;padding:18px;margin-top:8px}
.skh{display:flex;align-items:center;gap:10px}.skh img{border-radius:10px}.skt{font:700 22px var(--fc);color:var(--gd)}.sks{font-size:12px;color:var(--mut)}
.skn{font:700 40px/1.1 var(--fc);color:var(--gd);margin:12px 0 6px}
.sksec{margin-top:14px}.skl{font-weight:700;color:var(--gd);margin-bottom:4px}.ski{background:var(--card);border-radius:10px;padding:8px 10px;margin:5px 0;font-size:14.5px;box-shadow:0 1px 2px #0001}.ski b{display:block;color:var(--g)}

function gameSpan(s){const e=s.created||0,lv=s.live||{};const st=isNum(lv.t0)&&lv.t0<e?lv.t0:e-((lv.duration||0)+10)*60000;return[st,e];}

// die bei diesem Kind mehr Aktionen hat. So zählt nichts doppelt, und der breite Blick des einen und der genaue Blick des anderen bleiben erhalten.
function mergeGameRec(base,other){const n=JSON.parse(JSON.stringify(base)),L=n.live,O=other.live||{};L.actions=L.actions||[];L.plus=L.plus||{};L.minus=L.minus||{};
  const cnt=(lv,pid)=>(lv.actions||[]).filter(a=>a.p===pid).length;const pids=new Set([...(O.actions||[]).map(a=>a.p)]);let k=0;
  pids.forEach(pid=>{if(cnt(O,pid)>cnt(L,pid)){L.actions=L.actions.filter(a=>a.p!==pid).concat((O.actions||[]).filter(a=>a.p===pid));L.plus[pid]=(O.plus||{})[pid]||0;L.minus[pid]=(O.minus||{})[pid]||0;k++;}});

    if(bi>=0&&bd<=180){used.add(bi);const o=og[bi];if(!g.p&&!g.og&&(o.p||o.og)){g.p=o.p||null;g.og=!!o.og;k++;}}});
  // Tor-Plus immer passend zur Torliste: alte Tor-Aktionen raus, je Torschütze genau ein Plus
  if(goalPlusOn()){L.actions=L.actions.filter(a=>{if(!a.goal)return true;L.plus[a.p]=Math.max(0,(L.plus[a.p]||0)-1);return false;});

  ['ratings','mood','notes'].forEach(f=>{n[f]=n[f]||{};for(const[pid,v]of Object.entries(other[f]||{}))if(!(pid in n[f]))n[f][pid]=v;});

// ---------- Auswertung ----------
function testScore(s,k,pid){
  const t=TEST[k]; const v=s.results?.[pid]?.[k]; if(!t||!isNum(v))return null;
  const vals=Object.values(s.results||{}).map(r=>r&&r[k]).filter(isNum);
  if(vals.length<3)return 3;
  const m=avg(vals); const sd=Math.sqrt(avg(vals.map(x=>(x-m)**2)));
  if(sd===0)return 3;
  let z=(v-m)/sd; if(t.lower)z=-z;
  return Math.max(1,Math.min(5,3+z));
}
function areaScore(s,pid,ak){
  if(ak==='spiel'){const r=s.ratings?.[pid]||{};const vs=RATINGS.map(x=>r[x.k]).filter(isNum);return vs.length?avg(vs):null;}
  const sc=(s.tests||[]).filter(k=>TEST[k]&&TEST[k].area===ak).map(k=>testScore(s,k,pid)).filter(x=>x!=null);
  if(ak==='torwart'){const r=s.ratings?.[pid]||{};GK_RATINGS.forEach(x=>{if(isNum(r[x.k]))sc.push(r[x.k]);});}
  return sc.length?avg(sc):null;
}
function statsLine(s,t){
  const ps=plist(); const vals=ps.map(p=>s.results?.[p.id]?.[t.k]).filter(isNum);
  if(!vals.length)return `0 von ${ps.length} erfasst`;
  const best=t.lower?Math.min(...vals):Math.max(...vals);
  return `${vals.length} von ${ps.length} erfasst · Schnitt ${fnum(Math.round(avg(vals)*100)/100)} ${esc(t.u)} · bester Wert ${fnum(best)}`;
}

// ---------- Grafiken ----------
function radar(cur,prev){
  const W=360,H=300,cx=180,cy=150,R=100,n=AREAS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;const r=R*(v||0)/5;return[+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)];};
  let g='';
  for(let l=1;l<=5;l++)g+=`<polygon points="${AREAS.map((_,i)=>pt(i,l).join(',')).join(' ')}" class="grid${l===3?' mid':''}"/>`;
  AREAS.forEach((a,i)=>{
    const[x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="grid"/>`;
    const[lx,ly]=pt(i,5.9);const anc=Math.abs(lx-cx)<5?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" dominant-baseline="middle" class="rl${cur[i]==null?' na':''}">${esc(a.s||a.n)}</text>`;
  });
  const poly=(vals,cls)=>`<polygon points="${vals.map((v,i)=>pt(i,v??0).join(',')).join(' ')}" class="${cls}"/>`;
  if(prev.some(x=>x!=null))g+=poly(prev,'pp');
  g+=poly(cur,'pc');
  cur.forEach((v,i)=>{if(v!=null){const[x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3.5" class="pd"/>`;}});
  return `<svg viewBox="0 0 ${W} ${H}" class="radar" role="img" aria-label="Stärkenprofil">${g}</svg>`;
}
// Verlauf für die kleine Linie: ab 9 Werten je Monat gemittelt, damit der Trend sichtbar bleibt
function trendPts(ss,get){const raw=ss.map(s=>({m:(s.date||'').slice(0,7),v:get(s)})).filter(x=>isNum(x.v));if(raw.length<9)return raw.map(x=>x.v);const g=new Map();raw.forEach(x=>{if(!g.has(x.m))g.set(x.m,[]);g.get(x.m).push(x.v);});return g.size>1?[...g.values()].map(avg):raw.map(x=>x.v);}
function spark(vals,lower,min,max){
  const w=96,h=34,p=4;
  if(!vals.length)return'';
  let lo=min??Math.min(...vals),hi=max??Math.max(...vals); if(hi===lo){hi+=1;lo-=1;}
  const pts=vals.map((v,i)=>{const x=vals.length===1?w/2:p+i*(w-2*p)/(vals.length-1);let f=(v-lo)/(hi-lo);if(lower)f=1-f;return[x.toFixed(1),(h-p-f*(h-2*p)).toFixed(1)];});
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}">${pts.length>1?`<polyline points="${pts.map(q=>q.join(',')).join(' ')}"/>`:''}<circle cx="${last[0]}" cy="${last[1]}" r="3"/></svg>`;
}

const CATS=[{g:'Tests',items:TESTS.map(t=>({id:'t:'+t.k,n:t.n}))},{g:'Bereiche (Stärkenprofil)',items:AREAS.map(a=>({id:'a:'+a.k,n:a.n}))},{g:'Trainer-Einschätzung',items:RATINGS.map(r=>({id:'r:'+r.k,n:r.n}))},{g:'Spiele (Live)',items:[{id:'g:tore',n:'Tore'},{id:'g:bil',n:'Tor-Bilanz auf dem Feld'}]},{g:'Athletik (Trainer)',items:ATH_RATINGS.map(r=>({id:'r:'+r.k,n:r.n}))},{g:'Torwart',items:[{id:'a:torwart',n:'Torwart gesamt'},...GK_RATINGS.map(r=>({id:'r:'+r.k,n:'TW: '+r.n}))]}];
function catVal(s,cat,pid){const[t,k]=cat.split(':');if(t==='g'){const lv=s.live;if(!lv||!lv.goals)return null;const played=((lv.mins||{})[pid]||0)>0||lv.goals.some(g=>(g.on||[]).includes(pid));if(!played)return null;const b=gameBal(lv,pid);return k==='tore'?b.tore:b.gf-b.ga;}if(t==='t')return s.results?.[pid]?.[k];if(t==='a')return areaScore(s,pid,k);return s.ratings?.[pid]?.[k];}
function catMeta(cat){const[t,k]=cat.split(':');if(t==='g')return{u:k==='tore'?'Tore':'',lower:false};if(t==='t')return{u:TEST[k].u,lower:!!TEST[k].lower};if(t==='a')return{u:'',lower:false};return{u:'/5',lower:false};}
// Rechen-Zwischenspeicher: gilt bis zur nächsten gespeicherten Änderung (DV zählt bei jedem saveLocal/loadTeam hoch)
let DV=0,CC={k:null,sw:{},sv:{}};
function calcCache(){const k=DV+'|'+CUR+'|'+(S.archView||'')+'|'+formWeeks()+'|'+srcMode()+'|'+Object.keys(S.sessions||{}).length+'|'+Object.keys(S.players||{}).length;if(CC.k!==k)CC={k,sw:{},sv:{}};return CC;}
function sessionsWith(cat){const C=calcCache();if(C.sw[cat])return C.sw[cat];const ps=plist(true);return C.sw[cat]=slist().filter(s=>ps.some(p=>isNum(catVal(s,cat,p.id))));}
function latestVal(cat,pid,ss){const multi=cat.startsWith('r:')||cat==='a:spiel'||cat==='a:torwart';const vals=[];for(const s of ss){const v=catVal(s,cat,pid);if(isNum(v)){if(!multi)return v;vals.push(v);if(vals.length===3)break;}}return vals.length?avg(vals):null;}
function formRows(ps){const cats=[...RATINGS,...ATH_RATINGS].map(r=>'r:'+r.k);const ss={};cats.forEach(c=>ss[c]=sessionsWith(c));
  return ps.map(p=>{const ds=[];cats.forEach(c=>{const po=srcVal(c,p.id,ss[c],'pot'),fo=srcVal(c,p.id,ss[c],'form');if(isNum(po)&&isNum(fo))ds.push({c,d:fo-po});});if(!ds.length)return null;ds.sort((a,b)=>b.d-a.d);return{p,d:avg(ds.map(x=>x.d)),top:ds[0],low:ds[ds.length-1]};}).filter(Boolean);}
// Gesamtstärke fürs Kader: Wert auf der besten Feldposition wie in der Aufstellung, immer mit Werte aus „Mix“ und Zeitraum „Mix“; Torwart-Wert getrennt
function overallAll(ps){const c=S.cfg=S.cfg||{},o={src:c.src,per:c.per},out={};c.src='mix';c.per='mix';
  try{ps.forEach(p=>{if(p.guest)return;const pr=profileOf(p.id);const b=bestField(p,pr);const g=pr['a:torwart'];out[p.id]={f:b.cov>0?b.v:null,pt:b.pt,tw:isNum(g)?g:null};});}
  finally{c.src=o.src;c.per=o.per;}return out;}
function overallOf(pid){const p=S.players[pid];if(!p)return null;const o=overallAll([{...p,id:pid}])[pid];return o?(isNum(o.f)?o.f:o.tw):null;}
// Wer ist in Form? Form (letzte Wochen) gegen Potenzial (ganze Saison), Schnitt über alle Einschätzungs-Kategorien

}
function topOverview(){

function vRank(){

  if(!ss.length&&!(useSrc&&srcMode()!=='trainer'&&ps.some(p=>isNum(appCat(R.cat,p.id)))))return h+`<div class="empty">Für diese Kategorie gibt es noch keine Werte.</div>`;

    if(ss.length)h+=`<select class="sel" onchange="A.rk('sess',this.value)"><option value="cur" ${s?'':'selected'}>Aktuell</option>${ss.map(x=>`<option value="${x.id}" ${s&&x.id===s.id?'selected':''}>${fdate(x.date)} – ${x.type==='game'?'⚽ ':x.type==='eval'?'📝 ':''}${esc(x.title)}</option>`).join('')}</select>`;
    rows=ps.map(p=>({p,v:s?catVal(s,R.cat,p.id):(type==='g'?(()=>{let t=null;ss.forEach(x=>{const v=catVal(x,R.cat,p.id);if(isNum(v))t=(t||0)+v;});return t;})():srcVal(R.cat,p.id,ss))}));
    if(!s&&type!=='g'){note='';}else if(!s)note=type==='g'?(R.cat==='g:tore'?'Summe aller Spiele mit Live-Erfassung.':'Tore minus Gegentore, während das Kind auf dem Feld stand – Summe aller Live-Spiele.'):(type==='t'?'Pro Kind zählt die jeweils letzte Messung – so fehlt niemand, der beim letzten Testtag krank war.':'Einschätzungen: Schnitt der letzten 3 Bewertungen je Kind (Testtage, Spiele und Einschätzungen).');
    if(!s&&useSrc&&srcMode()!=='trainer')note='';
    else if(type==='a')note+=(note?' ':'')+'Wert 3 = Teamschnitt am jeweiligen Testtag.';
    if(s&&useSrc&&srcMode()!=='trainer')note='Bei einer einzelnen Bewertung zählen immer die Trainerwerte.';
  }else{
    const asc=ss.slice().reverse();
    rows=ps.map(p=>{const vals=asc.map(s=>catVal(s,R.cat,p.id)).filter(isNum);if(vals.length<2)return{p,v:null};let d=vals[vals.length-1]-vals[0];if(meta.lower)d=-d;return{p,v:(Math.round(d*100)/100)||0};});
    if(type==='r')unit='Pkt.';
    note=(meta.lower?`Wie viel schneller (in ${unit}) zwischen erster und letzter Messung.`:'Verbesserung zwischen erster und letzter Messung.')+' Erscheint ab zwei Messungen.';
  }
  const lowerBetter=R.mode==='best'&&meta.lower;
  const have=rows.filter(r=>isNum(r.v)).sort((a,b)=>lowerBetter?a.v-b.v:b.v-a.v),miss=rows.filter(r=>!isNum(r.v));
  let rank=0;have.forEach((r,i)=>{if(i===0||r.v!==have[i-1].v)rank=i+1;r.rank=rank;});
  const vs=have.map(r=>r.v),mn=Math.min(...vs),mx=Math.max(...vs);
  const bar=v=>{if(mx===mn)return 100;let f=(v-mn)/(mx-mn);if(lowerBetter)f=1-f;return 12+88*f;};
  if(note)h+=`<div class="sub" style="margin:6px 0">${note}</div>`;
  if(have.length)h+=`<div class="card">${have.map(r=>`<button class="rk" onclick="A.openPlayer('${r.p.id}')"><span class="rn ${r.rank<=3?'top':''}">${r.rank}</span><span class="rkn">${esc(r.p.name)}<i style="width:${bar(r.v).toFixed(0)}%"></i></span><span class="rv">${(R.mode==='progress'||R.cat==='g:bil')&&r.v>0?'+':''}${fnum(type==='a'?Math.round(r.v*10)/10:r.v)}<small> ${esc(unit)}</small></span></button>`).join('')}</div>`;
  else h+=`<div class="empty">Noch niemand mit zwei Messungen.</div>`;
  if(miss.length)h+=`<div class="sub">Ohne Wert: ${miss.map(r=>esc(r.p.name)).join(', ')}</div>`;
  return h;
}

const FORMS={4:{'2-2':['A-L','A-R','S-L','S-R'],'1-2-1':['A-Z','M-L','M-R','S-Z']},5:{'2-2-1':['A-L','A-R','M-L','M-R','S-Z'],'2-1-2':['A-L','A-R','M-Z','S-L','S-R'],'3-1-1':['A-L','A-Z','A-R','M-Z','S-Z']},6:{'2-3-1':['A-L','A-R','M-L','M-Z','M-R','S-Z'],'3-2-1':['A-L','A-Z','A-R','M-L','M-R','S-Z'],'2-2-2':['A-L','A-R','M-L','M-R','S-L','S-R'],'3-1-2':['A-L','A-Z','A-R','M-Z','S-L','S-R']}};
const POS={
  A:{n:'Abwehr',w:{'r:zweik':.3,'r:spielv':.2,'r:komm':.15,'a:tempo':.2,'a:kraft':.15}},
  M:{n:'Mittelfeld',w:{'a:ausdauer':.15,'a:technik':.2,'r:pass':.2,'r:ueber':.15,'r:spielv':.15,'r:frei':.15}},
  S:{n:'Sturm',w:{'a:tempo':.2,'a:technik':.15,'a:gewandt':.1,'r:dribb':.15,'r:mut':.15,'r:frei':.15,'r:abschluss':.1}}
};
const SIDE={L:'links',R:'rechts',Z:'zentral'};
const catShort=c=>catName(c).replace(/\s*\/.*$/,'').replace('\u00AD','').replace('­','').replace('verhalten','');
const catName=c=>{const[t,k]=c.split(':');if(t==='x')return 'Abschluss (aus Spielen, nur App/Mix)';return t==='a'?AREAS.find(a=>a.k===k).n:[...RATINGS,...ATH_RATINGS,...GK_RATINGS].find(r=>r.k===k).n;};
const SRC=[['trainer','Trainer'],['app','App'],['mix','Mix']];
function srcMode(){const m=S.cfg&&S.cfg.src;return m==='app'?m:m==='trainer'||m==='live'?'trainer':'mix';}
// Potenzial (alle Werte der Saison) / Form (letzte X Wochen) / Mix (Mittelwert aus beiden)
const PER=[['pot','Potenzial'],['form','Form'],['mix','Mix']];
function perMode(){const m=S.cfg&&S.cfg.per;return m==='pot'||m==='form'?m:'mix';}
function formWeeks(){const w=S.cfg&&S.cfg.formWeeks;return [4,6,8].includes(w)?w:6;}
function formSince(){const d=new Date();d.setDate(d.getDate()-formWeeks()*7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const mix2=(a,b)=>isNum(a)&&isNum(b)?(a+b)/2:(isNum(a)?a:b);
function periodVal(cat,pid,ss,per){
  const multi=cat.startsWith('r:')||cat==='a:spiel'||cat==='a:torwart';const lower=cat.startsWith('t:')&&TEST[cat.slice(2)]&&TEST[cat.slice(2)].lower;
  const pick=list=>{const v=list.map(s=>catVal(s,cat,pid)).filter(isNum);if(!v.length)return null;if(multi)return avg(v);if(per==='form')return v[0];return lower?Math.min(...v):Math.max(...v);};
  if(per==='pot')return pick(ss);
  if(per==='form'){const since=formSince();return pick(ss.filter(s=>(s.date||'')>=since));}
  return mix2(periodVal(cat,pid,ss,'pot'),periodVal(cat,pid,ss,'form'));
}
let AVC={k:null,m:{}};
function appValsC(pid,per){per=per||perMode();const k=CUR+'|'+META.lastChange+'|'+(S.archView||'')+'|'+formWeeks();if(AVC.k!==k)AVC={k,m:{}};const key=pid+'|'+per;
  if(!AVC.m[key]){if(per==='mix'){const a=appValsC(pid,'pot'),b=appValsC(pid,'form'),o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(x=>{const va=a[x]&&a[x].v,vb=b[x]&&b[x].v;const v=mix2(va,vb);if(isNum(v))o[x]={...(a[x]||b[x]),v,w:Math.max((a[x]&&a[x].w)||0,(b[x]&&b[x].w)||0)};});AVC.m[key]=o;}

      const parts=Object.entries(POS[pt].w).map(([c,w])=>`${esc(catShort(c))} ${isNum(pr[c])?fnum(r1(pr[c])):'–'}<small> ${Math.round(w*100)}%</small>`);

  const used=new Set(Object.values(cur).filter(Boolean));const bench=here.filter(p=>!used.has(p.id));
  S.luRes={res:filled.map(k=>({p:{id:cur[k]},slot:k})),keeper:cur.TW||null,bench:bench.map(p=>p.id),n:L.n,form:L.form};
  h+=fmtPicker('A.cfgFmt');

  const est=filled.filter(k=>fitOf(cur[k],k).cov<.5).map(k=>esc(S.players[cur[k]].name));

  return h;
}

// ---------- Aktions-Kategorien & App-Werte ----------
const ACT_F=[{k:'pass',p:'Toller Pass',m:'Fehlpass'},{k:'dribb',p:'Super Dribbling',m:'Ballverlust im Dribbling'},{k:'schuss',p:'Guter Abschluss',m:'Chance vergeben',mOff:1},{k:'lauf',p:'Guter Laufweg',m:'Falsch gelaufen / versteckt'},{k:'zweik',p:'Zweikampf gewonnen',m:'Zweikampf verloren'},{k:'entsch',p:'Kluge Entscheidung',m:'Falsche Entscheidung'},{k:'verp',p:null,m:'Abspiel verpasst'},{k:'gross',p:null,m:'Großchance vergeben',mo:2.5}];
// Auswahl je Vorzeichen: ausgeblendete Kategorien (mOff) nur zeigen, wenn die Aktion sie schon hat; Minus-Reihenfolge über mo
const catsFor=(gk,plus,cur)=>(gk?ACT_G:ACT_F).map((c,i)=>({c,o:(!plus&&c.mo)||i})).filter(({c})=>c.k===cur||(plus?c.p:(c.m&&!c.mOff))).sort((a,b)=>a.o-b.o).map(x=>x.c);
const ACT_G=[{k:'parade',p:'Starke Parade',m:'Haltbarer Gegentreffer'},{k:'fang',p:'Sicher gefangen',m:'Abprallen lassen'},{k:'raus',p:'Gut herausgelaufen',m:'Falsch herausgelaufen'},{k:'stell',p:'Gut positioniert',m:'Falsch positioniert'},{k:'eroeff',p:'Abwurf/Abstoß angekommen',m:'Abwurf/Abstoß zum Gegner'}];
const ACT_MAP={pass:{pass:1,technik:.5,ueber:.5},dribb:{dribb:1,technik:1},schuss:{technik:1,abschluss:1},lauf:{frei:1},zweik:{zweik:1},entsch:{spielv:1,ueber:.5},verp:{pass:1,ueber:1},gross:{abschluss:2,technik:1},parade:{tw_reak:1},fang:{tw_fang:1},raus:{tw_raus:1},stell:{tw_stell:1},eroeff:{tw_eroeff:1}};
const PASS_TESTS=['pass_r','pass_l'];
const GK_TEST_MAP={tw_fangen:'tw_fang',tw_reaktion:'tw_reak',tw_abwurf:'tw_eroeff'};
const r1=x=>Math.round(x*10)/10;
function appVals(pid,since){
  const games=slist().filter(s=>s.live&&Array.isArray(s.live.actions)&&(!since||(s.date||'')>=since));
  const agg={};
  games.forEach(s=>s.live.actions.forEach(a=>{if(a.p!==pid||!a.c)return;const m=ACT_MAP[a.c];if(!m)return;for(const[k,w]of Object.entries(m)){const g=agg[k]||(agg[k]={p:0,m:0,n:0});if(a.t==='+')g.p+=w;else g.m+=w;g.n++;}}));
  const out={};
  // Aktionen wie Zusatzbewertungen: Plus = 5, Minus = 1, Start bei 3 mit Puffer APP_BUF (2 = doppelt so stark wie früher 4: 2 Aktionen wirken wie früher 4).
  // w = Gewicht im Mix: 2 Aktionen = halbes, 6 Aktionen = 75 % Gewicht.
  for(const[k,g]of Object.entries(agg))out[k]={v:(5*g.p+g.m+3*APP_BUF)/(g.p+g.m+APP_BUF),n:g.n,w:g.n/(g.n+APP_BUF),src:'Spiele'};
  const tests=s=>s.type!=='game';
  ['tempo','gewandt','kraft','ausdauer','technik'].forEach(ak=>{
    const t=latestVal('a:'+ak,pid,sessionsWith('a:'+ak).filter(tests));if(!isNum(t))return;
    if(out[ak]){out[ak]={v:(out[ak].v+t)/2,n:out[ak].n,w:1,src:'Spiele + Tests'};}else out[ak]={v:t,n:null,w:1,src:'Tests'};
  });
  {const pv=PASS_TESTS.map(tk=>latestVal('t:'+tk,pid,sessionsWith('t:'+tk))).filter(isNum).map(raw=>1+Math.min(10,raw)/10*4);
   if(pv.length){const t=avg(pv);if(out.pass)out.pass={v:(out.pass.v+t)/2,n:out.pass.n,w:1,src:'Spiele + Tests'};else out.pass={v:t,n:null,w:1,src:'Tests'};}}
  for(const[tk,rk]of Object.entries(GK_TEST_MAP)){
    const raw=latestVal('t:'+tk,pid,sessionsWith('t:'+tk));if(!isNum(raw))continue;const t=1+Math.min(10,raw)/10*4;
    if(out[rk])out[rk]={v:(out[rk].v+t)/2,n:out[rk].n,w:1,src:'Spiele + Tests'};else out[rk]={v:t,n:null,w:1,src:'Tests'};
  }
  const fk=['spielv','frei','zweik','pass','dribb','ueber','mut','abschluss','technik','tempo','gewandt','kraft','ausdauer'].filter(k=>out[k]);
  out._gesamt=fk.length?{v:avg(fk.map(k=>out[k].v)),n:fk.length,w:avg(fk.map(k=>out[k].w))}:null;
  const gk=GK_RATINGS.map(r=>r.k).filter(k=>out[k]);
  out._tw=gk.length?{v:avg(gk.map(k=>out[k].v)),n:gk.length,w:avg(gk.map(k=>out[k].w))}:null;
  return out;
}
function cmpCard(pid){

    return `<div class="crow ${flag?'flag':''} ${bold?'big':''}"><div class="cn">${name}${flag?' ⚠':''}<small>${info}${meta&&meta.n!=null&&meta.n<5?' · wenig Daten':''}</small></div><div class="cbars">${bar(t,'t')}${bar(a,'a')}</div><div class="cv"><span class="t">${isNum(t)?fnum(r1(t)):'–'}</span><span class="a">${isNum(a)?fnum(r1(a)):'–'}</span></div></div>`;

  let h=`<div class="card"><div class="lbl">Trainer vs. App</div><div class="legend" style="justify-content:flex-start;margin:0 0 6px"><span><i class="lt"></i>Trainer</span><span><i class="la"></i>App (aus Spielen &amp; Testtagen)</span></div>`;
  h+=row('Gesamt',tG,AV._gesamt?AV._gesamt.v:null,null,true);

  const athApp=x=>{const vs=x.app.map(k=>AV[k]).filter(Boolean);return vs.length?{v:avg(vs.map(o=>o.v)),n:null,src:'Tests'}:null;};
  if(ATH_RATINGS.some(x=>isNum(T(x.k))||athApp(x)))h+=`<div class="lbl2">Athletik</div>`+ATH_RATINGS.map(x=>{const a=athApp(x);return row(x.n,T(x.k),a?a.v:null,a);}).join('');
  const only=[['technik','Technik']].filter(([k])=>AV[k]);
  if(only.length)h+=`<div class="lbl2">Nur App</div>`+only.map(([k,n])=>row(n,null,AV[k].v,AV[k])).join('');
  const gkT=GK_RATINGS.map(r=>T(r.k));
  if(gkT.some(isNum)||AV._tw){const gt=gkT.filter(isNum);h+=`<div class="lbl2">Torwart</div>`+row('Torwart gesamt',gt.length?avg(gt):null,AV._tw?AV._tw.v:null,null,true)+GK_RATINGS.map((r,i)=>row(r.n,gkT[i],AV[r.k]?.v,AV[r.k]||{n:0,src:''})).join('');}
  h+=`<details style="margin-top:8px"><summary class="sub">So rechnet die App</summary><div class="wt">Jede kategorisierte Plus-/Minus-Aktion aus Live-Spielen (im gewählten Zeitraum) zählt für die passenden Bereiche (z. B. Toller Pass → Übersicht und Technik). Wert = 3 + 2 × (Plus − Minus) / (Plus + Minus + 4): Mit wenigen Aktionen bleibt er nahe 3, erst mit mehr Aktionen bewegt er sich Richtung 1 oder 5. Technik kommt zusätzlich aus den Testtagen; die Athletik (Schnelligkeit = Sprints, Dynamik = Slalom + Sprung, Ausdauer = Pendellauf) nur aus den Testtagen (3 = Teamschnitt). ⚠ = Trainer und App liegen mindestens 1 Punkt auseinander (ab 5 Aktionen). „Gesamt“ der App enthält auch die Athletik, deins nur deine Einschätzung.</div></details></div>`;
  return h;
}

const ACT2FOCUS={pass:'pass',dribb:'dribb',schuss:'schuss',lauf:'lauf',zweik:'zweik',entsch:'entsch',parade:'tw',fang:'tw',raus:'tw',stell:'tw',eroeff:'tw'};
function trainingFocus(){
  const ps=plist();const games=slist().filter(s=>s.live&&Array.isArray(s.live.actions)).slice(0,4);
  const act={};games.forEach(s=>s.live.actions.forEach(a=>{const f=ACT2FOCUS[a.c];if(!f)return;const g=act[f]||(act[f]={p:0,m:0});if(a.t==='+')g.p++;else g.m++;}));
  const out=[];
  for(const[k,F]of Object.entries(FOCUS)){
    const parts=[],basis=[];
    const g=act[k];if(g&&g.p+g.m>=4){parts.push(3+2*(g.p-g.m)/(g.p+g.m+4));basis.push(`Aktionen: ${g.p} + / ${g.m} −`);}
    const rv=[];ps.forEach(p=>F.r.forEach(rk=>{const v=latestVal('r:'+rk,p.id,sessionsWith('r:'+rk));if(isNum(v))rv.push(v);}));
    if(rv.length>=3){const m=avg(rv);parts.push(m);basis.push(`Trainer-Schnitt ${fnum(r1(m))}`);}
    if(!parts.length)continue;
    const kids=ps.map(p=>{const vs=F.r.map(rk=>latestVal('r:'+rk,p.id,sessionsWith('r:'+rk))).filter(isNum);return{p,v:vs.length?avg(vs):null};}).filter(x=>isNum(x.v)).sort((a,b)=>a.v-b.v).slice(0,3).filter(x=>x.v<3.5);
    out.push({k,F,v:avg(parts),basis,kids});
  }
  return out.sort((a,b)=>a.v-b.v);
}
function focusCard(){
  const fs=trainingFocus();
  if(!fs.length)return `<details class="card"><summary><b>🎯 Trainingsschwerpunkte</b></summary><div class="sub" style="margin-top:6px">Sobald du Kinder einschätzt oder Live-Aktionen mit Kategorie erfasst, schlägt die App hier Schwerpunkte fürs Training vor.</div></details>`;
  const top=fs.slice(0,3);
  return `<details class="card"><summary><b>🎯 Trainingsschwerpunkte:</b> ${top.map(f=>f.F.n).join(', ')}</summary><div class="sub" style="margin:6px 0">Die schwächsten Team-Bereiche aus deinen Einschätzungen und den Live-Aktionen der letzten 4 Spiele. Die Übungen sind Vorschläge – pass sie an euer Training an.</div>${top.map(f=>`<div class="focus"><div class="row between"><b>${f.F.n}</b><span class="pill">${fnum(r1(f.v))} / 5</span></div><div class="sub">${f.basis.join(' · ')}${f.kids.length?` · besonders fördern: ${f.kids.map(x=>esc(short(x.p.id))).join(', ')}`:''}</div>${f.F.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><div>${esc(e[1])}</div><div class="sub">Worauf achten: ${esc(e[2])}</div></div>`).join('')}</div>`).join('')}</details>`;
}
const STRENGTH_TXT={spielv:'Du verstehst das Spiel richtig gut und weißt oft schon vorher, wohin der Ball muss.',frei:'Du bietest dich super an und läufst dich clever frei.',zweik:'Im Zweikampf bist du stark und gibst nicht auf.',ueber:'Du hast den Überblick und siehst deine Mitspieler.',mut:'Du bist mutig – im Zweikampf, im Dribbling und wenn es drauf ankommt.',pass:'Deine Pässe kommen an – du spielst richtig gut ab.',dribb:'Du dribbelst richtig stark und hast den Ball eng am Fuß.',komm:'Du redest mit deinen Mitspielern und hilfst dem Team.',abschluss:'Vor dem Tor bist du eiskalt und triffst richtig gut.',technik:'Du hast eine tolle Ballbehandlung.',tempo:'Du bist richtig schnell!',gewandt:'Du bist super wendig, flink und hast einen starken Antritt.',kraft:'Du hast eine starke Sprungkraft.',ausdauer:'Du hast eine Riesen-Ausdauer und läufst bis zum Schluss.',torwart:'Im Tor kann sich das Team auf dich verlassen.'};
const STRENGTH_NAME={spielv:'Spielverständnis',frei:'Freilaufen',zweik:'Zweikampf',ueber:'Überblick',mut:'Mut',pass:'Passspiel',dribb:'Dribbling',komm:'Teamgeist & Reden',abschluss:'Abschluss',technik:'Technik',tempo:'Schnelligkeit',gewandt:'Dynamik',kraft:'Sprungkraft',ausdauer:'Ausdauer',torwart:'Torwart'};
function vStrength(){
  const pid=S.playerId,p=S.players[pid];if(!p)return `<div class="empty">Spieler nicht gefunden.</div>`;
  const AV=appVals(pid);const T=k=>latestVal('r:'+k,pid,sessionsWith('r:'+k));
  const cand=[];
  RATINGS.forEach(r=>{const vs=[T(r.k),AV[r.k]?.v].filter(isNum);if(vs.length)cand.push({k:r.k,v:avg(vs)});});
  if(AV.technik)cand.push({k:'technik',v:AV.technik.v});
  [['tempo','schnell'],['gewandt','dyn'],['ausdauer','ausd']].forEach(([k,rk])=>{const vs=[AV[k]?.v,T(rk)].filter(isNum);if(vs.length)cand.push({k,v:avg(vs)});});
  if(AV.kraft&&!isNum(T('dyn')))cand.push({k:'kraft',v:AV.kraft.v});
  {const gt=GK_RATINGS.map(r=>T(r.k)).filter(isNum);const vs=[gt.length?avg(gt):null,AV._tw?.v].filter(isNum);if(vs.length)cand.push({k:'torwart',v:avg(vs)});}
  const top=cand.sort((a,b)=>b.v-a.v).slice(0,3);
  const ss=slist().reverse();const prog=[];
  TESTS.forEach(t=>{const pts=ss.map(s=>s.results?.[pid]?.[t.k]).filter(isNum);if(pts.length<2)return;const d=pts[pts.length-1]-pts[0];const better=t.lower?d<0:d>0;if(!better)return;const rel=Math.abs(d)/Math.max(.01,Math.abs(pts[0]));prog.push({t,d:Math.abs(Math.round(d*100)/100),rel});});
  prog.sort((a,b)=>b.rel-a.rel);
  const best={};slist().forEach(s=>((s.live&&s.live.actions)||[]).forEach(a=>{if(a.p===pid&&a.t==='+'&&a.c)best[a.c]=(best[a.c]||0)+1;}));
  const bestTop=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c,n])=>{const cat=[...ACT_F,...ACT_G].find(x=>x.k===c);return `${cat.p} (${n}×)`;});
  const goals=p.goals||[];const done=goals.filter(g=>g.status==='erreicht'),act=goals.filter(g=>g.status!=='erreicht');
  const first=(p.name||'').trim().split(/\s+/)[0];
  let h=`<div class="noprint row between"><button class="back" onclick="A.openPlayer('${pid}')">‹ Profil</button><button class="btn sm2" onclick="A.printCard()">Drucken / PDF</button></div>`;
  h+=`<div class="skarte"><div class="skh"><img src="icon-192.png" alt="" width="44" height="44"><div><div class="skt">Stärkenkarte</div><div class="sks">${esc(TEAMS[CUR]?.name||'')} · ${new Date().toLocaleDateString('de-DE')}</div></div></div><div class="skn">${esc(first)}</div>`;
  h+=top.length?`<div class="sksec"><div class="skl">⭐ Das kannst du richtig gut</div>${top.map(x=>`<div class="ski"><b>${STRENGTH_NAME[x.k]}</b><div>${STRENGTH_TXT[x.k]}</div></div>`).join('')}</div>`:'';
  if(bestTop.length)h+=`<div class="sksec"><div class="skl">💪 Deine besten Aktionen im Spiel</div><div class="ski">${bestTop.join(' · ')}</div></div>`;
  if(prog.length)h+=`<div class="sksec"><div class="skl">📈 Hier bist du besser geworden</div>${prog.slice(0,2).map(x=>`<div class="ski">${esc(x.t.n.replace('TW: ','Torwart – '))}: ${x.t.lower?fnum(x.d)+' '+x.t.u+' schneller':'+'+fnum(x.d)+' '+x.t.u}</div>`).join('')}</div>`;
  if(done.length)h+=`<div class="sksec"><div class="skl">✅ Geschafft</div>${done.slice(-3).map(g=>`<div class="ski">${esc(g.text)}</div>`).join('')}</div>`;
  if(act.length)h+=`<div class="sksec"><div class="skl">🚀 Daran arbeiten wir gerade</div>${act.slice(0,2).map(g=>`<div class="ski">${esc(g.text)}${g.status==='besser'?' – wird schon besser!':''}</div>`).join('')}</div>`;
  if(!top.length&&!prog.length&&!done.length&&!act.length&&!bestTop.length)h+=`<div class="ski">Noch zu wenige Daten – nach dem nächsten Testtag oder Spiel füllt sich die Karte.</div>`;
  h+=`<div class="skf">Weiter so, ${esc(first)}! – Dein Trainerteam</div></div>`;
  h+=`<div class="sub noprint" style="margin-top:8px">Bewusst ohne Ranglisten und Minuspunkte. Zum Teilen am einfachsten einen Screenshot machen.</div>`;
  return h;
}

 {v:43,items:['<b>📤 Sicherung teilen:</b> Neuer Knopf neben „Sicherung speichern“ (Kader → Datensicherung). Schickt die Sicherung direkt per WhatsApp, Mail oder AirDrop.','<b>Doppelt erfasste Spiele:</b> Habt ihr dasselbe Spiel auf zwei Handys live erfasst, legt „Sicherung einlesen“ beide zusammen: Pro Kind zählen die Aktionen aus der Erfassung, die bei diesem Kind genauer war. So zählt nichts doppelt, und dein breiter Blick bleibt genauso erhalten wie der genaue Blick des anderen. Schon doppelt vorhandene Spiele zeigt die App unter „Bewertung“ an, ein Tipp legt sie zusammen.','<b>Sicherer zusammenführen:</b> Kinder, die schon gemeinsam in einer Bewertung vorkommen, schlägt die App nie als doppelt vor (z. B. zwei echte Leons). Jedes Zusammenführen lässt sich 24 Stunden lang mit „↶ Rückgängig“ zurücknehmen.']},

 {v:40,items:['<b>Saison-Rückblick für die Kinder</b> (Einstellungen): zwei bunte PDF-Seiten pro Kind – „So hast du dich entwickelt“ als Netz (Saisonbeginn und -ende), Rekorde beim Testtag, Highlights wie bestes Spiel und erstes Tor, Abzeichen, geschaffte Ziele und eine Nachricht vom Trainerteam. Jedes Kind wird nur mit sich selbst verglichen.','Die Nachricht für den Rückblick trägst du beim Spieler unter ✏️ ein. Ohne Text bleibt Platz zum Reinschreiben.']},

const GUIDE=[
 ['Erste Schritte',`<ol class="st"><li><b>Mannschaft benennen:</b> oben auf den Mannschaftsnamen (z. B. „U10 ▾“) tippen. Dort legst du auch weitere Mannschaften an.</li><li><b>Kader anlegen:</b> Reiter <b>Kader</b> → „+ Spieler“. Vornamen reichen. Optional: Spielweise und Positionstreue – beides fließt in die Aufstellung ein.</li><li><b>Daten sammeln:</b> Testtag, Trainereinschätzung oder direkt ein Live-Spiel.</li><li><b>Sichern:</b> Einstellungen oder Kader → „Sicherung speichern“ → z. B. iCloud Drive.</li></ol>`],
 ['Live-Erfassung im Spiel',`<ol class="st"><li><b>Aufstellung</b> vorbereiten (Spielform, Formation, Torwart, wer ist da) und per Antippen anpassen. Darunter die <b>Spielzeit-Einteilung</b> wählen: durchgehend, 2 Halbzeiten oder 4 Viertel, Minuten pro Abschnitt. Dann „▶ Live mit dieser Aufstellung“.</li><li><b>Anpfiff</b> startet die Uhr, „Pause“ hält sie an. Sie läuft weiter, auch wenn das Handy gesperrt ist.</li><li><b>Halbzeit/Viertel:</b> Ist die Zeit um, wird die Uhr rot und zeigt die Nachspielzeit. „Halbzeit beenden“ stoppt die Uhr, danach „2. Halbzeit anpfeifen“. Am Ende „Abpfiff“.</li><li><b>Spielminuten</b> wie im Fußball: Nachspielzeit als „15+1“, das 2. Viertel beginnt bei 16′.</li><li><b>Plus/Minus</b> unter jedem Spieler. Danach 5 Sekunden Zeit für eine Kategorie (z. B. „Toller Pass“) – oder „Später“.</li><li><b>Tor</b> zählt sofort, danach 7 Sekunden den Torschützen antippen. Der Torschütze bekommt automatisch ein Plus „Guter Abschluss“ (abschaltbar unter „Optionen“). <b>Gegentor</b> mit einem Tipp.</li><li><b>Karten:</b> „Karte“ antippen, Gelb, Gelb-Rot oder Rot wählen, dann den Spieler. Die zweite Gelbe wird automatisch Gelb-Rot. Platzverweise verlassen das Feld.</li><li><b>Wechseln:</b> Spieler antippen (leuchtet), dann Bankspieler = Wechsel oder Feldspieler = Positionstausch. Ausgewechselte Kinder können beliebig oft zurück – alle Einsätze werden addiert.</li><li><b>💡 Wechselvorschlag:</b> Ab Minute 3 schlägt die App über der Bank bis zu zwei Wechsel vor (wenig gespielt rein, lange gespielt raus, passende Position). Antippen = Wechsel.</li><li><b>Spielzeit-Ampel:</b> grün im Ziel, orange knapp, rot zu wenig. Das Ziel, die Formation und „Tor = Plus“ stellst du unter <b>Optionen</b> ein. Die Bank ist nach Spielzeit sortiert. Unter „Spielzeiten“ siehst du jeden Einsatz. 2 Minuten vor Ende jeder Halbzeit erinnert dich die App an letzte Wechsel.</li><li><b>↶</b> (neben „Halbzeit beenden“) nimmt die letzte Aktion zurück – auch Tore, Karten, Wechsel und das Ende eines Abschnitts.</li><li><b>Spiel beenden &amp; speichern:</b> Ergebnis ist eingetragen. Die App bietet direkt an, eine Sicherung zu speichern. Danach bewerten, unter „Aktionen“ offene Kategorien und Torschützen zuordnen, unter „Verlauf“ den Spielverlauf ansehen, unter „Export“ den fertigen Spielbericht für die Elterngruppe teilen.</li></ol>`],
 ['Bewertung',`<ul class="dot"><li><b>⏱ Testtag:</b> nur messen. Tests auswählen, Anleitung beachten, Zeiten mit der Stoppuhr übernehmen (der bessere Versuch bleibt).</li><li><b>📝 Trainereinschätzung:</b> 1–5 für Spielverständnis, Passspiel, Dribbling, Mut, Abschluss, Athletik u. v. m., optional Torwart. Dazu Ziele und Notiz.</li><li><b>⚽ Spiel:</b> entsteht aus dem Live-Spiel oder über „+ Spiel“. Danach die Kinder bewerten.</li><li>Es zählt der Schnitt der letzten 3 Bewertungen je Kind.</li></ul>`],
 ['Aufstellung',`<ul class="dot"><li>„Stärkste“ = höchste Gesamtstärke, „Ausgewogen“ = keine Schwachstelle.</li><li><b>Zeitraum:</b> Potenzial (ganze Saison), Form (letzte 4/6/8 Wochen) oder Mix (Standard). Gilt auch für die Ranglisten.</li><li>Spielweise und Positionstreue aus dem Kader geben Zu- oder Abschläge je Position (z. B. offensiver Verteidiger mit geringer Positionstreue: −0,5 in der Abwehr).</li><li><b>Werte aus:</b> „Trainer“ = nur deine Einschätzung ohne Tests (Tempo, Dynamik, Ausdauer aus deiner Athletik-Einschätzung, Technik aus Dribbling und Passspiel), dazu jede Live-Aktion als Zusatzbewertung (Plus = 5, Minus = 1, 4 Aktionen = 1 Bewertung, Live höchstens die Hälfte). „App“ = Werte aus Live-Aktionen und Testtagen. „Mix“ (Standard) = Mittelwert aus „Trainer“ und „App“. Gilt auch für die Ranglisten.</li><li>Torwart fest wählen oder „Automatisch“: Dann besetzen „Stärkste“ bzw. „Ausgewogen“ auch das Tor, mit dem Kind, mit dem die ganze Aufstellung am besten ist. Kinder mit Torwart-Bewertung zeigen beide Werte (Feld und „TW“). „🧤 Torwart“ zeigt, aus welchen Bewertungen der Torwart-Wert stammt und warum das Kind im Tor steht.</li><li>Spieler antippen, dann Ziel antippen = eigene Aufstellung. Sie bleibt gespeichert.</li><li><b>Gastspieler:</b> „+ Gast“ unter „Wer ist heute dabei?“. Gäste haben keine Werte, füllen nur freie Plätze und erscheinen nicht im Kader und in den Ranglisten. ✕ entfernt sie.</li><li><b>🔍 Warum hier?</b> zeigt je Spieler die Teilwerte der Position mit Gewicht und die Zu-/Abschläge.</li></ul>`],
 ['Profil, Ranglisten &amp; Stärkenkarte',`<ul class="dot"><li><b>Profil:</b> Stärkenprofil (Netz: Form gefüllt, Potenzial gestrichelt), Potenzial &amp; Form (▲/▼ = gerade über/unter Saisonniveau), Entwicklung der Messwerte, Trainer vs. App, Live-Bilanz, Ziele.</li><li><b>Trainer vs. App:</b> deine Einschätzung neben dem Wert aus Tests und Spielen. ⚠ = deutliche Abweichung.</li><li><b>Wer ist in Form?</b> oben in den Ranglisten: ▲/▼ für Kinder, die gerade deutlich über/unter ihrem Saisonniveau liegen.</li><li><b>Ranglisten:</b> nur für dich. Bei Einschätzungs-Kategorien wählst du Trainer, App oder Mix. Zum Zeigen eignet sich die Fortschritts-Rangliste.</li><li><b>Saisonbericht</b> (Einstellungen): pro Kind ein PDF mit Entwicklung, Stärken, Spielminuten und Zielen fürs Elterngespräch – auch für archivierte Saisons. <b>Saison-Rückblick</b> für die Kinder selbst: zwei bunte Seiten mit Entwicklung, Testtag-Rekorden, Highlights, Abzeichen und einer Nachricht vom Trainerteam (Text beim Spieler unter ✏️).</li><li><b>Stärkenkarte:</b> kindgerecht, ohne Ranglisten und Minuspunkte – per Screenshot teilen.</li></ul>`],
 ['Co-Trainer &amp; Datensicherung',`<ul class="dot"><li>Alle Daten liegen nur auf diesem Gerät – kein Konto, keine Cloud.</li><li>Gleicher Kader für den Co-Trainer: „Sicherung speichern“, Datei schicken, beim Co-Trainer „Sicherung einlesen“.</li><li>Gegenseitig eingelesene Sicherungen ergänzen fehlende Daten – gelöscht wird nichts.</li><li><b>Wichtig:</b> Die App erkennt Kinder nicht am Namen, sondern an einer Kennung. Den Kader legt deshalb nur einer an und teilt ihn („Nur Kader teilen“ oder Sicherung), der andere liest ihn ein, <i>bevor</i> er selbst Kinder anlegt. Doppelte Kinder oder eine doppelte Mannschaft lassen sich zusammenführen (Kader bzw. Mannschaft → Bearbeiten).</li><li>Habt ihr ein Spiel beide live erfasst, legt das Einlesen beide zusammen: pro Kind zählt die genauere Erfassung.</li><li><b>Saison-Archiv</b> (Einstellungen): „Saison abschließen“ verschiebt alte Bewertungen ins Archiv und speichert eine Archiv-Datei. „Ansehen“ zeigt Ranglisten und Profile der alten Saison, „Zurückholen“ macht es rückgängig.</li></ul>`],
 ['Datenschutz',`<ul class="dot"><li>Vornamen oder Kürzel verwenden, Handy mit Code sperren.</li><li>Spielerprofil-PDFs und Sicherungen nicht öffentlich teilen.</li><li>Empfehlung: Eltern informieren, dass du zur Förderung Trainingsdaten notierst.</li></ul>`]
];

async function saveJSONFile(name,json,title){
  const blob=new Blob([json],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer: coarse)').matches){await navigator.share({files:[file],title});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;
}

// ---------- Zusammenführen (Co-Trainer hat eigenen Kader angelegt) ----------
// Ersetzt die Spieler-Kennung src überall durch dst. Kollisionen: Plus/Minus/Minuten addieren, Listen anhängen, sonst gewinnt dst.
const SUMK=new Set(['plus','minus','mins']);
function pidRemap(o,src,dst,pk){
  if(Array.isArray(o)){const a=o.map(x=>x===src?dst:pidRemap(x,src,dst,pk));return a.every(x=>typeof x==='string')?[...new Set(a)]:a;}
  if(!o||typeof o!=='object')return o;
  const out={};for(const[k,v]of Object.entries(o)){if(k===src)continue;out[k]=v===src?dst:pidRemap(v,src,dst,k);}
  if(src in o){const v=pidRemap(o[src],src,dst,pk);if(!(dst in out))out[dst]=v;else{const d=out[dst];
    if(SUMK.has(pk)&&isNum(d)&&isNum(v))out[dst]=d+v;else if(Array.isArray(d)&&Array.isArray(v))out[dst]=[...d,...v];
    else if(d&&v&&typeof d==='object'&&typeof v==='object')out[dst]=Object.assign({},v,d);}}
  return out;}
function nameKey(n){return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zß ]/g,'').trim();}
function dupPairs(){const ps=plist(true);const out=[];const ss=slist();const both=(a,b)=>ss.some(s=>hasData(s,a)&&hasData(s,b));for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const a=nameKey(ps[i].name),b=nameKey(ps[j].name);if(!a||!b)continue;const fa=a.split(' ')[0],fb=b.split(' ')[0];if(a===b||(fa===fb&&(a.startsWith(b)||b.startsWith(a)||a.split(' ').length===1||b.split(' ').length===1))&&!both(ps[i].id,ps[j].id))out.push([ps[i],ps[j]]);}
  return out.sort((x,y)=>(nameKey(y[0].name)===nameKey(y[1].name))-(nameKey(x[0].name)===nameKey(x[1].name)));}
const UNDOKEY='u10-undo-v1';
function snapUndo(label){syncTeam();try{localStorage.setItem(UNDOKEY,JSON.stringify({t:Date.now(),label,cur:CUR,teams:TEAMS}));}catch(e){}}
function undoInfo(){try{const u=JSON.parse(localStorage.getItem(UNDOKEY)||'null');return u&&Date.now()-u.t<864e5?u:null;}catch(e){return null;}}
function mergePlayers(src,dst){
  if(S.archView)loadTeam();syncTeam();const t=TEAMS[CUR];const ps=t.players,a=ps[src],b=ps[dst];if(!a||!b||src===dst)return;
  const nb=clone(b);['foot','stil','treue','msg'].forEach(k=>{if(!nb[k]&&a[k])nb[k]=a[k];});nb.goals=[...(b.goals||[]),...(a.goals||[])];if(a.active!==false)nb.active=true;
  for(const[id,s]of Object.entries(t.sessions||{}))if(JSON.stringify(s).includes(src))t.sessions[id]=pidRemap(s,src,dst);
  (t.archive||[]).forEach(ar=>{if(ar.sessions)for(const[id,s]of Object.entries(ar.sessions))if(JSON.stringify(s).includes(src))ar.sessions[id]=pidRemap(s,src,dst);if(ar.players&&ar.players[src]){if(!ar.players[dst])ar.players[dst]=ar.players[src];delete ar.players[src];}});
  if(t.live)t.live=pidRemap(t.live,src,dst);if(t.lu)t.lu=pidRemap(t.lu,src,dst);

}
function mergeTeams(src,dst){
  syncTeam();const a=TEAMS[src],b=TEAMS[dst];if(!a||!b||src===dst)return{np:0,ns:0};let np=0,ns=0;
  b.players=b.players||{};b.sessions=b.sessions||{};

  return `<div class="card fmtp"><div class="lbl" style="margin-bottom:6px">Spielzeit-Einteilung</div><div class="seg" style="margin:0 0 8px">${[[1,'Durchgehend'],[2,'2 Halbzeiten'],[4,'4 Viertel']].map(([n,t])=>`<button class="${F.parts===n?'on':''}" onclick="${fn}('parts',${n})">${t}</button>`).join('')}</div><div class="row between"><span class="sub">Minuten pro ${PART_N(F.parts)}</span><div class="row gap"><button class="btn sm2" onclick="${fn}('len',-5)">−5</button><b class="fmtlen">${F.len}</b><button class="btn sm2" onclick="${fn}('len',5)">+5</button></div></div><div class="sub" style="margin-top:4px">Gesamt ${F.parts*F.len} Minuten</div></div>`;}
// Wechselvorschlag: wer wenig gespielt hat, kommt für den, der am längsten spielt – auf der Position, die am besten passt
function subSuggest(L){
  const el=liveSecs(L);if(el<180||!L.bench.length||L.finished)return[];
  const sent=new Set(L.sentOff||[]);
  const ins=L.bench.filter(p=>!sent.has(p)).sort((a,b)=>liveSecs(L,a)-liveSecs(L,b));
  const outs=Object.keys(L.pos).filter(k=>k!=='TW'&&L.pos[k]).sort((a,b)=>liveSecs(L,L.pos[b])-liveSecs(L,L.pos[a]));
  const res=[],usedS=new Set();
  for(const pin of ins.slice(0,3)){
    let best=null;
    for(const k of outs.slice(0,4)){if(usedS.has(k))continue;const pout=L.pos[k];const gap=(liveSecs(L,pout)-liveSecs(L,pin))/60;if(gap<2)continue;
      const fit=slotFit({...S.players[pin],id:pin},profileOf(pin),k).v;const sc=gap/3+fit;if(!best||sc>best.sc)best={pin,pout,slot:k,sc,gap,fit};}
    if(best){res.push(best);usedS.add(best.slot);}if(res.length===2)break;
  }
  return res;
}

const sw={running:false,t0:0,elapsed:0};
const fms=ms=>(ms/1000).toFixed(2).replace('.',',');
function swPaint(){
  const d=$('#swd'),b=$('#swb'); if(!d)return;
  d.textContent=fms(sw.running?performance.now()-sw.t0:sw.elapsed);
  d.classList.toggle('run',sw.running); if(b)b.textContent=sw.running?'Stopp':'Start';
}
function swLoop(){if(!sw.running)return;swPaint();requestAnimationFrame(swLoop);}

    if(f==='mode'||f==='keeper')L.manual=null;
    L[f]=v;if(f==='n')L.form=Object.keys(FORMS[v])[0];S.luSel=null;saveLocal();render(true);},
  guestModal(){showModal(`<h3>Gastspieler hinzufügen</h3><p class="sub">Zum Beispiel aus der 2. Mannschaft oder dem Mädchenteam. Gäste bekommen keine Werte und erscheinen nicht im Kader und in den Ranglisten. Sie füllen in der Aufstellung nur Plätze, die sonst frei blieben.</p><label>Name<input id="m_gname" placeholder="z. B. Lena (Mädchen)" autocomplete="off"></label><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.guestAdd()">Hinzufügen</button></div>`);setTimeout(()=>{const i=$('#m_gname');if(i)i.focus();},50);},
  guestAdd(){const n=($('#m_gname').value||'').trim();if(!n){toast('Bitte einen Namen eingeben.');return;}const id=uid('g');saveDoc('players',id,{name:n,guest:true,active:true,created:Date.now()});delete S.lu.absent[id];S.luCache=null;closeModal();render(true);toast('Gast '+n+' ist dabei');},
  guestAskDel(id){const p=S.players[id];if(!p)return;showModal(`<h3>${esc(p.name)} entfernen?</h3><p>Der Gast verschwindet aus der Aufstellung. Bereits gespeicherte Spiele behalten den Namen.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.guestDel('${id}')">Entfernen</button></div>`);},
  guestDel(id){const p=S.players[id];if(!p)return;const used=slist().some(s=>s.live&&((s.live.mins||{})[id]||(s.live.actions||[]).some(a=>a.p===id)));if(used)saveDoc('players',id,{...p,active:false});else{delete S.players[id];META.lastChange=Date.now();saveLocal();}if(S.lu.manual&&S.lu.manual.pos)Object.keys(S.lu.manual.pos).forEach(k=>{if(S.lu.manual.pos[k]===id)S.lu.manual.pos[k]=null;});S.luCache=null;closeModal();render(true);},
  luAbs(id){S.lu.absent[id]=!S.lu.absent[id];S.luSel=null;saveLocal();render(true);},
  luTap(kind,key){
    const L=S.lu;
    if(!L.manual||L.manual.n!==L.n||L.manual.form!==L.form){const R=S.luRes;if(!R)return;const pos={};FORMS[L.n][L.form].forEach(k=>pos[k]=null);R.res.forEach(r=>pos[r.slot]=r.p.id);pos.TW=R.keeper||null;L.manual={n:L.n,form:L.form,pos};}
    const M=L.manual,sel=S.luSel;
    if(!sel){S.luSel={kind,key};render(true);return;}
    if(sel.kind===kind&&sel.key===key){S.luSel=null;render(true);return;}
    if(sel.kind==='bench'&&kind==='bench'){S.luSel={kind,key};render(true);return;}
    if(sel.kind==='slot'&&kind==='slot'){const a=M.pos[sel.key];M.pos[sel.key]=M.pos[key];M.pos[key]=a;}
    else{const slot=sel.kind==='slot'?sel.key:key,bp=sel.kind==='bench'?sel.key:key;M.pos[slot]=bp;}
    S.luSel=null;saveLocal();render(true);
  },
  luReset(){S.lu.manual=null;S.luSel=null;saveLocal();render(true);},
  sessF(k){S.sessF=k;S.sessMax=40;render(true);},
  sessMore(){S.sessMax=(S.sessMax||40)+40;render(true);},
  bilAll(){S.bilAll=!S.bilAll;render(true);},
  rk(f,v){S.rk[f]=v;if(f==='cat')S.rk.sess=null;render(true);},
  go(v){S.view=v;render(true);scrollTo(0,0);},
  newSession(){const last=slist()[0];const d=new Date();sessionModal({id:null,date:today(),title:'Testtag '+MONTHS[d.getMonth()],tests:(last&&last.tests?last.tests.slice():DEFAULT_TESTS.slice())});},
  newEval(){const d=new Date();sessionModal({id:null,type:'eval',date:today(),title:'Trainereinschätzung '+MONTHS[d.getMonth()],tests:[]});},
  newGame(){sessionModal({id:null,type:'game',date:today(),title:'Spiel gegen ',result:'',tests:[]});},
  editSession(){const s=S.sessions[S.sessionId];if(!s)return;sessionModal({id:S.sessionId,type:s.type,result:s.result,date:s.date,title:s.title,tests:(s.tests||[]).slice()});},
  togDraft(k,el){const t=S.draft.tests;const i=t.indexOf(k);if(i>=0)t.splice(i,1);else t.push(k);el.classList.toggle('on');},
  saveSession(){
    const d=S.draft;const date=$('#m_date').value||today();let title=$('#m_title').value.trim()||'Testtag';if(/^Spiel gegen$/i.test(title))title='Spiel';
    const game=d.type==='game'||d.type==='eval';
    const tests=game?[]:TESTS.map(t=>t.k).filter(k=>d.tests.includes(k));
    if(!game&&!tests.length){toast('Bitte mindestens einen Test wählen.');return;}
    let id=d.id,doc;
    if(id)doc=clone(S.sessions[id]); else{id=uid('s');doc={results:{},ratings:{},mood:{},notes:{},created:Date.now()};}
    Object.assign(doc,{date,title,tests});
    if(d.type==='game'){doc.type='game';doc.result=($('#m_result').value||'').trim();}
    if(d.type==='eval')doc.type='eval';
    saveDoc('sessions',id,doc);closeModal();
    S.view='session';S.sessionId=id;if(!d.id){S.sessTab=game?'kids':'tests';S.curTest=tests[0];S.kidIdx=0;}
    render(true);
  },
  gameDupAsk(a,b){const A_=S.sessions[a],B_=S.sessions[b];if(!A_||!B_)return;const inf=(s,id)=>{const lv=s.live||{};const n=(lv.actions||[]).length;return `${esc(s.title||'Spiel')}${s.result?' '+esc(s.result):''} · ${n} Aktion${n===1?'':'en'}${s.by===META.dev?' · <b>deine Erfassung</b>':s.by?' · von einem anderen Handy':''}`;};
    showModal(`<h3>Spiel zusammenlegen</h3><div class="sub" style="margin-bottom:10px">Pro Kind zählen die Live-Aktionen aus der Erfassung, die bei diesem Kind mehr Aktionen hat – so zählt nichts doppelt. Wähle, wessen Spielverlauf (Minuten, Tore, Wechsel) bleibt. Fehlende Einschätzungen nach dem Spiel werden ergänzt.</div><button class="btn ${actN(A_)>=actN(B_)?'pri':''}" style="width:100%;margin-bottom:8px;text-align:left" onclick="A.gameDupKeep('${a}','${b}')">${inf(A_)}</button><button class="btn ${actN(B_)>actN(A_)?'pri':''}" style="width:100%;text-align:left" onclick="A.gameDupKeep('${b}','${a}')">${inf(B_)}</button><div class="row end gap" style="margin-top:12px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  async gameDupKeep(keep,drop){const d=S.sessions[drop];if(!d||!S.sessions[keep])return;snapUndo('Doppeltes Spiel zusammengelegt');const k=mergeGameRec(S.sessions[keep],{...d,id:drop}).n;saveDoc('sessions',keep,k);await removeDoc('sessions',drop);closeModal();render(true);toast('Spiel zusammengelegt');},
  undoAsk(){const u=undoInfo();if(!u)return;showModal(`<h3>Rückgängig machen?</h3><div class="sub" style="margin-bottom:12px">„${esc(u.label)}“ von ${new Date(u.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr wird zurückgenommen. Alles, was du seitdem eingegeben hast, geht dabei verloren.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.undoDo()">Rückgängig</button></div>`);},
  undoDo(){const u=undoInfo();if(!u)return;TEAMS=u.teams;CUR=TEAMS[u.cur]?u.cur:Object.keys(TEAMS)[0];loadTeam();try{localStorage.removeItem(UNDOKEY);}catch(e){}META.lastChange=Date.now();saveLocal();closeModal();S.luCache=null;render(true);toast('Zurückgenommen');},
  askDelSession(id){showModal(`<h3>Wirklich löschen?</h3><p>Alle Messwerte, Einschätzungen und Notizen dieses Eintrags gehen verloren.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.delSession('${id}')">Endgültig löschen</button></div>`);},
  async delSession(id){closeModal();S.view='sessions';await removeDoc('sessions',id);render(true);toast('Gelöscht');},
  openSession(id){S.view='session';S.sessionId=id;S.sessTab=['game','eval'].includes(S.sessions[id]?.type)?'kids':'tests';S.curTest=null;S.kidIdx=0;render(true);scrollTo(0,0);},
  sessTab(k){S.sessTab=k;render(true);},
  curTest(k){S.curTest=k;A.swReset();render(true);},
  setVal(pid,el){
    const t=TEST[S.curTest];const n=parseNum(el.value);
    const bad=Number.isNaN(n)||(n!==null&&(n<0||(t.max&&n>t.max)));
    el.classList.toggle('bad',bad);if(bad)return;
    const s=clone(S.sessions[S.sessionId]);s.results=s.results||{};const r=s.results[pid]=s.results[pid]||{};
    if(n===null)delete r[t.k];else r[t.k]=n;
    saveDoc('sessions',S.sessionId,s);const st=$('#stats');if(st)st.innerHTML=statsLine(s,t);
  },
  take(pid,btn){
    if(sw.running){toast('Erst die Stoppuhr anhalten.');return;}
    const v=Math.round(sw.elapsed/10)/100;if(!v){toast('Noch keine Zeit gestoppt.');return;}
    const t=TEST[S.curTest];const s=clone(S.sessions[S.sessionId]);s.results=s.results||{};const r=s.results[pid]=s.results[pid]||{};
    const old=r[t.k];const name=S.players[pid]?.name||'';
    if(isNum(old)&&old<=v){toast(`${fnum(v)} s – bester Wert ${fnum(old)} s bleibt`);}
    else{r[t.k]=v;saveDoc('sessions',S.sessionId,s);const inp=btn.parentElement.querySelector('input');if(inp){inp.value=fnum(v);inp.classList.remove('bad');}const st=$('#stats');if(st)st.innerHTML=statsLine(s,t);toast(`${fnum(v)} s für ${name}`);}
    A.swReset();
  },
  swToggle(){if(sw.running){sw.elapsed=performance.now()-sw.t0;sw.running=false;}else{sw.t0=performance.now();sw.elapsed=0;sw.running=true;requestAnimationFrame(swLoop);}swPaint();},
  swReset(){sw.running=false;sw.elapsed=0;swPaint();},
  kid(d){const n=plist().length;if(!n)return;S.kidIdx=(S.kidIdx+d+n)%n;render(true);},
  kidSel(v){S.kidIdx=+v;render(true);},
  rate(pid,k,n){const s=clone(S.sessions[S.sessionId]);s.ratings=s.ratings||{};const r=s.ratings[pid]=s.ratings[pid]||{};if(r[k]===n)delete r[k];else r[k]=n;saveDoc('sessions',S.sessionId,s);render(true);},
  mood(pid,n){const s=clone(S.sessions[S.sessionId]);s.mood=s.mood||{};if(s.mood[pid]===n)delete s.mood[pid];else s.mood[pid]=n;saveDoc('sessions',S.sessionId,s);render(true);},
  note(pid,el){const s=clone(S.sessions[S.sessionId]);s.notes=s.notes||{};const v=el.value;if(v.trim())s.notes[pid]=v;else delete s.notes[pid];saveDoc('sessions',S.sessionId,s);},
  async shareText(sel){const el=$(sel);if(!el)return;if(navigator.share){try{await navigator.share({text:el.value});}catch(e){}return;}A.copy(sel);},
  copy(sel){
    const el=$(sel);if(!el)return;const txt=el.value;
    const manual=()=>{el.focus();el.select();toast('Bitte markierten Text manuell kopieren.');};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'),manual);else manual();}catch(e){manual();}
  },
  openPlayer(id){S.view='player';S.playerId=id;render(true);scrollTo(0,0);},
  playerModal(id){
    const p=id?S.players[id]:{name:'',foot:'rechts',active:true};S.draftP=id||null;
    showModal(`<h3>${id?'Spieler bearbeiten':'Neuer Spieler'}</h3><label>Vorname / Kürzel<input id="m_name" value="${esc(p.name)}" autocomplete="off" onkeydown="if(event.key==='Enter')A.savePlayer(${id?'false':'true'})"></label><label>Starker Fuß<select id="m_foot">${['rechts','links','beide'].map(f=>`<option ${p.foot===f?'selected':''}>${f}</option>`).join('')}</select></label><label>Spielweise<select id="m_stil"><option value="">– keine Angabe –</option>${['offensiv','ausgewogen','defensiv'].map(f=>`<option ${p.stil===f?'selected':''}>${f}</option>`).join('')}</select></label><label>Positionstreue<select id="m_treue"><option value="">– keine Angabe –</option>${[['hoch','hoch – hält seine Position'],['mittel','mittel'],['gering','gering – verlässt oft seine Position']].map(([v,n])=>`<option value="${v}" ${p.treue===v?'selected':''}>${n}</option>`).join('')}</select></label><div class="sub" style="margin:-4px 0 10px">Fließt in den Aufstellungsvorschlag ein, z. B. Abzug für offensive Verteidiger.</div>${id?`<label>Nachricht für den Saison-Rückblick <small class="sub">(optional)</small><textarea id="m_msg" rows="3" placeholder="z. B. Liebe Mia, du hast nie aufgegeben …">${esc(p.msg||'')}</textarea></label><label class="chk"><input type="checkbox" id="m_act" ${p.active!==false?'checked':''}> aktiv im Kader</label><button class="btn" style="width:100%;margin:0 0 12px" onclick="A.mergePick('${id}')">🔗 Mit anderem Kind zusammenführen</button>`:''}<div class="row end gap">${id?`<button class="btn danger" onclick="A.askDelPlayer('${id}')">Löschen</button><span class="grow"></span>`:`<button class="btn" onclick="A.savePlayer(true)">+ Nächster</button>`}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.savePlayer(false)">Speichern</button></div>`);
    setTimeout(()=>{const n=$('#m_name');if(n&&!id)n.focus();},60);
  },
  savePlayer(next){
    const name=$('#m_name').value.trim();if(!name){toast('Bitte einen Namen eingeben.');return;}
    const id=S.draftP||uid('p');
    const p=Object.assign(clone(S.players[id]||{created:Date.now()}),{name,foot:$('#m_foot').value,stil:$('#m_stil').value||null,treue:$('#m_treue').value||null,...($('#m_msg')?{msg:$('#m_msg').value.trim()||null}:{}),active:$('#m_act')?$('#m_act').checked:true});
    saveDoc('players',id,p);closeModal();render(true);
    if(next){toast(name+' angelegt');A.playerModal();}
  },
  mergePick(id){const p=S.players[id];const others=plist(true).filter(q=>q.id!==id);const k=nameKey(p.name).split(' ')[0];others.sort((a,b)=>(nameKey(b.name).startsWith(k)?1:0)-(nameKey(a.name).startsWith(k)?1:0));
    showModal(`<h3>„${esc(p.name)}“ zusammenführen</h3><div class="sub" style="margin-bottom:10px">Mit welchem Kind ist ${esc(p.name)} dasselbe Kind? Alle Bewertungen, Testwerte, Spiele und Ziele landen danach bei einem Eintrag.</div><div class="chips">${others.map(q=>`<button class="chip" onclick="A.mergeAsk('${id}','${q.id}')">${esc(q.name)}</button>`).join('')}</div><div class="row end gap" style="margin-top:14px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  mergeAsk(a,b){const pa=S.players[a],pb=S.players[b];if(!pa||!pb)return;const n=id=>slist().filter(s=>hasData(s,id)).length;
    showModal(`<h3>Zusammenführen</h3><div class="sub" style="margin-bottom:10px">Welcher Name soll bleiben? Die Werte beider Einträge werden zusammengelegt, nichts geht verloren. Gibt es in derselben Bewertung Werte bei beiden, zählt der des bleibenden Eintrags.</div><button class="btn pri" style="width:100%;margin-bottom:8px" onclick="A.mergeDo('${b}','${a}')">„${esc(pa.name)}“ behalten <small>(${n(a)} + ${n(b)} Bewertungen)</small></button><button class="btn pri" style="width:100%" onclick="A.mergeDo('${a}','${b}')">„${esc(pb.name)}“ behalten <small>(${n(b)} + ${n(a)} Bewertungen)</small></button><div class="row end gap" style="margin-top:14px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  mergeDo(src,dst){const nm=S.players[dst]&&S.players[dst].name;snapUndo('Zusammenführen '+nm);mergePlayers(src,dst);closeModal();if(S.playerId===src)S.playerId=dst;S.luCache=null;render(true);toast(`Zusammengeführt: ${nm}`);},
  mergeAllAsk(){const n=dupPairs().length;showModal(`<h3>Alle ${n} zusammenführen?</h3><div class="sub" style="margin-bottom:12px">Pro Paar bleibt der Eintrag mit mehr Bewertungen (bei Gleichstand der ältere). Die Werte beider Einträge werden zusammengelegt. Tipp: vorher eine Sicherung speichern.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.mergeAll()">Zusammenführen</button></div>`);},
  mergeAll(){snapUndo('Alle zusammenführen');let k=0,guard=0;let dp;while((dp=dupPairs()).length&&guard++<200){const[a,b]=dp[0];const n=id=>slist().filter(s=>hasData(s,id)).length;const na=n(a.id),nb=n(b.id);const keepA=na>nb||(na===nb&&(a.created||0)<=(b.created||0));mergePlayers(keepA?b.id:a.id,keepA?a.id:b.id);k++;}closeModal();S.luCache=null;render(true);toast(`${k} Kinder zusammengeführt`);},
  teamMergePick(id){const ids=Object.keys(TEAMS).filter(x=>x!==id);showModal(`<h3>„${esc(TEAMS[id].name)}“ zusammenführen</h3><div class="sub" style="margin-bottom:10px">Alle Spieler, Testtage, Spiele und Archive von „${esc(TEAMS[id].name)}“ wandern in die gewählte Mannschaft. „${esc(TEAMS[id].name)}“ verschwindet danach. Doppelte Kinder führst du anschließend im Kader zusammen.</div>${ids.map(x=>`<button class="btn" style="width:100%;margin-bottom:6px" onclick="A.teamMergeDo('${id}','${x}')">in „${esc(TEAMS[x].name)}“</button>`).join('')}<div class="row end gap" style="margin-top:10px"><button class="btn" onclick="A.teamEdit('${id}')">Zurück</button></div>`);},
  teamMergeDo(src,dst){snapUndo('Mannschaften zusammenführen');const r=mergeTeams(src,dst);CUR=null;A.switchTeam(dst);S.view='players';render(true);toast(`${r.np} Spieler und ${r.ns} Bewertungen übernommen`);},
  askDelPlayer(id){showModal(`<h3>Spieler löschen?</h3><p>Tipp: Wenn ein Kind die Mannschaft verlässt, reicht „aktiv im Kader“ abwählen – dann bleibt der Verlauf erhalten.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.delPlayer('${id}')">Endgültig löschen</button></div>`);},
  async delPlayer(id){
    closeModal();S.view='players';
    for(const s of slist()){if(hasData(s,id)){const d=clone(S.sessions[s.id]);['results','ratings','mood','notes'].forEach(k=>{if(d[k])delete d[k][id];});saveDoc('sessions',s.id,d);}}
    await removeDoc('players',id);render(true);toast('Spieler gelöscht');
  }
};
window.A=A;

// ---------- Start ----------
(function init(){
  loadLocal();S.mode='local';S.ready=true;render(true);
  setTimeout(()=>{const has=Object.keys(S.players).length||Object.keys(S.sessions).length;if(!META.seenVersion&&!has){META.seenVersion=+APP_VERSION;saveLocal();}else if((META.seenVersion||0)<+APP_VERSION)whatsNew(false);},400);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloaded)return;reloaded=true;saveLocal();location.reload();});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
  }
})();
</script>
</body>
