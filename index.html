  const q=s.ratings?.[pid]; if(q&&Object.values(q).some(isNum))return true;
  const lv=s.live;if(lv&&((lv.plus||{})[pid]||(lv.minus||{})[pid]||(lv.mins||{})[pid]||(lv.goals||[]).some(g=>g.p===pid||(g.on||[]).includes(pid))||(lv.cards||[]).some(c=>c.p===pid)))return true;
  return isNum(s.mood?.[pid])||!!s.notes?.[pid];
}

// Doppelt erfasstes Live-Spiel (z. B. Trainer und Co-Trainer haben beide live mitgeschrieben): gleicher Tag, Spielzeiten überschneiden sich.
function gameSpan(s){const e=s.created||0,lv=s.live||{};const st=isNum(lv.t0)&&lv.t0<e?lv.t0:e-((lv.duration||0)+10)*60000;return[st,e];}
function sameGame(a,b){if(!a||!b||a===b||a.type!=='game'||b.type!=='game'||!a.live||!b.live||a.date!==b.date||!a.created||!b.created)return false;
  const[a0,a1]=gameSpan(a),[b0,b1]=gameSpan(b);const ov=Math.min(a1,b1)-Math.max(a0,b0);return ov>0&&ov>=.5*Math.min(a1-a0,b1-b0);}
const actN=s=>((s&&s.live&&s.live.actions)||[]).length;
// Zwei Erfassungen desselben Spiels zusammenlegen: Spielverlauf (Minuten, Tore, Wechsel) aus base, Live-Aktionen PRO KIND aus der Erfassung,
// die bei diesem Kind mehr Aktionen hat. So zählt nichts doppelt, und der breite Blick des einen und der genaue Blick des anderen bleiben erhalten.
function mergeGameRec(base,other){const n=JSON.parse(JSON.stringify(base)),L=n.live,O=other.live||{};L.actions=L.actions||[];L.plus=L.plus||{};L.minus=L.minus||{};
  const cnt=(lv,pid)=>(lv.actions||[]).filter(a=>a.p===pid).length;const pids=new Set([...(O.actions||[]).map(a=>a.p)]);let k=0;
  pids.forEach(pid=>{if(cnt(O,pid)>cnt(L,pid)){L.actions=L.actions.filter(a=>a.p!==pid).concat((O.actions||[]).filter(a=>a.p===pid));L.plus[pid]=(O.plus||{})[pid]||0;L.minus[pid]=(O.minus||{})[pid]||0;k++;}});
  // Tore: eigene Torliste bleibt; offene Torschützen aus der anderen Erfassung (gleiches Tor = Spielzeit ±3 Min.) übernehmen
  const og=(O.goals||[]).filter(g=>g.t==='goal'),used=new Set();
  (L.goals||[]).forEach(g=>{if(g.t!=='goal')return;g.id=g.id||uid('g');let bi=-1,bd=1e9;og.forEach((o,i)=>{if(used.has(i))return;const d=Math.abs((o.sec||0)-(g.sec||0));if(d<bd){bd=d;bi=i;}});
    if(bi>=0&&bd<=180){used.add(bi);const o=og[bi];if(!g.p&&!g.og&&(o.p||o.og)){g.p=o.p||null;g.og=!!o.og;k++;}if(!g.a&&o.a&&o.a!==g.p){g.a=o.a;k++;}}});
  // Tor-Plus immer passend zur Torliste: alte Tor-Aktionen raus, je Torschütze genau ein Plus
  if(goalPlusOn()){L.actions=L.actions.filter(a=>{if(!a.goal)return true;L.plus[a.p]=Math.max(0,(L.plus[a.p]||0)-1);return false;});
    (L.goals||[]).forEach(g=>{if(g.t==='goal'&&g.p){L.plus[g.p]=(L.plus[g.p]||0)+1;L.actions.push({t:'+',p:g.p,c:'schuss',at:isNum(g.at)?g.at:null,ml:g.ml,sec:g.sec,gk:false,goal:g.id});}});}
  if(goalPlusOn()){L.actions=L.actions.filter(a=>{if(!a.ast)return true;L.plus[a.p]=Math.max(0,(L.plus[a.p]||0)-1);return false;});(L.goals||[]).forEach(g=>{if(g.t==='goal'&&g.a&&g.p&&g.a!==g.p){L.plus[g.a]=(L.plus[g.a]||0)+1;L.actions.push({t:'+',p:g.a,c:'vorl',at:isNum(g.at)?g.at:null,ml:g.ml,sec:g.sec,gk:false,ast:g.id});}});}
  ['ratings','mood','notes'].forEach(f=>{n[f]=n[f]||{};for(const[pid,v]of Object.entries(other[f]||{}))if(!(pid in n[f]))n[f][pid]=v;});
  n.merged=(n.merged||[]).concat(other.id||'x');return{n,k};}
function dupGames(){const ss=slist().filter(s=>s.type==='game'&&s.live);const out=[];for(let i=0;i<ss.length;i++)for(let j=i+1;j<ss.length;j++)if(sameGame(ss[i],ss[j]))out.push([ss[i],ss[j]]);return out;}
function importData(txt){
  let d;try{d=JSON.parse(txt);}catch(e){toast('Das ist keine gültige Sicherung.');return false;}
  if(!d||typeof d!=='object'||(!d.teams&&!d.players&&!d.sessions)){toast('Keine Spielerdaten gefunden.');return false;}
  if(S.archView)loadTeam();syncTeam();let nt=0,np=0,ns=0,na=0,ng=0,ngr=0,nf=0,nar=0;
  const merge=(t,src)=>{t.players=t.players||{};t.sessions=t.sessions||{};
    for(const a of (Array.isArray(src.archive)?src.archive:[]))if(a&&a.id&&a.sessions&&!(t.archive||[]).some(x=>x.id===a.id)){(t.archive=t.archive||[]).push(a);na++;}
    // Schon archiviert: gleiche Kennung, als doppelte Erfassung in ein archiviertes Spiel eingeflossen, oder Datum liegt in einer abgeschlossenen Saison
    const inArch=(id,s)=>(t.archive||[]).some(a=>a.sessions&&(a.sessions[id]||Object.values(a.sessions).some(x=>(x.merged||[]).includes(id)||sameGame(x,s))||(s&&s.date&&a.from&&a.to&&s.date>=a.from&&s.date<=a.to)));
    for(const[id,p]of Object.entries(src.players||{})){if(!t.players[id]){t.players[id]=p;np++;continue;}
      // Vorhandenes Kind: eigene Angaben bleiben, nur leere Felder werden ergänzt

    for(const[id,s]of Object.entries(src.sessions||{}))if(!t.sessions[id]){if(inArch(id,s)){nar++;continue;}
      // Gleiches Spiel schon vorhanden: pro Kind zählt die Erfassung mit mehr Aktionen (Spielverlauf bleibt der eigene)
      const ex=Object.entries(t.sessions).find(([,x])=>sameGame(x,s));
      if(ex){const[eid,x]=ex;if((x.merged||[]).includes(id)){ng++;continue;}const r=mergeGameRec(x,{...s,id});t.sessions[eid]=r.n;ngr++;continue;}
      t.sessions[id]=s;ns++;}};
  if(d.teams&&typeof d.teams==='object'){
    for(const[id,t]of Object.entries(d.teams)){if(!t||typeof t!=='object')continue;if(!TEAMS[id]){TEAMS[id]={name:t.name||'Mannschaft',players:{},sessions:{},created:t.created||Date.now()};nt++;}merge(TEAMS[id],t);}
  }else merge(TEAMS[CUR],d);
  // Neues Gerät: leere Start-Mannschaft durch die eingelesene ersetzen
  {const c=TEAMS[CUR],tg=d.current&&TEAMS[d.current]?d.current:null;if(tg&&tg!==CUR&&c&&!Object.keys(c.players||{}).length&&!Object.keys(c.sessions||{}).length&&!(c.archive||[]).length){delete TEAMS[CUR];CUR=tg;}}
  loadTeam();META.lastChange=Date.now();saveLocal();render(true);
  toast(`${nt?nt+(nt===1?' Mannschaft, ':' Mannschaften, '):''}${np} Spieler und ${ns} Bewertungen übernommen${na?` · ${na} archivierte Saison${na===1?'':'s'}`:''}${ngr?` · ${ngr} doppelt erfasste${ngr===1?'s':''} Spiel${ngr===1?'':'e'} zusammengelegt (pro Kind zählt die genauere Erfassung)`:''}${nf?` · bei ${nf} Kind${nf===1?'':'ern'} fehlende Angaben (Fuß/Spielweise/Positionstreue) ergänzt`:''}${nar?` · ${nar} ältere Bewertung${nar===1?'':'en'} gehör${nar===1?'t':'en'} zu einer abgeschlossenen Saison und ${nar===1?'wurde':'wurden'} übersprungen`:''}`);return true;
}

// ---------- Auswertung ----------
function testScore(s,k,pid){
  const t=TEST[k]; const v=s.results?.[pid]?.[k]; if(!t||!isNum(v))return null;
  // Note gegen alle Messungen der Saison (alle Testtage, alle Kinder) statt nur gegen die Kinder desselben Tages:
  // gleiche Zeit = gleiche Note, echte Verbesserung wird sichtbar, fehlende Starke verschieben nichts (Christian 11.11.2026)
  const C=calcCache();C.ts=C.ts||{};let st=C.ts[k];
  if(!st){const vals=[];Object.values(S.sessions||{}).forEach(x=>{if(x.type==='game')return;Object.values(x.results||{}).forEach(r=>{if(r&&isNum(r[k]))vals.push(r[k]);});});
    const m=vals.length?avg(vals):0;st=C.ts[k]={n:vals.length,m,sd:vals.length?Math.sqrt(avg(vals.map(x=>(x-m)**2))):0};}
  if(st.n<3)return 3;
  const m=st.m,sd=st.sd;
  if(sd===0)return 3;
  let z=(v-m)/sd; if(t.lower)z=-z;
  return Math.max(1,Math.min(5,3+z));
}
function areaScore(s,pid,ak){
  if(ak==='spiel'){const r=s.ratings?.[pid]||{};const vs=RATINGS.map(x=>r[x.k]).filter(isNum);return vs.length?avg(vs):null;}
  if(COMPOS[ak]&&ak!=='absch'){const r=s.ratings?.[pid]||{};const vs=COMPOS[ak].map(x=>r[x]).filter(isNum);return vs.length?avg(vs):null;}
  if(ak==='ath'){const r=s.ratings?.[pid]||{};const vs=[...ATH_AX.map(a=>areaScore(s,pid,a)),...ATH_RATINGS.map(x=>r[x.k])].filter(isNum);return vs.length?avg(vs):null;}
  if(ak==='absch'){const r=s.ratings?.[pid]||{};const vs=(s.tests||[]).filter(k=>TEST[k]&&TEST[k].area==='absch').map(k=>testScore(s,k,pid)).filter(x=>x!=null);if(isNum(r.abschluss))vs.push(r.abschluss);return vs.length?avg(vs):null;}
  const sc=(s.tests||[]).filter(k=>TEST[k]&&TEST[k].area===ak).map(k=>testScore(s,k,pid)).filter(x=>x!=null);
  if(ak==='torwart'){const r=s.ratings?.[pid]||{};GK_RATINGS.forEach(x=>{if(isNum(r[x.k]))sc.push(r[x.k]);});}
  return sc.length?avg(sc):null;
}
function statsLine(s,t){
  const ps=plist(); const vals=ps.map(p=>s.results?.[p.id]?.[t.k]).filter(isNum);
  if(!vals.length)return `0 von ${ps.length} erfasst`;
  const best=t.lower?Math.min(...vals):Math.max(...vals);
  return `${vals.length} von ${ps.length} erfasst · Schnitt ${fnum(Math.round(avg(vals)*100)/100)} ${esc(t.u)} · bester Wert ${fnum(best)}`;
}

// ---------- Grafiken ----------
function radar(cur,prev,AX){AX=AX||AREAS;
  const W=360,H=300,cx=180,cy=150,R=100,n=AX.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;const r=R*(v||0)/5;return[+(cx+r*Math.cos(a)).toFixed(1),+(cy+r*Math.sin(a)).toFixed(1)];};
  let g='';
  for(let l=1;l<=5;l++)g+=`<polygon points="${AX.map((_,i)=>pt(i,l).join(',')).join(' ')}" class="grid${l===3?' mid':''}"/>`;
  AX.forEach((a,i)=>{
    const[x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="grid"/>`;
    const[lx,ly]=pt(i,5.9);const anc=Math.abs(lx-cx)<5?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" dominant-baseline="middle" class="rl${cur[i]==null?' na':''}">${esc(a.s||a.n)}</text>`;
  });
  const poly=(vals,cls)=>`<polygon points="${vals.map((v,i)=>pt(i,v??0).join(',')).join(' ')}" class="${cls}"/>`;
  if(prev.some(x=>x!=null))g+=poly(prev,'pp');
  g+=poly(cur,'pc');
  cur.forEach((v,i)=>{if(v!=null){const[x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3.5" class="pd"/>`;}});
  return `<svg viewBox="0 0 ${W} ${H}" class="radar" role="img" aria-label="Stärkenprofil">${g}</svg>`;
}
// Verlauf für die kleine Linie: ab 9 Werten je Monat gemittelt, damit der Trend sichtbar bleibt
function trendPts(ss,get){const raw=ss.map(s=>({m:(s.date||'').slice(0,7),v:get(s)})).filter(x=>isNum(x.v));if(raw.length<9)return raw.map(x=>x.v);const g=new Map();raw.forEach(x=>{if(!g.has(x.m))g.set(x.m,[]);g.get(x.m).push(x.v);});return g.size>1?[...g.values()].map(avg):raw.map(x=>x.v);}
function spark(vals,lower,min,max){
  const w=96,h=34,p=4;
  if(!vals.length)return'';
  let lo=min??Math.min(...vals),hi=max??Math.max(...vals); if(hi===lo){hi+=1;lo-=1;}
  const pts=vals.map((v,i)=>{const x=vals.length===1?w/2:p+i*(w-2*p)/(vals.length-1);let f=(v-lo)/(hi-lo);if(lower)f=1-f;return[x.toFixed(1),(h-p-f*(h-2*p)).toFixed(1)];});
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}">${pts.length>1?`<polyline points="${pts.map(q=>q.join(',')).join(' ')}"/>`:''}<circle cx="${last[0]}" cy="${last[1]}" r="3"/></svg>`;
}

// ---------- Ranglisten ----------
const CATS=[{g:'Tests',items:TESTS.map(t=>({id:'t:'+t.k,n:t.n}))},{g:'Bereiche (Stärkenprofil)',items:AREAS.map(a=>({id:'a:'+a.k,n:a.n}))},{g:'Trainer-Einschätzung',items:RATINGS.map(r=>({id:'r:'+r.k,n:r.n}))},{g:'Athletik (Trainer)',items:ATH_RATINGS.map(r=>({id:'r:'+r.k,n:r.n}))},{g:'Torwart',items:[{id:'a:torwart',n:'Torwart gesamt'},...GK_RATINGS.map(r=>({id:'r:'+r.k,n:'TW: '+r.n}))]}];
function catVal(s,cat,pid){const[t,k]=cat.split(':');if(t==='g'){const lv=s.live;if(!lv||!lv.goals)return null;const played=((lv.mins||{})[pid]||0)>0||lv.goals.some(g=>(g.on||[]).includes(pid));if(!played)return null;const b=gameBal(lv,pid);return k==='tore'?b.tore:b.vorl;}if(t==='t')return s.results?.[pid]?.[k];if(t==='a')return areaScore(s,pid,k);return s.ratings?.[pid]?.[k];}
function catMeta(cat){const[t,k]=cat.split(':');if(t==='g')return{u:k==='tore'?'Tore':k==='vorl'?'Vorl.':'',lower:false};if(t==='t')return{u:TEST[k].u,lower:!!TEST[k].lower};if(t==='a')return{u:'',lower:false};return{u:'/5',lower:false};}
// Rechen-Zwischenspeicher: gilt bis zur nächsten gespeicherten Änderung (DV zählt bei jedem saveLocal/loadTeam hoch)
let DV=0,CC={k:null,sw:{},sv:{}};
function calcCache(){const k=DV+'|'+CUR+'|'+(S.archView||'')+'|'+formWeeks()+'|'+srcMode()+'|'+Object.keys(S.sessions||{}).length+'|'+Object.keys(S.players||{}).length;if(CC.k!==k)CC={k,sw:{},sv:{}};return CC;}
function sessionsWith(cat){const C=calcCache();if(C.sw[cat])return C.sw[cat];const ps=plist(true);return C.sw[cat]=slist().filter(s=>ps.some(p=>isNum(catVal(s,cat,p.id))));}
function latestVal(cat,pid,ss){const multi=isRA(cat);const vals=[];for(const s of ss){const v=catVal(s,cat,pid);if(isNum(v)){if(!multi)return v;vals.push(v);if(vals.length===3)break;}}return vals.length?avg(vals):null;}
// Schnitt nur über Bereiche, die sich in den Form-Wochen bewegt haben – sonst verwässern unberührte Bereiche (beim Torwart z. B. alle Feldwerte) die Zahl (Christian 11.11.2026).
// Ohne Einschätzung/Test (z. B. Torwart nur mit Live-Aktionen) startet die Form bei 3 = Teamschnitt, also wird auch dagegen verglichen (Christian 11.11.2026)
function formRows(ps){const cats=[...RATINGS,...ATH_RATINGS,...GK_RATINGS].map(r=>'r:'+r.k);const ss={};cats.forEach(c=>ss[c]=sessionsWith(c));
  return ps.map(p=>{const ds=[];cats.forEach(c=>{let po=srcVal(c,p.id,ss[c],'pot');const fo=srcVal(c,p.id,ss[c],'form');if(!isNum(po)&&isNum(fo))po=3;if(isNum(po)&&isNum(fo)&&Math.abs(fo-po)>=.01)ds.push({c,d:fo-po});});if(!ds.length)return null;ds.sort((a,b)=>b.d-a.d);return{p,d:avg(ds.map(x=>x.d)),top:ds[0],low:ds[ds.length-1]};}).filter(Boolean);}
// Gesamtstärke fürs Kader: Wert auf der besten Feldposition wie in der Aufstellung, immer mit Werte aus „Mix“ und Zeitraum „Mix“; Torwart-Wert getrennt
function overallAll(ps){const c=S.cfg=S.cfg||{},o={src:c.src,per:c.per},out={};c.src='mix';c.per='mix';
  try{ps.forEach(p=>{if(p.guest)return;const pr=profileOf(p.id);const b=bestField(p,pr);const g=pr['a:torwart'];out[p.id]={f:b.cov>0?b.v:null,pt:b.pt,tw:isNum(g)?g:null};});}
  finally{c.src=o.src;c.per=o.per;}return out;}
function overallOf(pid){const p=S.players[pid];if(!p)return null;const o=overallAll([{...p,id:pid}])[pid];return o?(isNum(o.f)?o.f:o.tw):null;}
// Wer ist in Form? Form (letzte Wochen) gegen Potenzial (ganze Saison), Schnitt über alle Einschätzungs-Kategorien
function formOverview(){

function liveSeason(){const C=calcCache();if(C.ls)return C.ls;const gs=slist().filter(s=>s.live),out={};
  plist().forEach(p=>{const r={p,m:0,n:0,t:0,v:0,par:0,P:0,N:0,gf:0,ga:0,imp:null};gs.forEach(s=>{const lv=s.live,mi=(lv.mins||{})[p.id]||0,b=gameBal(lv,p.id),par=(lv.actions||[]).filter(a=>a.p===p.id&&a.t==='+'&&a.c==='parade').length;if(!mi&&!b.tore&&!b.vorl&&!par)return;r.n++;r.m+=mi;r.t+=b.tore;r.v+=b.vorl;r.par+=par;r.P+=(lv.plus||{})[p.id]||0;r.N+=(lv.minus||{})[p.id]||0;r.gf+=b.gf;r.ga+=b.ga;});if(r.n)out[p.id]=r;});

  const el=Object.values(out).filter(r=>r.m>0);

function weakFoot(pid){const p=S.players[pid];if(!p||(p.foot!=='links'&&p.foot!=='rechts'))return null;const C=calcCache();C.wf=C.wf||{};if(pid in C.wf)return C.wf[pid];

const FOOT_B=.15;

// Zuordnung Kinder → Plätze. „Stärkste“: größte Summe (ungarische Methode, auch für 10 + 1 schnell).
// „Ausgewogen“: erst die schwächste Position so stark wie möglich, dann die größte Summe.
function hungarian(C){// C: k Zeilen × n Spalten (k<=n), minimiert; gibt je Zeile die Spalte zurück
  const k=C.length,n=C[0].length,INF=1e18,u=new Array(k+1).fill(0),v=new Array(n+1).fill(0),p=new Array(n+1).fill(0),way=new Array(n+1).fill(0);

    do{used[j0]=true;const i0=p[j0];let d=INF,j1=0;for(let j=1;j<=n;j++)if(!used[j]){const cur=C[i0-1][j-1]-u[i0]-v[j];if(cur<minv[j]){minv[j]=cur;way[j]=j0;}if(minv[j]<d){d=minv[j];j1=j;}}
      for(let j=0;j<=n;j++){if(used[j]){u[p[j]]+=d;v[j]-=d;}else minv[j]-=d;}j0=j1;}while(p[j0]!==0);
    do{const j1=way[j0];p[j0]=p[j1];j0=j1;}while(j0);}

function bestLineup(slots,players,mode){
  const n=players.length,k=slots.length;if(n<k)return null;
  const R=players.map(p=>slots.map(s=>slotFit(p,p._pr,s).v));

  const F=R.map((r,j)=>r.map((v,i)=>posBan(players[j].id,slots[i])?v-100:v));

  else{const vals=[...new Set(F.flat())].sort((a,b)=>a-b);
    const ok=t=>{const m=hungarian(slots.map((_,i)=>players.map((_,j)=>F[j][i]>=t-1e-9?0:1)));return m.every((j,i)=>F[j][i]>=t-1e-9);};

}

const ACT_MAP_P={zweik:{mut:.5},raus:{zweik:.5,mut:.5,tw_komm:.5},eroeff:{pass:.5},stell:{spielv:.5}}; // Torwart-Plus wirkt auch aufs Spielernetz (Christian 11.11.2026)
// Nur für Minus-Aktionen: „versteckt“ ist fehlender Mut; Torwart „nicht rausgekommen / weggedreht“ zählt halb auf Mut im Spielernetz (Christian 11.11.2026)
const ACT_MAP_M={lauf:{mut:.5},weg:{mut:.5}};
const actMap=a=>{const b=ACT_MAP[a.c];if(!b)return b;const x=(a.t==='+'?ACT_MAP_P:ACT_MAP_M)[a.c];return x?{...b,...x}:b;};
const PASS_TESTS=['pass_r','pass_l'];

function testPick(cat,pid,since){const all=sessionsWith(cat).filter(s=>s.type!=='game'),ss=all.filter(s=>!since||(s.date||'')>=since);if(since){const v=latestVal(cat,pid,ss);return isNum(v)?v:latestVal(cat,pid,all);}const v=ss.map(s=>catVal(s,cat,pid)).filter(isNum);return v.length?Math.max(...v):null;}
function appVals(pid,since){
  const games=slist().filter(s=>s.live&&Array.isArray(s.live.actions)&&(!since||(s.date||'')>=since));
  const agg={};
  games.forEach(s=>s.live.actions.forEach(a=>{if(a.p!==pid||!a.c)return;const m=actMap(a);if(!m)return;for(const[k,w]of Object.entries(m)){const g=agg[k]||(agg[k]={p:0,m:0,n:0});if(a.t==='+')g.p+=w;else g.m+=w;g.n++;}}));
  const out={};
  // Aktionen wie Zusatzbewertungen: Plus = 5, Minus = 1, Start beim eigenen Potenzial-Wert (sonst 3) mit Puffer APP_BUF (2 = doppelt so stark wie früher 4: 2 Aktionen wirken wie früher 4).
  // w = Gewicht im Mix: 2 Aktionen = halbes, 6 Aktionen = 75 % Gewicht.
  // Startwert = dein unter Potenzial eingetragener Wert des Kindes (ganze Saison); nur ohne Eintrag 3. Live-Aktionen bestätigen ihn, schieben ihn hoch oder korrigieren ihn nach unten.
  const anchor=k=>{const c=(RATINGS.some(r=>r.k===k)||GK_RATINGS.some(r=>r.k===k)||ATH_RATINGS.some(r=>r.k===k)?'r:':'a:')+k;const v=periodVal(c,pid,sessionsWith(c),'pot');return isNum(v)?v:3;};
  for(const[k,g]of Object.entries(agg)){const b=anchor(k);out[k]={v:(5*g.p+g.m+b*APP_BUF)/(g.p+g.m+APP_BUF),n:g.n,w:g.n/(g.n+APP_BUF),src:'Spiele',base:b};}
  const tests=s=>s.type!=='game';
  ['tempo','gewandt','kraft','ausdauer','technik'].forEach(ak=>{
    const t=testPick('a:'+ak,pid,since);if(!isNum(t))return;
    if(out[ak]){out[ak]={v:(out[ak].v+t)/2,n:out[ak].n,w:1,src:'Spiele + Tests'};}else out[ak]={v:t,n:null,w:1,src:'Tests'};
  });
  {const v=['schuss_r','schuss_l','schuss'].map(tk=>testPick('t:'+tk,pid,since)).filter(isNum).map(raw=>1+Math.min(10,raw)/10*4);if(v.length){const t=avg(v);out.abschluss=out.abschluss?{v:(out.abschluss.v+t)/2,n:out.abschluss.n,w:1,src:'Spiele + Tests'}:{v:t,n:null,w:1,src:'Tests'};}}
  {const pv=PASS_TESTS.map(tk=>testPick('t:'+tk,pid,since)).filter(isNum).map(raw=>1+Math.min(10,raw)/10*4);
   if(pv.length){const t=avg(pv);if(out.pass)out.pass={v:(out.pass.v+t)/2,n:out.pass.n,w:1,src:'Spiele + Tests'};else out.pass={v:t,n:null,w:1,src:'Tests'};}}
  for(const[tk,rk]of Object.entries(GK_TEST_MAP)){
    const raw=testPick('t:'+tk,pid,since);if(!isNum(raw))continue;const t=1+Math.min(10,raw)/10*4;
    if(out[rk])out[rk]={v:(out[rk].v+t)/2,n:out[rk].n,w:1,src:'Spiele + Tests'};else out[rk]={v:t,n:null,w:1,src:'Tests'};
  }
  const fk=['spielv','frei','zweik','pass','dribb','ueber','mut','abschluss','technik','tempo','gewandt','kraft','ausdauer'].filter(k=>out[k]);
  out._gesamt=fk.length?{v:avg(fk.map(k=>out[k].v)),n:fk.length,w:avg(fk.map(k=>out[k].w))}:null;
  const gk=GK_RATINGS.map(r=>r.k).filter(k=>out[k]);
  out._tw=gk.length?{v:avg(gk.map(k=>out[k].v)),n:gk.length,w:avg(gk.map(k=>out[k].w))}:null;
  return out;
}
function cmpCard(pid){

  h+=`<details style="margin-top:8px"><summary class="sub">So rechnet die App</summary><div class="wt">Jede kategorisierte Plus-/Minus-Aktion aus Live-Spielen (im gewählten Zeitraum) zählt für die passenden Bereiche (z. B. Toller Pass → Übersicht und Technik). Start ist dein unter Potenzial eingetragener Wert des Kindes (nur ohne Eintrag 3). Jedes Plus zählt wie eine 5, jedes Minus wie eine 1, dazu dein Wert doppelt: Live-Aktionen bestätigen ihn, schieben ihn hoch oder korrigieren ihn nach unten – mit wenigen Aktionen nur leicht. Technik kommt zusätzlich aus den Testtagen; die Athletik (Schnelligkeit = Sprints, Dynamik = Slalom + Sprung, Ausdauer = Pendellauf) nur aus den Testtagen (3 = Teamschnitt). ⚠ = Trainer und App liegen mindestens 1 Punkt auseinander (ab 5 Aktionen). „Gesamt“ der App enthält auch die Athletik, deins nur deine Einschätzung.</div></details></div>`;
  return h;
}

const ACT2FOCUS={pass:'pass',dribb:'dribb',schuss:'schuss',lauf:'lauf',zweik:'zweik',entsch:'entsch',parade:'tw',fang:'tw',raus:'tw',stell:'tw',eroeff:'tw'};
function trainingFocus(){
  const ps=plist();const games=slist().filter(s=>s.live&&Array.isArray(s.live.actions)).slice(0,4);
  const act={};games.forEach(s=>s.live.actions.forEach(a=>{const f=ACT2FOCUS[a.c];if(!f)return;const g=act[f]||(act[f]={p:0,m:0});if(a.t==='+')g.p++;else g.m++;}));
  const out=[];
  for(const[k,F]of Object.entries(FOCUS)){
    const parts=[],basis=[];
    const g=act[k];if(g&&g.p+g.m>=4){parts.push(3+2*(g.p-g.m)/(g.p+g.m+4));basis.push(`Aktionen: ${g.p} + / ${g.m} −`);}
    const rv=[];ps.forEach(p=>F.r.forEach(rk=>{const v=latestVal('r:'+rk,p.id,sessionsWith('r:'+rk));if(isNum(v))rv.push(v);}));
    if(rv.length>=3){const m=avg(rv);parts.push(m);basis.push(`Trainer-Schnitt ${fnum(r1(m))}`);}
    if(!parts.length)continue;
    const kids=ps.map(p=>{const vs=F.r.map(rk=>latestVal('r:'+rk,p.id,sessionsWith('r:'+rk))).filter(isNum);return{p,v:vs.length?avg(vs):null};}).filter(x=>isNum(x.v)).sort((a,b)=>a.v-b.v).slice(0,3).filter(x=>x.v<3.5);
    out.push({k,F,v:avg(parts),basis,kids});
  }
  return out.sort((a,b)=>a.v-b.v);
}
function focusCard(){
  const fs=trainingFocus();
  if(!fs.length)return `<details class="card"><summary><b>🎯 Trainingsschwerpunkte</b></summary><div class="sub" style="margin-top:6px">Sobald du Kinder einschätzt oder Live-Aktionen mit Kategorie erfasst, schlägt die App hier Schwerpunkte fürs Training vor.</div></details>`;
  const top=fs.slice(0,3);
  return `<details class="card"><summary><b>🎯 Trainingsschwerpunkte:</b> ${top.map(f=>f.F.n).join(', ')}</summary><div class="sub" style="margin:6px 0">Die schwächsten Team-Bereiche aus deinen Einschätzungen und den Live-Aktionen der letzten 4 Spiele. Die Übungen sind Vorschläge – pass sie an euer Training an.</div>${top.map(f=>`<div class="focus"><div class="row between"><b>${f.F.n}</b><span class="pill">${fnum(r1(f.v))} / 5</span></div><div class="sub">${f.basis.join(' · ')}${f.kids.length?` · besonders fördern: ${f.kids.map(x=>esc(short(x.p.id))).join(', ')}`:''}</div>${f.F.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><div>${esc(e[1])}</div><div class="sub">Worauf achten: ${esc(e[2])}</div></div>`).join('')}</div>`).join('')}</details>`;
}
const STRENGTH_TXT={spielv:'Du verstehst das Spiel richtig gut und weißt oft schon vorher, wohin der Ball muss.',frei:'Du bietest dich super an und läufst dich clever frei.',zweik:'Im Zweikampf bist du stark und gibst nicht auf.',ueber:'Du hast den Überblick und siehst deine Mitspieler.',mut:'Du bist mutig – im Zweikampf, im Dribbling und wenn es drauf ankommt.',pass:'Deine Pässe kommen an – du spielst richtig gut ab.',dribb:'Du dribbelst richtig stark und hast den Ball eng am Fuß.',komm:'Du redest mit deinen Mitspielern und hilfst dem Team.',abschluss:'Vor dem Tor bist du eiskalt und triffst richtig gut.',technik:'Du hast eine tolle Ballbehandlung.',tempo:'Du bist richtig schnell!',gewandt:'Du bist super wendig, flink und hast einen starken Antritt.',kraft:'Du hast eine starke Sprungkraft.',ausdauer:'Du hast eine Riesen-Ausdauer und läufst bis zum Schluss.',torwart:'Im Tor kann sich das Team auf dich verlassen.'};
const STRENGTH_NAME={spielv:'Spielverständnis',frei:'Freilaufen',zweik:'Zweikampf',ueber:'Überblick',mut:'Mut',pass:'Passspiel',dribb:'Dribbling',komm:'Teamgeist & Reden',abschluss:'Abschluss',technik:'Technik',tempo:'Schnelligkeit',gewandt:'Dynamik',kraft:'Sprungkraft',ausdauer:'Ausdauer',torwart:'Torwart'};
function vStrength(){
  const pid=S.playerId,p=S.players[pid];if(!p)return `<div class="empty">Spieler nicht gefunden.</div>`;
  const AV=appVals(pid);const T=k=>latestVal('r:'+k,pid,sessionsWith('r:'+k));
  const cand=[];
  RATINGS.forEach(r=>{const vs=[T(r.k),AV[r.k]?.v].filter(isNum);if(vs.length)cand.push({k:r.k,v:avg(vs)});});
  if(AV.technik)cand.push({k:'technik',v:AV.technik.v});
  [['tempo','schnell'],['gewandt','dyn'],['ausdauer','ausd']].forEach(([k,rk])=>{const vs=[AV[k]?.v,T(rk)].filter(isNum);if(vs.length)cand.push({k,v:avg(vs)});});
  if(AV.kraft&&!isNum(T('dyn')))cand.push({k:'kraft',v:AV.kraft.v});
  GK_RATINGS.forEach(r=>{const vs=[T(r.k),AV[r.k]?.v].filter(isNum);if(vs.length)cand.push({k:'torwart',v:avg(vs)});});
  const top=cand.sort((a,b)=>b.v-a.v).filter((x,i,a)=>a.findIndex(y=>y.k===x.k)===i).slice(0,3);
  const ss=slist().reverse();const prog=[];
  TESTS.forEach(t=>{const pts=ss.map(s=>s.results?.[pid]?.[t.k]).filter(isNum);if(pts.length<2)return;const d=pts[pts.length-1]-pts[0];const better=t.lower?d<0:d>0;if(!better)return;const rel=Math.abs(d)/Math.max(.01,Math.abs(pts[0]));prog.push({t,d:Math.abs(Math.round(d*100)/100),rel});});
  prog.sort((a,b)=>b.rel-a.rel);
  const best={};slist().forEach(s=>((s.live&&s.live.actions)||[]).forEach(a=>{if(a.p===pid&&a.t==='+'&&a.c)best[a.c]=(best[a.c]||0)+1;}));
  const bestTop=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c,n])=>{const cat=[...ACT_F,...ACT_G].find(x=>x.k===c);return `${cat.p} (${n}×)`;});
  const goals=p.goals||[];const done=goals.filter(g=>g.status==='erreicht'),act=goals.filter(g=>g.status!=='erreicht');
  const first=(p.name||'').trim().split(/\s+/)[0];
  let h=`<div class="noprint row between"><button class="back" onclick="A.openPlayer('${pid}')">‹ Profil</button><button class="btn sm2" onclick="A.printCard()">Drucken / PDF</button></div>`;
  h+=`<div class="skarte"><div class="skh"><img src="icon-192.png" alt="" width="44" height="44"><div><div class="skt">Stärkenkarte</div><div class="sks">${esc(TEAMS[CUR]?.name||'')} · ${new Date().toLocaleDateString('de-DE')}</div></div></div><div class="skn">${esc(first)}</div>`;
  h+=top.length?`<div class="sksec"><div class="skl">⭐ Das kannst du richtig gut</div>${top.map(x=>`<div class="ski"><b>${STRENGTH_NAME[x.k]}</b><div>${STRENGTH_TXT[x.k]}</div></div>`).join('')}</div>`:'';
  if(bestTop.length)h+=`<div class="sksec"><div class="skl">💪 Deine besten Aktionen im Spiel</div><div class="ski">${bestTop.join(' · ')}</div></div>`;
  if(prog.length)h+=`<div class="sksec"><div class="skl">📈 Hier bist du besser geworden</div>${prog.slice(0,2).map(x=>`<div class="ski">${esc(x.t.n.replace('TW: ','Torwart – '))}: ${x.t.lower?fnum(x.d)+' '+x.t.u+' schneller':'+'+fnum(x.d)+' '+x.t.u}</div>`).join('')}</div>`;
  if(done.length)h+=`<div class="sksec"><div class="skl">✅ Geschafft</div>${done.slice(-3).map(g=>`<div class="ski">${esc(g.text)}</div>`).join('')}</div>`;
  if(act.length)h+=`<div class="sksec"><div class="skl">🚀 Daran arbeiten wir gerade</div>${act.slice(0,2).map(g=>`<div class="ski">${esc(g.text)}${g.status==='besser'?' – wird schon besser!':''}</div>`).join('')}</div>`;
  if(!top.length&&!prog.length&&!done.length&&!act.length&&!bestTop.length)h+=`<div class="ski">Noch zu wenige Daten – nach dem nächsten Testtag oder Spiel füllt sich die Karte.</div>`;
  h+=`<div class="skf">Weiter so, ${esc(first)}! – Dein Trainerteam</div></div>`;
  h+=`<div class="sub noprint" style="margin-top:8px">Bewusst ohne Ranglisten und Minuspunkte. Zum Teilen am einfachsten einen Screenshot machen.</div>`;
  return h;
}

 {v:85,items:['<b>Aufstellung: Mitte und außen getrennt bewertet.</b> In der Mitte (Abwehr Mitte, Mittelfeld Mitte, einzige Spitze) zählen Spielverständnis und Übersicht mehr, außen eher Tempo, Ausdauer und Dribbling. Halbpositionen zählen als Mitte. Die Prozente stehen unter „So rechnet die App“.','<b>Schwacher Fuß:</b> Neue Tests „Torschuss Ecken links“ und „rechts“. Aus Pass- und Schusstests links/rechts berechnet die App, wie gut der schwache Fuß ist, und gibt auf der anderen Seite anteilig Fuß-Bonus. Starker Fuß außen jetzt links und rechts gleich +0,15. Ab 85 % schlägt das Profil „beidfüßig“ vor.']},
 {v:84,items:['Form ohne Doppelzählung: Liegen die Spiele eines gerade abgeschlossenen Blocks noch in den letzten Form-Wochen, zählen sie nur in der Form und erst danach ins Potenzial. Die Form springt dadurch nicht mehr, wenn ein Block endet.']},

 {v:78,items:['Lange Namen werden auf den Spielfeld-Karten und auf der Bank wieder mit „…“ gekürzt statt umgebrochen – das Spielfeld bleibt ruhiger.']},
 {v:77,items:['Neue Spielformen: Funino (ohne Torwart) mit Auswahl 2 gegen 2, 3 gegen 3 oder 4 gegen 4 sowie 7 + 1 bis 10 + 1. Erst die Spielform wählen, dann erscheinen die passenden Formationen (z. B. 4-4-2, 4-3-3, 3-5-2). Bei Funino gibt es kein Tor-Feld, alle Kinder sind Feldspieler.','Bei großen Formationen werden die Karten automatisch schmaler, damit fünf Kinder nebeneinander passen.','Aufstellung: Die Bank steht jetzt kompakt in drei Spalten direkt am Spielfeld, der Hinweis „passt nicht zur Position“ erscheint gleich darunter. Die Aufstellung rechnet auch bei 10 + 1 in Sekundenbruchteilen.']},
 {v:76,items:['Aufstellung aufgeräumt: Spielform, Formation und Stärkste/Ausgewogen stehen in einer Zeile, „Dabei“ ist eingeklappt, das Spielfeld steht fast ganz oben und die Bank direkt darunter am Spielfeld. Danach Spielzeit-Einteilung und „Live mit dieser Aufstellung“, ganz unten Torwart-Info, „Warum hier?“ und „So rechnet die App“.','Aufstellung und Wechselvorschläge rechnen jetzt immer mit Mix-Werten (Trainer + App, Potenzial + Form) – genau wie die Gesamtstärke im Kader. Die Auswahl „Werte aus“ und „Zeitraum“ gibt es weiter in den Ranglisten.']},
 {v:75,items:['Mehr Zeit nach einem Tor: Die Auswahl von Torschütze und Vorlage bleibt jetzt jeweils 10 Sekunden offen (vorher 7 und 6).']},
 {v:74,items:['Die Aufstellung beachtet jetzt dieselben festen Regeln wie die Wechselvorschläge: Wer im Zweikampf unter dem Mannschaftsschnitt liegt, wird nicht für die Abwehr eingeplant, wer im Abschluss unter 3 liegt, nicht für den Sturm. Geht es mit den anwesenden Kindern nicht anders (oder bei deiner eigenen Aufstellung), zeigt ein Hinweis, wer betroffen ist.']},
 {v:73,items:['Neue Sturmstärke: Abschluss 30 % und Dribbling 25 % machen jetzt den größten Teil aus (vorher 10 % und 15 %). Dazu Tempo 15 %, Freilaufen 10 %, Mut 10 %, Technik 5 %, Gewandtheit 5 %. Das wirkt auf Wechselvorschläge, Aufstellung und Gesamtstärke.']},
 {v:72,items:['Wechselvorschläge verteilen zwei Einwechselspieler jetzt gemeinsam: Wer besser in die Abwehr passt, wird für die Abwehr vorgeschlagen, der andere fürs Mittelfeld oder den Sturm.','Neue Abwehrstärke: Zweikampfverhalten 40 % und Mut 20 % machen jetzt den größten Teil aus (vorher Zweikampf 30 %, Mut gar nicht). Dazu Spielverständnis 15 %, Tempo 10 %, Kommunikation 10 %, Sprungkraft 5 %. Das wirkt auch auf Aufstellung und Gesamtstärke.','Feste Regeln für Wechselvorschläge: Wer im Zweikampf unter dem Mannschaftsschnitt liegt, wird nie für die Abwehr vorgeschlagen, wer im Abschluss unter 3 liegt, nie für den Sturm. Geht es anders nicht, schlägt die App einen Positionstausch vor oder lässt den Vorschlag weg.']},
 {v:71,items:['Klügere Wechselvorschläge: Wer von der Bank kommt, wird immer auf einer seiner starken Positionen vorgeschlagen, nicht einfach dort, wo gerade jemand lange gespielt hat. Passt keine freie Position, rückt ein Mitspieler auf (z. B. „Lea rückt nach Sturm“) – ein Tipp erledigt beides. Die Spielzeit bleibt fair: Raus geht nur, wer deutlich länger gespielt hat.']},
 {v:70,items:['Spielzeit-Ampel: „knapp“ ist jetzt deutlich gelb statt orange und lässt sich so klar von Rot unterscheiden.']},
 {v:69,items:['Torwart gerechter bei den Stärken: Auf der Stärkenkarte tritt jeder Torwartwert einzeln an, genau wie die Feldwerte, statt nur als Durchschnitt. Saisonbericht und Saison-Rückblick zeigen die Torwartwerte jetzt auch bei Stärken und Entwicklung.']},
 {v:68,items:['Mehr Zeit beim Plus und Minus: Die Auswahl der Kategorie bleibt jetzt 8 statt 5 Sekunden offen.']},
 {v:67,items:['Eine Vorlage zählt jetzt auch für die Werte: Der Vorbereiter bekommt automatisch ein Plus „Torvorlage“, das auf Passspiel und Übersicht wirkt, leicht auch auf Spielverständnis. Ein guter Pass und „Abspiel verpasst“ zählen jetzt ebenfalls leicht für Spielverständnis.']},
 {v:66,items:['<b>🏆 Turniermodus:</b> In den Live-Optionen „Turnierspiel“ anhaken. Spielzeit, Ampel und Wechselvorschläge zählen dann über alle Spiele des Tages. „Speichern & nächstes Turnierspiel“ startet gleich das nächste Spiel.','<b>🅰 Vorlagen:</b> Nach dem Torschützen kannst du die Vorlage antippen (auch nachträglich unter „Aktionen“). Vorlagen gibt es als Rangliste, im Profil und im Spielbericht.','<b>⏱ Vor dem Abpfiff:</b> Der 2-Minuten-Hinweis nennt alle Kinder, die unter dem Spielzeit-Ziel liegen. In der letzten Phase steht das auch über der Bank.','<b>Spielzeit der Saison</b> unter Ranglisten: Minuten und Anteil je Kind über alle Live-Spiele.','<b>Bildschirm bleibt an:</b> neuer Schalter in den Live-Optionen.']},
 {v:65,items:['Form: Hat ein Kind keinen neuen Test, zählt sein letzter Test weiter, zusammen mit den aktuellen Live-Aktionen. Der Mannschaftsschnitt zählt nur noch, wenn ein Kind noch nie getestet wurde.']},
 {v:64,items:['Gerechtere Stärkenberechnung: Fehlt einem Kind ein Wert (z. B. beim Testtag gefehlt), zählt dort der Mannschaftsschnitt. Fehlen bringt so keinen Vor- oder Nachteil mehr.','Eine einzelne Einschätzung zählt noch nicht voll: Der Mannschaftsschnitt zählt wie eine weitere Bewertung dazu.','Gesamtstärke: Spielweise und Positionstreue zählen nur noch in der Aufstellung, der Bonus für den starken Fuß ist für alle gleich.','Behoben: Testwerte in „App“ und „Mix“ beachten jetzt den Zeitraum, Werte bleiben immer zwischen 1 und 5.']},
 {v:63,items:['Kader: Die Bezeichnung „Torwart“ steht jetzt immer direkt vor dem Torwart-Wert.']},
 {v:62,items:['Kader: Bei Kindern mit Feld- und Torwart-Wert steht jetzt der höhere Wert groß und zählt für die Reihenfolge. Der andere Wert steht klein darunter.']},
 {v:61,items:['Der Kader ist jetzt nach Gesamtstärke sortiert, das stärkste Kind steht oben. Kinder ohne Wert und inaktive Kinder stehen am Ende.']},
 {v:60,items:['Gesamtstärke im Kader = der höchste Wert, den das Kind auf einer Feldposition erreichen kann, jetzt inklusive Bonus für den starken Fuß. Bei den Wechselspielern in der Aufstellung steht derselbe Wert.','Rangliste: Bei „Aktuell vorne je Bereich“ stehen wieder die vollen Namen.']},
 {v:59,items:['Die Gesamtstärke im Kader entspricht jetzt dem Wert aus der Aufstellung: beste Feldposition des Kindes mit Werte aus „Mix“ und Zeitraum „Mix“. Der Torwart-Wert steht getrennt darunter.']},
 {v:58,items:['Rangliste: „Aktuell vorne je Bereich“ ist wieder sauber lesbar. Die Namen stehen jetzt unter dem Bereich und laufen nicht mehr aus der Karte.']},
 {v:57,items:['Die Gesamtstärke im Kader wird neu berechnet: zur Hälfte aus Spielverhalten und Technik, zur Hälfte aus der Athletik. Bisher zählte die Athletik zwei Drittel. Bei Torhütern zählt der Torwart-Wert als dritter Teil mit.']},
 {v:56,items:['Die Datensicherung steht jetzt nur noch in den Einstellungen (ganz oben), nicht mehr zusätzlich unter Kader. Der Filter in der Bewertungsliste erscheint schon ab zwei Einträgen.']},{v:55,items:['<b>Bewertungsliste:</b> Filter für Spiele, Einschätzungen und Testtage, nach Monaten gegliedert.','<b>Kader:</b> zeigt jetzt die Gesamtstärke jedes Kindes und ▲/▼ für die aktuelle Form.','<b>Profil:</b> Live-Bilanz zeigt die letzten 5 Spiele (Rest ausklappbar), Verlaufslinien sind bei vielen Einschätzungen geglättet.','<b>Spielbericht:</b> Im Spiel unter „Export“ gibt es einen fertigen Text für die Elterngruppe mit Ergebnis und Torschützen, ohne Bewertungen.','<b>Live:</b> Hinweis 2 Minuten vor Ende jeder Halbzeit.','<b>Einstellungen:</b> Datensicherung steht oben, der Rest ist einklappbar.']},{v:54,items:['Dunkles Design: Steht dein Handy auf Dark Mode, wird TrainerRadar automatisch dunkel. Die Stärkenkarte fürs Kind und die PDFs bleiben hell.']},{v:53,items:['Einstellungen: TrainerRadar bleibt kostenlos. Wer dem Entwickler einen Kaffee spendieren möchte, findet dort jetzt einen Knopf.']},{v:52,items:['Live-Spiel: Minus-Auswahl gestrafft auf 7 Knöpfe, so viele wie Plus mit Tor. „Chance vergeben“ entfällt, „Großchance vergeben“ steht an seiner Stelle. Bisher erfasste Aktionen zählen weiter.']},{v:51,items:['Live-Spiel: Beim Minus gibt es jetzt „Großchance vergeben“ für eine 100-prozentige Torchance. Sie zählt beim Torschuss doppelt so stark wie „Chance vergeben“.']},{v:50,items:['Live-Spiel: Beim Minus gibt es jetzt „Abspiel verpasst“. Es zählt negativ für Passspiel und Übersicht.']},{v:49,items:['Deutlich schneller bei vielen Daten: Rangliste, Aufstellung und Profile rechnen nur noch neu, wenn sich etwas geändert hat.','Nach „Saison abschließen“ holt eine ältere Sicherung keine Spiele oder Bewertungen der abgeschlossenen Saison zurück.']},{v:48,items:['Beim Einlesen einer Sicherung oder eines Kaders werden bei vorhandenen Kindern leere Angaben (Fuß, Spielweise, Positionstreue) ergänzt. Deine eigenen Angaben werden nie überschrieben.']},{v:47,items:['Doppelt erfasste Spiele: Hat nur der andere den Torschützen eingetragen, wird er übernommen. Tor-Plus und Torstatistik passen immer zusammen.']},{v:46,items:['Beim Spieler heißt der Knopf jetzt „Mit anderem Kind zusammenführen“.']},
 {v:45,items:['„Zusammenführen“ beim Spieler und bei der Mannschaft steht jetzt in einer eigenen Zeile und ragt nicht mehr aus dem Bildschirm.']},
 {v:44,items:['Datensicherung aufgeräumt: Der Knopf „Text einfügen“ ist weg, „Sicherung einlesen“ reicht.']},
 {v:43,items:['<b>📤 Sicherung teilen:</b> Neuer Knopf neben „Sicherung speichern“ (Kader → Datensicherung). Schickt die Sicherung direkt per WhatsApp, Mail oder AirDrop.','<b>Doppelt erfasste Spiele:</b> Habt ihr dasselbe Spiel auf zwei Handys live erfasst, legt „Sicherung einlesen“ beide zusammen: Pro Kind zählen die Aktionen aus der Erfassung, die bei diesem Kind genauer war. So zählt nichts doppelt, und dein breiter Blick bleibt genauso erhalten wie der genaue Blick des anderen. Schon doppelt vorhandene Spiele zeigt die App unter „Bewertung“ an, ein Tipp legt sie zusammen.','<b>Sicherer zusammenführen:</b> Kinder, die schon gemeinsam in einer Bewertung vorkommen, schlägt die App nie als doppelt vor (z. B. zwei echte Leons). Jedes Zusammenführen lässt sich 24 Stunden lang mit „↶ Rückgängig“ zurücknehmen.']},
 {v:42,items:['<b>Spieler zusammenführen:</b> Steht ein Kind doppelt im Kader (z. B. weil du und dein Co-Trainer den Kader getrennt angelegt habt), zeigt der Kader „Doppelt im Kader?“. Ein Tipp legt alle Bewertungen, Testwerte, Spiele und Ziele bei einem Eintrag zusammen. Geht auch einzeln über ✏️ → „Zusammenführen“.','<b>Mannschaften zusammenführen:</b> Kommt der Kader des Co-Trainers als eigene Mannschaft an, holst du sie unter Mannschaft → Bearbeiten → „Zusammenführen“ in deine Mannschaft.','<b>Nur Kader teilen</b> (Einstellungen → Datensicherung, zusätzlich zur Sicherung): eine Datei nur mit den Namen der Kinder, ohne Bewertungen, Messwerte und Notizen. Ideal, damit der Co-Trainer mit denselben Kindern startet.']},
 {v:41,items:['<b>Fairere App-Werte:</b> Live-Aktionen zählen jetzt auch im App-Wert wie Zusatzbewertungen (Plus = 5, Minus = 1). Aktionen wirken doppelt so stark wie bisher (2 Aktionen = früher 4). Im Mix hat der App-Wert wenig Gewicht, solange es nur wenige Aktionen sind. Starke Kinder, z. B. im Tor, werden so nicht mehr Richtung 3 gezogen.']},
 {v:40,items:['<b>Saison-Rückblick für die Kinder</b> (Einstellungen): zwei bunte PDF-Seiten pro Kind – „So hast du dich entwickelt“ als Netz (Saisonbeginn und -ende), Rekorde beim Testtag, Highlights wie bestes Spiel und erstes Tor, Abzeichen, geschaffte Ziele und eine Nachricht vom Trainerteam. Jedes Kind wird nur mit sich selbst verglichen.','Die Nachricht für den Rückblick trägst du beim Spieler unter ✏️ ein. Ohne Text bleibt Platz zum Reinschreiben.']},
 {v:39,items:['<b>Stärkenprofil mit zwei Netzen:</b> Im Spielerprofil zeigt das Netzdiagramm jetzt Form (letzte Wochen, gefüllt) und Potenzial (ganze Saison, gestrichelt) übereinander – passend zu „Werte aus“.']},
 {v:38,items:['<b>Torwart in der Aufstellung:</b> „Stärkste“ und „Ausgewogen“ besetzen jetzt auch das Tor. Die App rechnet aus, mit wem im Tor die ganze Aufstellung am besten ist. Fest wählen geht weiterhin.','<b>Zwei Werte für Torwart-Kinder:</b> Kinder mit Torwart-Bewertung zeigen in der Aufstellung und auf der Bank ihren Feld- und ihren Torwart-Wert (z. B. „3,7 · TW 3,5“).']},
 {v:37,items:['<b>Gastspieler:</b> In der Aufstellung unter „Wer ist heute dabei?“ mit „+ Gast“ Kinder aus der 2. Mannschaft oder dem Mädchenteam hinzufügen. Gäste haben keine Werte, füllen nur Plätze, die sonst frei blieben, und tauchen nicht im Kader oder in den Ranglisten auf. Im Live-Spiel kannst du sie ganz normal einsetzen und wechseln. ✕ entfernt einen Gast wieder.']},
 {v:36,items:['<b>Offene Aktionen:</b> Nach dem Spielende springt die App direkt zu den Aktionen ohne Kategorie bzw. Toren ohne Torschütze („Nur offene“). In der Bewertungsliste zeigt „X offen“, wo noch etwas fehlt. Ohne Kategorie zählt eine Aktion nicht für die Werte.','<b>🔍 Warum hier?</b> Unter der Aufstellung siehst du je Spieler die Teilwerte der Position samt Gewicht und die Zu-/Abschläge für Fuß, Spielweise und Positionstreue.','<b>Wer ist in Form?</b> Oben in den Ranglisten: Kinder, die in den letzten Wochen deutlich über (▲) oder unter (▼) ihrem Saisonniveau liegen, mit der stärksten Veränderung.','Kleinigkeiten aus dem Komplett-Test: Ein Spiel ohne Gegnernamen heißt jetzt „Spiel“ statt „Spiel gegen“, Hinweistexte in Aufstellung und Ranglisten passen zu „Werte aus“ und Zeitraum.']},
 {v:35,items:['Aufstellung aufgeräumt: „Mix“ steht bei „Werte aus“ und „Zeitraum“ jeweils rechts untereinander, die Wochen-Auswahl für die Form in einer Zeile.','<b>Mix ist zurück:</b> „Werte aus“ bietet wieder Trainer, App und <b>Mix</b> (Standard). „Trainer“ = nur deine Einschätzungen (ohne Tests) plus Live-Aktionen als Zusatzbewertungen, „App“ = Live-Aktionen und Tests, Mix = Mittelwert aus beiden.']},
 {v:34,items:['<b>Live zählt mit:</b> Jede Plus-Aktion im Spiel zählt wie eine zusätzliche 5, jede Minus-Aktion wie eine 1, und das direkt auf deine Einschätzung und die Testwerte. 4 Aktionen wiegen so viel wie eine Bewertung, Live macht höchstens die Hälfte eines Werts aus.','„Werte aus“ heißt jetzt Trainer, <b>Trainer + Live</b> (Standard) und Nur App.']},
 {v:33,items:['<b>Potenzial &amp; Form:</b> Potenzial = alle Werte der Saison, Form = die letzten 4, 6 oder 8 Wochen. Aufstellung und Ranglisten rechnen standardmäßig mit dem Mittelwert (Mix), umschaltbar. Im Spielerprofil stehen beide nebeneinander.','Gewichtung angepasst: Im Mittelfeld zählt Passspiel mehr, im Sturm zählt der <b>Abschluss</b> mit (10 %).','Neue Kategorie <b>Abschluss / Torschuss</b> in der Trainereinschätzung. Bisherige Bewertungen bleiben, du kannst Abschluss einfach nachtragen. Die App rechnet ihn zusätzlich aus „Guter Abschluss“ und Toren.']},
 {v:32,items:['Aufstellung: Unter dem Feld zeigt „🧤 Torwart“, woher der Torwart-Wert kommt (welche Bewertung, welche Einträge) und warum das Kind im Tor steht.']},
 {v:31,items:['<b>Wechselvorschlag</b> im Live-Spiel: Die App schlägt vor, wer als Nächstes reinkommt – nach Spielzeit und passender Position. Ein Tipp wechselt.','<b>Saisonbericht pro Kind</b> als PDF (Einstellungen): Spiele, Minuten, Tore, Stärken, Entwicklung und Ziele – ideal fürs Elterngespräch, auch für archivierte Saisons.','Nach „Spiel beenden“ bietet die App direkt an, eine <b>Sicherung</b> zu speichern.']},
 {v:30,items:['Im <b>Kader</b> pro Kind jetzt auch <b>Spielweise</b> (offensiv, ausgewogen, defensiv) und <b>Positionstreue</b> (hoch, mittel, gering). Der Aufstellungsvorschlag berücksichtigt das – z. B. Abzug für einen offensiven Verteidiger, der seine Position oft verlässt.','Aufstellung zeigt, aus welchen Bewertungen der Torwart-Wert stammt.']},
 {v:29,items:['<b>Werte aus Trainer, App oder Mix:</b> In Aufstellung und Ranglisten wählst du, ob deine Einschätzung, die App-Werte aus Live-Spielen und Testtagen oder ein Mittelwert aus beiden zählen.','<b>Tor/Vorlage = Plus:</b> Ein Tor zählt automatisch als positive Aktion „Guter Abschluss“ für den Torschützen, eine Vorlage als „Torvorlage“ (Passspiel, Übersicht, etwas Spielverständnis) für den Vorbereiter. Abschaltbar unter „Optionen“ im Live-Reiter.','<b>Aufgeräumte Live-Seite:</b> Uhr, Spielstand und Pause in einer Zeile, ein Knopf für alle Karten, Formation und Spielzeit-Ziel unter „Optionen“ – das ganze Feld passt ohne Scrollen auf den Bildschirm.','<b>Saison-Archiv</b> in den Einstellungen: alte Testtage, Spiele und Einschätzungen archivieren, jederzeit ansehen, als Datei sichern oder zurückholen.']},
 {v:28,items:['Darstellungsfehler behoben: Listen in „Was ist neu“ und in der Anleitung überlappten auf dem iPhone.','Die komplette <b>Anleitung als PDF</b> gibt es jetzt unter Einstellungen – immer auf dem Stand der aktuellen Version.']},
 {v:26,items:['Spielverlauf wird immer exakt nach Spielzeit sortiert.','Fehlerbehebungen im Live-Spiel: Kein Spieler kann mehr doppelt (Feld und Bank) auftauchen, auch nach mehrfachem „Zurück“.','„↶ Zurück“ nimmt jetzt auch ein versehentliches „Halbzeit beenden“ oder den Abpfiff zurück.','Anleitung in den Einstellungen aktualisiert.']},
 {v:25,items:['Spielminuten wie im Fußball: Nachspielzeit als <b>„15+1“</b>, der nächste Abschnitt beginnt immer bei der richtigen Minute (z. B. <b>16′</b>).']},
 {v:24,items:['<b>Spielzeit-Einteilung</b> vor dem Spiel: durchgehend, 2 Halbzeiten oder 4 Viertel, Minuten frei wählbar. Halbzeit/Viertel beenden, Nachspielzeit-Anzeige.','<b>Wieder einwechseln</b> klappt beliebig oft – alle Einsätze werden mit Minuten notiert und die Spielzeit addiert.']},
 {v:23,items:['Bei Toren, Karten und Wechseln wird die <b>Spielminute</b> notiert. Neuer <b>Spielverlauf</b> im Live-Spiel und im gespeicherten Spiel.','Neuer Bereich <b>Einstellungen</b> (⚙︎ oben rechts): Spielerprofile als PDF, aktuelle Anleitung, Datensicherung.','„Was ist neu“ erscheint nach jedem Update einmal automatisch.']},
 {v:22,items:['<b>Tor</b> zählt sofort – danach 7 Sekunden Zeit, den Torschützen anzutippen.','<b>Gelbe, Gelb-Rote und Rote Karte</b> im Live-Spiel. Platzverweise werden vom Feld genommen.','Torschützen lassen sich nach dem Spiel unter „Aktionen“ nachtragen.']},
 {v:21,items:['Die App heißt jetzt <b>TrainerRadar</b>.']},
 {v:20,items:['Neue Einschätzungs-Kategorie <b>Passspiel</b>.','Bewertungsknöpfe stehen sauber untereinander.']},
 {v:19,items:['Am <b>Testtag</b> wird nur noch gemessen. Einschätzungen über „+ Trainereinschätzung“ oder nach Spielen.']},
 {v:16,items:['<b>Athletik</b> (Schnelligkeit, Dynamik, Ausdauer) in der Trainereinschätzung. <b>Dribbling</b> und <b>Mut</b> als eigene Kategorien.']},
 {v:12,items:['Reiter <b>Bewertung</b> mit Spiel, Testtag und Trainereinschätzung.']},
 {v:11,items:['Tore mit Tor-Bilanz auf dem Feld, Spielzeit-Ampel, Entwicklungsziele, Trainingsschwerpunkte und Stärkenkarte.']}
];
function whatsNew(all){
  const seen=all?0:(META.seenVersion||0);const list=CHANGELOG.filter(c=>c.v>seen);if(!list.length)return;
  showModal(`<h3>🎉 Was ist neu${all?'':' in Version '+APP_VERSION}</h3>${list.slice(0,all?99:4).map(c=>`<div class="cl"><div class="clv">Version ${c.v}</div><ul class="dot">${c.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}<div class="row end" style="margin-top:10px"><button class="btn pri" onclick="A.closeModal()">Alles klar</button></div>`);
  META.seenVersion=+APP_VERSION;saveLocal();
}
const GUIDE=[
 ['Erste Schritte',`<ol class="st"><li><b>Mannschaft benennen:</b> oben auf den Mannschaftsnamen (z. B. „U10 ▾“) tippen. Dort legst du auch weitere Mannschaften an.</li><li><b>Kader anlegen:</b> Reiter <b>Kader</b> → „+ Spieler“. Vornamen reichen. Optional: Spielweise und Positionstreue – beides fließt in die Aufstellung ein.</li><li><b>Daten sammeln:</b> Testtag, Trainereinschätzung oder direkt ein Live-Spiel.</li><li><b>Sichern:</b> Einstellungen oder Kader → „Sicherung speichern“ → z. B. iCloud Drive.</li></ol>`],
 ['Live-Erfassung im Spiel',`<ol class="st"><li><b>Aufstellung</b> vorbereiten (Spielform, Formation, Torwart, wer ist da) und per Antippen anpassen. Darunter die <b>Spielzeit-Einteilung</b> wählen: durchgehend, 2 Halbzeiten oder 4 Viertel, Minuten pro Abschnitt. Dann „▶ Live mit dieser Aufstellung“.</li><li><b>Anpfiff</b> startet die Uhr, „Pause“ hält sie an. Sie läuft weiter, auch wenn das Handy gesperrt ist.</li><li><b>Halbzeit/Viertel:</b> Ist die Zeit um, wird die Uhr rot und zeigt die Nachspielzeit. „Halbzeit beenden“ stoppt die Uhr, danach „2. Halbzeit anpfeifen“. Am Ende „Abpfiff“.</li><li><b>Spielminuten</b> wie im Fußball: Nachspielzeit als „15+1“, das 2. Viertel beginnt bei 16′.</li><li><b>Plus/Minus</b> unter jedem Spieler. Danach 8 Sekunden Zeit für eine Kategorie (z. B. „Toller Pass“) – oder „Später“.</li><li><b>Tor</b> zählt sofort, danach 10 Sekunden den Torschützen und anschließend 10 Sekunden die Vorlage antippen. Der Torschütze bekommt automatisch ein Plus „Guter Abschluss“ (abschaltbar unter „Optionen“). <b>Gegentor</b> mit einem Tipp.</li><li><b>Karten:</b> „Karte“ antippen, Gelb, Gelb-Rot oder Rot wählen, dann den Spieler. Die zweite Gelbe wird automatisch Gelb-Rot. Platzverweise verlassen das Feld.</li><li><b>Wechseln:</b> Spieler antippen (leuchtet), dann Bankspieler = Wechsel oder Feldspieler = Positionstausch. Ausgewechselte Kinder können beliebig oft zurück – alle Einsätze werden addiert.</li><li><b>💡 Wechselvorschlag:</b> Ab Minute 3 schlägt die App über der Bank bis zu zwei Wechsel vor (wenig gespielt rein, länger gespielt raus). Wer reinkommt, landet auf einer seiner starken Positionen. Ist dort niemand zum Auswechseln, rückt ein Mitspieler auf den frei werdenden Platz. Nie in die Abwehr, wer im Zweikampf unter dem Mannschaftsschnitt liegt, nie in den Sturm bei Abschluss unter 3. Antippen = Wechsel.</li><li><b>Spielzeit-Ampel:</b> grün im Ziel, gelb knapp, rot zu wenig. Das Ziel, die Formation und „Tor/Vorlage = Plus“ stellst du unter <b>Optionen</b> ein. Die Bank ist nach Spielzeit sortiert. Unter „Spielzeiten“ siehst du jeden Einsatz. 2 Minuten vor Ende jeder Halbzeit erinnert dich die App an letzte Wechsel.</li><li><b>↶</b> (neben „Halbzeit beenden“) nimmt die letzte Aktion zurück – auch Tore, Karten, Wechsel und das Ende eines Abschnitts.</li><li><b>Spiel beenden &amp; speichern:</b> Ergebnis ist eingetragen. Die App bietet direkt an, eine Sicherung zu speichern. Danach bewerten, unter „Aktionen“ offene Kategorien und Torschützen zuordnen sowie Aktionen, Tore und Gegentore nachtragen, löschen oder einem anderen Kind zuordnen, unter „Verlauf“ den Spielverlauf ansehen, unter „Export“ den fertigen Spielbericht für die Elterngruppe teilen.</li></ol>`],
 ['Bewertung',`<ul class="dot"><li><b>⏱ Testtag:</b> nur messen. Tests auswählen, Anleitung beachten, Zeiten mit der Stoppuhr übernehmen (der bessere Versuch bleibt).</li><li><b>📝 Trainereinschätzung:</b> 1–5 für Spielverständnis, Passspiel, Dribbling, Mut, Abschluss, Athletik u. v. m., optional Torwart. Dazu Ziele und Notiz.</li><li><b>⚽ Spiel:</b> entsteht aus dem Live-Spiel oder über „+ Spiel“. Danach die Kinder bewerten.</li><li>Es zählt der Schnitt der letzten 3 Bewertungen je Kind.</li></ul>`],
 ['Aufstellung',`<ul class="dot"><li>„Stärkste“ = höchste Gesamtstärke, „Ausgewogen“ = keine Schwachstelle. Feste Regeln: Zweikampf unter Mannschaftsschnitt nie Abwehr, Abschluss unter 3 nie Sturm (gilt auch für Wechselvorschläge).</li><li><b>Zeitraum:</b> Potenzial (ganze Saison), Form (letzte 4/6/8 Wochen) oder Mix (Standard). Gilt auch für die Ranglisten.</li><li>Spielweise und Positionstreue aus dem Kader geben Zu- oder Abschläge je Position (z. B. offensiver Verteidiger mit geringer Positionstreue: −0,5 in der Abwehr).</li><li><b>Werte aus:</b> „Trainer“ = nur deine Einschätzung ohne Tests (Tempo, Dynamik, Ausdauer aus deiner Athletik-Einschätzung, Technik aus Dribbling und Passspiel), dazu jede Live-Aktion als Zusatzbewertung (Plus = 5, Minus = 1, 4 Aktionen = 1 Bewertung, Live höchstens die Hälfte). „App“ = Werte aus Live-Aktionen und Testtagen. „Mix“ (Standard) = Mittelwert aus „Trainer“ und „App“. Gilt auch für die Ranglisten.</li><li>Torwart fest wählen oder „Automatisch“: Dann besetzen „Stärkste“ bzw. „Ausgewogen“ auch das Tor, mit dem Kind, mit dem die ganze Aufstellung am besten ist. Kinder mit Torwart-Bewertung zeigen beide Werte (Feld und „TW“). „🧤 Torwart“ zeigt, aus welchen Bewertungen der Torwart-Wert stammt und warum das Kind im Tor steht.</li><li>Spieler antippen, dann Ziel antippen = eigene Aufstellung. Sie bleibt gespeichert.</li><li><b>Gastspieler:</b> „+ Gast“ unter „Wer ist heute dabei?“. Gäste haben keine Werte, füllen nur freie Plätze und erscheinen nicht im Kader und in den Ranglisten. ✕ entfernt sie.</li><li><b>🔍 Warum hier?</b> zeigt je Spieler die Teilwerte der Position mit Gewicht und die Zu-/Abschläge.</li></ul>`],
 ['Profil, Ranglisten &amp; Stärkenkarte',`<ul class="dot"><li><b>Profil:</b> Stärkenprofil (Netz mit Technik, Abschluss, Spielintelligenz, Zweikampf, Athletik, Mentalität; Form gefüllt, Potenzial gestrichelt), bei Torhütern zusätzlich ein eigenes Torwart-Netz, Potenzial &amp; Form (▲/▼ = gerade über/unter Saisonniveau), Entwicklung der Messwerte, Trainer vs. App, Live-Bilanz, Ziele.</li><li><b>Trainer vs. App:</b> deine Einschätzung neben dem Wert aus Tests und Spielen. ⚠ = deutliche Abweichung.</li><li><b>Wer ist in Form?</b> oben in den Ranglisten: die drei Kinder, die gerade am stärksten über (▲) und unter (▼) ihrem Saisonniveau liegen.</li><li><b>👀 Blinder Fleck</b> in den Ranglisten: Kinder, die du in den letzten 6 Wochen deutlich seltener notiert hast als die anderen.</li><li><b>📊 Mannschafts-Bilanz:</b> Siege, Unentschieden, Niederlagen, Torverhältnis, letzte Spiele und wann die Tore fallen.</li><li><b>Saison-Statistik</b> in den Ranglisten: Tore, Vorlagen, Scorer, Paraden und Spielzeit, gesamt oder je 45 Minuten, mit Torschützenkönig, Top-Vorlagengeber und Torwart der Saison. <b>Impact:</b> bis zu drei grüne ▲ oder rote ▼ neben dem Namen zeigen, wie stark ein Kind das Spiel im Vergleich zur Mannschaft beeinflusst (Plus/Minus-Aktionen und Tore auf dem Feld je 45 Minuten, ohne Zahlen; wer wenig gespielt hat, bleibt nah am Schnitt).</li><li><b>Rangliste nach Bereich:</b> nur für dich. Bei Einschätzungs-Kategorien wählst du Trainer, App oder Mix. Zum Zeigen eignet sich die Fortschritts-Rangliste.</li><li><b>Saisonbericht</b> (Einstellungen): pro Kind ein PDF mit Entwicklung, Stärken, Spielminuten und Zielen fürs Elterngespräch – auch für archivierte Saisons. <b>Saison-Rückblick</b> für die Kinder selbst: zwei bunte Seiten mit Entwicklung, Testtag-Rekorden, Highlights, Abzeichen und einer Nachricht vom Trainerteam (Text beim Spieler unter ✏️).</li><li><b>Stärkenkarte:</b> kindgerecht, ohne Ranglisten und Minuspunkte – per Screenshot teilen.</li></ul>`],
 ['Co-Trainer &amp; Datensicherung',`<ul class="dot"><li>Alle Daten liegen nur auf diesem Gerät – kein Konto, keine Cloud.</li><li>Gleicher Kader für den Co-Trainer: „Sicherung speichern“, Datei schicken, beim Co-Trainer „Sicherung einlesen“.</li><li>Gegenseitig eingelesene Sicherungen ergänzen fehlende Daten – gelöscht wird nichts.</li><li><b>Wichtig:</b> Die App erkennt Kinder nicht am Namen, sondern an einer Kennung. Den Kader legt deshalb nur einer an und teilt ihn („Nur Kader teilen“ oder Sicherung), der andere liest ihn ein, <i>bevor</i> er selbst Kinder anlegt. Doppelte Kinder oder eine doppelte Mannschaft lassen sich zusammenführen (Kader bzw. Mannschaft → Bearbeiten).</li><li>Habt ihr ein Spiel beide live erfasst, legt das Einlesen beide zusammen: pro Kind zählt die genauere Erfassung.</li><li><b>Saison-Archiv</b> (Einstellungen): „Saison abschließen“ verschiebt alte Bewertungen ins Archiv und speichert eine Archiv-Datei. „Ansehen“ zeigt Ranglisten und Profile der alten Saison, „Zurückholen“ macht es rückgängig.</li></ul>`],
 ['Datenschutz',`<ul class="dot"><li>Vornamen oder Kürzel verwenden, Handy mit Code sperren.</li><li>Spielerprofil-PDFs und Sicherungen nicht öffentlich teilen.</li><li>Empfehlung: Eltern informieren, dass du zur Förderung Trainingsdaten notierst.</li></ul>`]
];

async function saveJSONFile(name,json,title){
  const blob=new Blob([json],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer: coarse)').matches){await navigator.share({files:[file],title});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;
}

const SUMK=new Set(['plus','minus','mins']);
function pidRemap(o,src,dst,pk){

    if(SUMK.has(pk)&&isNum(d)&&isNum(v))out[dst]=d+v;else if(Array.isArray(d)&&Array.isArray(v))out[dst]=[...d,...v];
    else if(d&&v&&typeof d==='object'&&typeof v==='object')out[dst]=Object.assign({},v,d);}}
  return out;}

// ---------- Modal & Toast ----------
function showModal(html){const m=$('#modal');m.innerHTML=`<div class="mbg" onclick="A.closeModal()"></div><div class="mbox" role="dialog">${html}</div>`;m.classList.add('open');}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.innerHTML='';}
function toast(t,ms){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms||2400);}
function sessionModal(s){
  S.draft=s;
  if(s.type==='eval')return showModal(`<h3>${s.id?'Einschätzung bearbeiten':'Neue Trainereinschätzung'}</h3><label>Datum<input type="date" id="m_date" value="${esc(s.date)}"></label><label>Titel<input id="m_title" value="${esc(s.title)}" autocomplete="off"></label><div class="sub" style="margin:0 0 14px">Für deine Einschätzung zwischendurch, z. B. nach einem Training. Sie bildet mit den Messwerten das Potenzial und fließt so in Profil, Ranglisten und Aufstellung ein.</div><div class="row end gap">${s.id?`<button class="btn danger" onclick="A.askDelSession('${s.id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.saveSession()">Speichern</button></div>`);
  if(s.type==='game')return showModal(`<h3>${s.id?'Spiel bearbeiten':'Neues Spiel'}</h3><label>Datum<input type="date" id="m_date" value="${esc(s.date)}"></label><label>Gegner / Titel<input id="m_title" value="${esc(s.title)}" autocomplete="off"></label><label>Ergebnis (optional)<input id="m_result" value="${esc(s.result||'')}" placeholder="z. B. 3:2" autocomplete="off"></label><div class="sub" style="margin:0 0 14px">Danach bewertest du jedes Kind, das gespielt hat, in den 6 Bereichen. Das zählt mit den Live-Aktionen zur Form und nach dem Form-Block ins Potenzial.</div><div class="row end gap">${s.id?`<button class="btn danger" onclick="A.askDelSession('${s.id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.saveSession()">Speichern</button></div>`);
  showModal(`<h3>${s.id?'Testtag bearbeiten':'Neuer Testtag'}</h3><label>Datum<input type="date" id="m_date" value="${esc(s.date)}"></label><label>Titel<input id="m_title" value="${esc(s.title)}" autocomplete="off"></label><div class="lbl">Tests auswählen</div>${TEST_GROUPS.map(a=>`<div class="sub">${a.n}</div><div class="chips">${TESTS.filter(t=>t.area===a.k).map(t=>`<button class="chip ${s.tests.includes(t.k)?'on':''}" onclick="A.togDraft('${t.k}',this)">${esc(t.n)}</button>`).join('')}</div>`).join('')}<div class="sub" style="margin:10px 0 14px">Am Testtag wird nur gemessen. Deine Einschätzung gibst du über „+ Trainereinschätzung“ oder nach Spielen.</div><div class="row end gap">${s.id?`<button class="btn danger" onclick="A.askDelSession('${s.id}')">Löschen</button><span class="grow"></span>`:''}<button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.saveSession()">Speichern</button></div>`);
}

// ---------- Aktionen ----------
const A={
  closeModal,
  liveFromLineup(force){
    const R=S.luRes;if(!R){toast('Keine Aufstellung berechnet.');return;}
    if(S.live&&!force){showModal(`<h3>Laufendes Live-Spiel ersetzen?</h3><p>Plus/Minus und Spielzeiten des aktuellen Live-Spiels gehen verloren, wenn du es nicht vorher beendest.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.liveFromLineup(true)">Ersetzen</button></div>`);return;}
    closeModal();const pos={};FORMS[R.n][R.form].forEach(k=>pos[k]=null);R.res.forEach(r=>pos[r.slot]=r.p.id);if(!noGK(R.n))pos.TW=R.keeper||null;
    {const oi=$('#lu_opp');if(oi)S.lu.opp=oi.value.trim();}
    S.live=newLive(R.n,R.form,pos,R.bench.slice());if(S.lu.opp)S.live.opp=S.lu.opp;S.liveSel=null;liveSave();A.go('live');
  },
  liveEmpty(){const n=S.lu.n,form=FORMS[n][S.lu.form]?S.lu.form:Object.keys(FORMS[n])[0];const pos={};FORMS[n][form].forEach(k=>pos[k]=null);if(!noGK(n))pos.TW=null;S.live=newLive(n,form,pos,plist().map(p=>p.id));S.liveSel=null;liveSave();render(true);},
  liveTour(on){const L=S.live;if(!L)return;if(!on)L.tour=null;else{const t=slist().find(s=>s.date===today()&&s.live&&s.live.tour);L.tour=t?{id:t.live.tour,name:t.live.tourName||'Turnier'}:{id:uid('tr'),name:'Turnier '+fdate(today())};}liveSave();render(true);toast(on?`🏆 ${L.tour.name}${t0n(L)}`:'Kein Turnierspiel');},
  liveSub(slot,pid,to){const L=S.live;if(!L||!L.bench.includes(pid))return;S.liveSel={kind:'slot',key:slot};A.liveTap('bench',pid);if(to&&L.pos[to]&&to!==slot){const mv=L.pos[to];S.liveSel={kind:'slot',key:slot};A.liveTap('slot',to);toast(`${short(pid)} rein, ${short(mv)} rückt nach ${slotLabel(slot)}`);}},
  liveTap(kind,key){
    const L=S.live,sel=S.liveSel;if(!L)return;
    if(!sel){S.liveSel={kind,key};render(true);return;}
    if(sel.kind===kind&&sel.key===key){S.liveSel=null;render(true);return;}
    if(sel.kind==='bench'&&kind==='bench'){S.liveSel={kind,key};render(true);return;}
    accrue(L);
    if(sel.kind==='slot'&&kind==='slot'){const a=L.pos[sel.key];L.pos[sel.key]=L.pos[key];L.pos[key]=a;L.log.push({t:'swap',a:sel.key,b:key});}
    else{const slot=sel.kind==='slot'?sel.key:key,bp=sel.kind==='bench'?sel.key:key,out=L.pos[slot];L.pos[slot]=bp;L.bench=L.bench.filter(x=>x!==bp);if(out)L.bench.push(out);L.log.push({t:'sub',slot,inP:bp,outP:out||null,...gameMin(L),ts:Date.now()});toast(`${short(bp)} rein${out?' für '+short(out):''}`);}
    S.liveSel=null;liveSave();render(true);
  },
  liveAct(pid,d){const L=S.live;if(!L)return;const o=d>0?L.plus:L.minus;o[pid]=(o[pid]||0)+1;const e={t:d>0?'+':'-',p:pid,id:uid('a'),c:null,...gameMin(L),gk:L.pos.TW===pid};L.log.push(e);try{navigator.vibrate&&navigator.vibrate(15);}catch(x){}liveSave();render(true);showSheet(e);},
  sheetPick(id,c){const L=S.live;if(L){const e=L.log.find(x=>x.id===id);if(e){const cats=e.gk?ACT_G:ACT_F;const cc=cats.find(x=>x.k===c);if(cc){e.c=c;liveSave();toast((e.t==='+'?cc.p:cc.m)+' · '+short(e.p));}}}A.sheetHide();},
  sheetHide(){clearTimeout(sheetT);const el=$('#sheet');if(el)el.classList.remove('open');},
  astSet(i,pid){const s=clone(S.sessions[S.sessionId]);const g=s.live&&s.live.goals&&s.live.goals[i];if(!g)return;g.a=g.a===pid?null:pid;g.id=g.id||uid('g');astSync(s.live,g);saveDoc('sessions',S.sessionId,s);render(true);},
  goalSet(i,pid){const s=clone(S.sessions[S.sessionId]);const g=s.live&&s.live.goals&&s.live.goals[i];if(!g)return;if(pid==='og'){g.og=!g.og;g.p=null;g.a=null;}else{g.p=g.p===pid?null:pid;g.og=false;if(g.a===g.p)g.a=null;}
    const lv=s.live;g.id=g.id||uid('g');lv.plus=lv.plus||{};lv.actions=lv.actions||[];
    const j=lv.actions.findIndex(a=>a.goal===g.id);if(j>=0){const o=lv.actions[j];lv.plus[o.p]=Math.max(0,(lv.plus[o.p]||0)-1);lv.actions.splice(j,1);}
    if(g.p&&goalPlusOn()){lv.plus[g.p]=(lv.plus[g.p]||0)+1;lv.actions.push({t:'+',p:g.p,c:'schuss',at:isNum(g.at)?g.at:null,ml:g.ml,gk:false,goal:g.id});}
    astSync(lv,g);saveDoc('sessions',S.sessionId,s);render(true);},
  naOpen(){S.na={p:null,t:'+',gk:false,c:null};naModal();},
  naKid(el){S.na=S.na||{p:null,t:'+',gk:false,c:null};S.na.p=el.dataset.p;document.querySelectorAll('#na_p .chip').forEach(c=>c.classList.toggle('onp',c===el));},
  naSet(k,v){S.na=S.na||{p:null,t:'+',gk:false,c:null};if(k==='c'&&S.na.c===v)v=null;S.na[k]=v;if(k==='t'||k==='gk')S.na.c=null;if(k==='t')document.querySelectorAll('#na_t button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(v==='+')));const c=$('#na_c');if(c)c.innerHTML=naCats();},
  naSave(){const N=S.na;if(!N||!N.p){toast('Bitte zuerst ein Kind antippen');return;}const s=clone(S.sessions[S.sessionId]);const lv=s.live;lv.actions=lv.actions||[];lv.plus=lv.plus||{};lv.minus=lv.minus||{};const k=N.t==='+'?'plus':'minus';lv[k][N.p]=(lv[k][N.p]||0)+1;lv.actions.push({t:N.t,p:N.p,c:N.c||null,at:null,ml:null,gk:!!N.gk,late:1});saveDoc('sessions',S.sessionId,s);closeModal();S.actsAll=true;render(true);toast('Aktion nachgetragen');},
  actWho(i){const s=S.sessions[S.sessionId];const a=s&&s.live&&(s.live.actions||[])[i];if(!a)return;showModal(`<h3>Anderes Kind</h3><div class="sub" style="margin-bottom:8px">${a.t==='+'?'Plus':'Minus'}-Aktion ${mlOf(a)} – bisher bei ${esc(short(a.p))}.</div><div class="chips">${squadOf(s.live).map(p=>`<button class="chip ${a.p===p?'onp':''}" onclick="A.actWhoSet(${i},'${p}')">${esc(short(p))}</button>`).join('')}</div><div class="row end" style="margin-top:12px"><button class="btn" onclick="A.closeModal()">Abbrechen</button></div>`);},
  actWhoSet(i,pid){const s=clone(S.sessions[S.sessionId]);const lv=s.live,a=lv.actions[i];if(!a||a.p===pid){closeModal();return;}const k=a.t==='+'?'plus':'minus';lv[k]=lv[k]||{};lv[k][a.p]=Math.max(0,(lv[k][a.p]||0)-1);lv[k][pid]=(lv[k][pid]||0)+1;a.p=pid;saveDoc('sessions',S.sessionId,s);closeModal();render(true);},
  actDelAsk(i){const s=S.sessions[S.sessionId];const a=s&&s.live&&(s.live.actions||[])[i];if(!a)return;showModal(`<h3>Aktion löschen?</h3><p>${a.t==='+'?'Plus':'Minus'}-Aktion ${mlOf(a)} bei ${esc(short(a.p))}.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.actDel(${i})">Löschen</button></div>`);},
  actDel(i){const s=clone(S.sessions[S.sessionId]);const lv=s.live,a=lv.actions[i];if(!a)return;const k=a.t==='+'?'plus':'minus';lv[k]=lv[k]||{};lv[k][a.p]=Math.max(0,(lv[k][a.p]||0)-1);lv.actions.splice(i,1);saveDoc('sessions',S.sessionId,s);closeModal();render(true);toast('Aktion gelöscht');},
  gAdd(t){const s=clone(S.sessions[S.sessionId]);const lv=s.live;lv.goals=lv.goals||[];const on=Object.entries(lv.mins||{}).filter(([p,m])=>m>0&&S.players[p]).map(([p])=>p);lv.goals.push({id:uid('g'),t,p:null,a:null,og:false,at:null,ml:null,sec:null,on:on.length?on:squadOf(lv),ts:Date.now(),late:1});resSync(s);saveDoc('sessions',S.sessionId,s);render(true);toast(t==='goal'?'Tor nachgetragen – jetzt Torschützen antippen':'Gegentor nachgetragen');},
  gDelAsk(i){const s=S.sessions[S.sessionId];const g=s&&s.live&&(s.live.goals||[])[i];if(!g)return;showModal(`<h3>${g.t==='goal'?'Tor':'Gegentor'} löschen?</h3><p>${mlOf(g)||'Ohne Minute'}${g.p?' · '+esc(short(g.p)):''}. Das Ergebnis wird angepasst${g.t==='goal'&&(g.p||g.a)?', die Plus-Aktionen für Tor und Vorlage verschwinden mit':''}.</p><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.gDel(${i})">Löschen</button></div>`);},
  gDel(i){const s=clone(S.sessions[S.sessionId]);const lv=s.live,g=lv.goals[i];if(!g)return;lv.plus=lv.plus||{};lv.actions=(lv.actions||[]).filter(a=>{if(g.id&&(a.goal===g.id||a.ast===g.id)){lv.plus[a.p]=Math.max(0,(lv.plus[a.p]||0)-1);return false;}return true;});lv.goals.splice(i,1);resSync(s);saveDoc('sessions',S.sessionId,s);closeModal();render(true);toast('Gelöscht');},
  actCat(i,c){const s=clone(S.sessions[S.sessionId]);const a=s.live&&s.live.actions&&s.live.actions[i];if(!a)return;a.c=a.c===c?null:c;saveDoc('sessions',S.sessionId,s);render(true);},
  goalAdd(pid){S.goalPid=pid;showModal(`<h3>Neues Entwicklungsziel</h3><label>Ziel<input id="m_goal" placeholder="z. B. linken Fuß einsetzen" autocomplete="off"></label><div class="sub">Vorschläge:</div><div class="chips">${GOAL_SUG.map(g=>`<button class="chip" onclick="document.getElementById('m_goal').value=this.textContent">${g}</button>`).join('')}</div><div class="sub" style="margin:4px 0 12px">Konkret und beobachtbar formulieren – dann kannst du am Platz gut abhaken.</div><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn pri" onclick="A.goalSave()">Speichern</button></div>`);},
  goalSave(){const t=$('#m_goal').value.trim();if(!t){toast('Bitte ein Ziel eingeben.');return;}const pid=S.goalPid;const p=clone(S.players[pid]);p.goals=p.goals||[];p.goals.push({id:uid('z'),text:t,status:'offen',created:Date.now(),upd:Date.now()});saveDoc('players',pid,p);closeModal();render(true);},
  goalSt(pid,gid,st){const p=clone(S.players[pid]);const g=(p.goals||[]).find(x=>x.id===gid);if(!g)return;g.status=st;g.upd=Date.now();saveDoc('players',pid,p);render(true);if(st==='erreicht')toast('🎉 Ziel erreicht!');},
  goalDelAsk(pid,gid){showModal(`<h3>Ziel löschen?</h3><div class="row end gap"><button class="btn" onclick="A.closeModal()">Abbrechen</button><button class="btn danger" onclick="A.goalDel('${pid}','${gid}')">Löschen</button></div>`);},
  goalDel(pid,gid){const p=clone(S.players[pid]);p.goals=(p.goals||[]).filter(x=>x.id!==gid);saveDoc('players',pid,p);closeModal();render(true);},
  printCard(){try{window.print();}catch(e){toast('Drucken geht hier nicht – bitte Screenshot machen.');}},
  whatsNewAll(){whatsNew(true);},
  pdfTog(id){S.pdfSel=S.pdfSel||{};S.pdfSel[id]=!S.pdfSel[id];render(true);},
  pdfAll(on){S.pdfSel={};if(on)plist(true).forEach(p=>S.pdfSel[p.id]=true);render(true);},
  async pdfMake(kind){
    const ids=plist(true).filter(p=>S.pdfSel&&S.pdfSel[p.id]).map(p=>p.id);if(!ids.length)return;
    toast('PDF wird erstellt …');
    try{await loadJsPdf();}catch(e){toast('PDF-Baustein konnte nicht geladen werden – bitte einmal mit Internet öffnen.');return;}
    let doc;try{doc=kind==='season'?buildSeasonPdf(ids,S.seasonSrc):kind==='kid'?buildKidPdf(ids,S.seasonSrc):buildProfilePdf(ids);}catch(e){console.error(e);toast('PDF konnte nicht erstellt werden.');return;}
    const name=`TrainerRadar-${kind==='season'?'Saisonbericht':kind==='kid'?'Saison-Rueckblick':'Spielerprofile'}-${(TEAMS[CUR]?.name||'Team').replace(/[^\w-]+/g,'_')}-${today()}.pdf`;
    const blob=doc.output('blob');
    try{const file=new File([blob],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia('(pointer: coarse)').matches){await navigator.share({files:[file],title:kind==='season'?'Saisonbericht':kind==='kid'?'Saison-Rückblick':'Spielerprofile'});return;}
    }catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('PDF gespeichert');
  },
  cfgSet(k,v){S.cfg=S.cfg||{};S.cfg[k]=v;saveLocal();render(true);},
  goalAsk(){
    const L=S.live;if(!L)return;accrue(L);L.goals=L.goals||[];
    const e={t:'goal',p:null,...gameMin(L),on:liveField(L),id:uid('g'),ts:Date.now()};L.goals.push(e);L.log.push({t:'goal',id:e.id});liveSave();render(true);
    const sc=score(L);const rank=k=>k==='TW'?9:({S:0,M:1,A:2}[k[0]]*5+(SIDE_ORD[sideOf(k)]||0));const ps=Object.keys(L.pos).filter(k=>L.pos[k]).sort((a,b)=>rank(a)-rank(b)).map(k=>L.pos[k]);
    sheetOpen(`<div class="row between" style="margin-bottom:8px"><b>⚽ Tor! ${sc.gf}:${sc.ga} · Wer hat getroffen?</b><button class="btn sm2" onclick="A.sheetHide()">Später</button></div>${pitchPick(L,ps,pid=>`<button onclick="A.goalScorer('${e.id}','${pid}')">${esc(short(pid))}</button>`)}<div class="sprow og"><button onclick="A.goalScorer('${e.id}','og')">Eigentor Gegner</button></div></div>`,10000);
  },
  goalScorer(gid,pid){const L=S.live;const g=L&&(L.goals||[]).find(x=>x.id===gid);if(g){g.p=pid==='og'?null:pid;g.og=pid==='og';liveGoalPlus(L,g,g.p);if(g.a&&(g.og||g.a===g.p)){g.a=null;liveAstPlus(L,g,null);}liveSave();render(true);toast(pid==='og'?'Eigentor des Gegners':`⚽ ${short(pid)}`);if(pid!=='og'){astAsk(L,g);return;}}A.sheetHide();},
  goalAst(gid,pid){const L=S.live;const g=L&&(L.goals||[]).find(x=>x.id===gid);if(g){g.a=pid||null;liveAstPlus(L,g,g.a);liveSave();render(true);if(pid)toast(`🅰 Vorlage ${short(pid)}`);}A.sheetHide();},
  cardMenu(){sheetOpen(`<div class="row between" style="margin-bottom:8px"><b>Welche Karte?</b><button class="btn sm2" onclick="A.sheetHide()">Abbrechen</button></div><div class="cardrow"><button onclick="A.cardAsk('y')"><span class="yc"></span>Gelb</button><button onclick="A.cardAsk('yr')"><span class="yrc"></span>Gelb-Rot</button><button onclick="A.cardAsk('r')"><span class="rc"></span>Rot</button></div>`,0);},
  cardAsk(c){
    const L=S.live;if(!L)return;const ps=[...Object.values(L.pos).filter(Boolean),...L.bench];
    sheetOpen(`<div class="row between" style="margin-bottom:8px"><b><span class="${c==='y'?'yc':c==='yr'?'yrc':'rc'}"></span> ${CARD_N[c]} für …</b><button class="btn sm2" onclick="A.sheetHide()">Abbrechen</button></div><div class="sgrid cg">${ps.map(pid=>`<button onclick="A.cardGive('${c}','${pid}')">${esc(short(pid))}</button>`).join('')}</div>`,0);
  },
  cardGive(c,pid){
    const L=S.live;if(!L)return;accrue(L);L.cards=L.cards||[];L.sentOff=L.sentOff||[];
    let cc=c;if(c==='y'&&L.cards.some(x=>x.p===pid&&x.c==='y'))cc='yr';
    const e={t:'card',c:cc,p:pid,...gameMin(L),id:uid('k'),slot:null,ts:Date.now()};
    if(cc!=='y'){const slot=Object.keys(L.pos).find(k=>L.pos[k]===pid);if(slot){L.pos[slot]=null;e.slot=slot;}L.bench=L.bench.filter(x=>x!==pid);L.sentOff.push(pid);}
    L.cards.push(e);L.log.push({t:'card',id:e.id});A.sheetHide();liveSave();render(true);
    toast(`${CARD_N[cc]} · ${short(pid)}${cc==='yr'&&c==='y'?' (2. Gelbe)':''}${cc!=='y'?' – Platz ist frei':''}`);
  },
  goalPick(pid){const L=S.live;if(!L)return;accrue(L);L.goals=L.goals||[];const e={t:'goal',p:pid||null,...gameMin(L),on:liveField(L),id:uid('g')};L.goals.push(e);L.log.push({t:'goal',id:e.id});A.sheetHide();liveSave();render(true);const sc=score(L);toast(`⚽ ${pid?short(pid):'Tor'} · ${sc.gf}:${sc.ga}`);if(pid)astAsk(L,e);},
  concede(){const L=S.live;if(!L)return;accrue(L);L.goals=L.goals||[];const e={t:'conc',...gameMin(L),on:liveField(L),id:uid('g'),ts:Date.now()};L.goals.push(e);L.log.push({t:'conc',id:e.id});liveSave();render(true);const sc=score(L);toast(`Gegentor · ${sc.gf}:${sc.ga}`);},
  liveUndo(){
    const L=S.live;if(!L)return;const e=L.log.pop();if(!e)return;
    A.sheetHide();
    if(e.t==='+'||e.t==='-'){const o=e.t==='+'?L.plus:L.minus;o[e.p]=Math.max(0,(o[e.p]||0)-1);toast(`${e.t==='+'?'Plus':'Minus'} für ${short(e.p)} zurückgenommen`);}
    else if(e.t==='part'){if(e.fin)L.finished=false;else{L.part=e.prevPart;L.partStart=e.prevStart;(L.partStarts||[0]).length>1&&L.partStarts.pop();}toast(e.fin?'Abpfiff zurückgenommen':'Abschnittsende zurückgenommen');}
